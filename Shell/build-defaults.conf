# shellcheck shell=bash
#
# Copyright (c) 2023 @weigefenxiang
#
# 构建默认值统一配置,被各 diy2-*.sh source / Unified build defaults, sourced by every diy2-*.sh.
# 只允许纯 bash 变量赋值,不要写任何命令 / Plain bash variable assignments only — no commands allowed here.
# 改这里即全部源码生效;各脚本内另有 := 兜底,本文件丢失也不会中断构建 / Edit here to affect every source; each script keeps := fallbacks so a missing file never breaks a build.
#

# 默认 LAN IP(后台登录地址) / Default LAN IP (LuCI login address)
: "${WRT_LAN_IP:=192.168.1.1}"

# 默认时区:中国标准时间 / Default timezone: China Standard Time
: "${WRT_ZONENAME:=Asia/Shanghai}"
: "${WRT_TIMEZONE:=CST-8}"

# 默认 LuCI 主题 / Default LuCI theme
: "${WRT_THEME:=luci-theme-argon}"

# NTP 服务器四个槽位,国内源同步更快更稳 / Four NTP server slots — Chinese mirrors sync faster and more reliably inside China
: "${WRT_NTP_1:=ntp.aliyun.com}"
: "${WRT_NTP_2:=time1.cloud.tencent.com}"
: "${WRT_NTP_3:=cn.ntp.org.cn}"
: "${WRT_NTP_4:=cn.pool.ntp.org}"

# opkg 软件源镜像(北大镜像,仅 ImmortalWrt 系源码用到) / opkg mirror (PKU mirror; only ImmortalWrt-family sources use it)
: "${WRT_OPKG_MIRROR:=mirrors.pku.edu.cn/immortalwrt}"
