name: Prepare Typography Tokens

on:
  push:
    branches:
      - fix-E
    paths:
      - .github/workflows/typography-prepare.yml
      - tools/.typography-patch.mjs

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify bootstrap base
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix-E"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply approved typography standard
        run: node tools/.typography-patch.mjs

      - name: Remove temporary runner files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/typography-prepare.yml tools/.typography-patch.mjs

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/typography-prepare\.yml|tools/\.typography-patch\.mjs|VERSION|site/wrt/app\.css|site/wrt/data/site-version\.json|tools/test-catalog-ui-contract\.mjs)$'
          changed="$(git status --short | sed -E 's/^.. //' | sed -E 's/ -> / /' | awk '{print $NF}')"
          if [ -n "${changed}" ]; then
            printf '%s\n' "${changed}" | grep -Ev "${allowed}" && {
              echo "Unexpected files changed"
              exit 1
            } || true
          fi

      - name: Commit prepared change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: standardize site typography"
          git push origin HEAD:fix-E

      - name: Clean failed bootstrap files
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD || true
          git clean -fd || true
