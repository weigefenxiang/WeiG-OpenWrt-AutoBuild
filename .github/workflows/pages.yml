name: Standalone Web / 独立网页版

on:
  push:
    branches:
      - main
    paths:
      - "site/wrt/**"
      - "tools/gen-build-meta.mjs"
      - "tools/prepare-web-deployment.mjs"
      - "tools/stamp-site-version.mjs"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Prepare static site / 准备静态站点
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Validate source identity / 验证源码身份
        run: node tools/stamp-site-version.mjs --check

      - name: Prepare deployment metadata / 准备部署元数据
        run: node tools/prepare-web-deployment.mjs --commit "$GITHUB_SHA" --branch main

      - name: Configure Pages / 配置 Pages
        uses: actions/configure-pages@v6

      - name: Upload static artifact / 上传静态产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/wrt

  deploy:
    name: Deploy GitHub Pages / 部署 GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy / 部署
        id: deployment
        uses: actions/deploy-pages@v5
