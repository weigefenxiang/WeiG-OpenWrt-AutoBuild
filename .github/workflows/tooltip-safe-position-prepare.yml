name: Prepare Tooltip Safe Positioning
run-name: Prepare Tooltip Safe Positioning

on:
  push:
    branches:
      - fix-E
    paths:
      - '.github/workflows/tooltip-safe-position-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify bootstrap base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "2c7aa09b768553ac157e4fe58fb0f5090dec2b08"
      - name: Apply approved tooltip positioning refinement
        run: python3 tools/tooltip-safe-position-patch.py
      - name: Remove temporary runner files
        run: git rm -f .github/workflows/tooltip-safe-position-prepare.yml tools/tooltip-safe-position-patch.py
      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare
      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify
      - name: Guard final change scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          allowed='^(VERSION|site/wrt/app\.js|site/wrt/data/site-version\.json|tools/test-catalog-ui-contract\.mjs|\.github/workflows/tooltip-safe-position-prepare\.yml|tools/tooltip-safe-position-patch\.py)$'
          bad="$(git status --porcelain | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            printf 'Unexpected changed files:\n%s\n' "$bad" >&2
            exit 1
          fi
      - name: Commit prepared change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep contextual tooltips visible near the pointer'
          git push origin HEAD:fix-E
      - name: Clean failed bootstrap files
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD || true
