name: fix-F1 UI modularization runner

on:
  push:
    branches: [fix-F1]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Extract and run the approved refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/fix-f1-ui-modularize.yml').read_text(encoding='utf-8')
          marker = 'cat > "$RUNNER_TEMP/refactor-ui.mjs" <<\'NODE\'\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n          NODE\n', start)
          lines = textwrap.dedent(source[start:end]).splitlines()
          for index, line in enumerate(lines):
              if 'legacy compatibilityAcknowledgement variable remains' in line:
                  del lines[index - 1:index + 2]
                  break
          Path('/tmp/refactor-ui.mjs').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          node /tmp/refactor-ui.mjs

      - name: Prepare release identity
        run: node tools/dev-assistant.mjs prepare

      - name: Run UI module regression
        run: node tools/test-ui-modules.mjs

      - name: Run complete project checks
        run: node tools/check-all.mjs

      - name: Verify expected change set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(VERSION|site/wrt/app\.js|site/wrt/index\.html|site/wrt/ui-components\.css|site/wrt/lib/(ui-session-state|ui-components|page-shell-ui)\.js|site/wrt/data/site-version\.json|tools/test-ui-modules\.mjs|tools/check-all\.mjs)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected changed path: $path"; exit 1; }
          done

      - name: Commit modularized UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name weigefenxiang
          git config user.email 119787190+weigefenxiang@users.noreply.github.com
          git add VERSION site/wrt/app.js site/wrt/index.html site/wrt/ui-components.css \
            site/wrt/lib/ui-session-state.js site/wrt/lib/ui-components.js site/wrt/lib/page-shell-ui.js \
            site/wrt/data/site-version.json tools/test-ui-modules.mjs tools/check-all.mjs
          git commit -m "refactor: modularize shared web UI infrastructure" \
            -m "Separate page-session compatibility state, reusable DOM controls, and page-shell behavior from the main application orchestrator. Preserve Catalog, Kconfig, schema 6, and build request semantics while adding executable module contracts and refreshing the release identity through the project preparation tool."
          git push origin HEAD:fix-F1
