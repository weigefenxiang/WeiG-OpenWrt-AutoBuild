name: fix-F1 UI modularization runner

on:
  push:
    branches: [fix-F1]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Extract and run the approved refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/fix-f1-ui-modularize.yml').read_text(encoding='utf-8')
          marker = 'cat > "$RUNNER_TEMP/refactor-ui.mjs" <<\'NODE\'\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n          NODE\n', start)
          lines = textwrap.dedent(source[start:end]).splitlines()
          for index, line in enumerate(lines):
              if 'legacy compatibilityAcknowledgement variable remains' in line:
                  del lines[index - 1:index + 2]
                  break
          Path('/tmp/refactor-ui.mjs').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          node /tmp/refactor-ui.mjs

      - name: Migrate UI contract tests to module boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test-catalog-ui-contract.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = "const css = readFileSync(join(root, 'site', 'wrt', 'app.css'), 'utf8');\n"
          insert = anchor + "const uiSession = readFileSync(join(root, 'site', 'wrt', 'lib', 'ui-session-state.js'), 'utf8');\nconst uiComponents = readFileSync(join(root, 'site', 'wrt', 'lib', 'ui-components.js'), 'utf8');\nconst pageShell = readFileSync(join(root, 'site', 'wrt', 'lib', 'page-shell-ui.js'), 'utf8');\nconst uiComponentsCss = readFileSync(join(root, 'site', 'wrt', 'ui-components.css'), 'utf8');\n"
          if text.count(anchor) != 1:
              raise SystemExit('UI contract module-read anchor mismatch')
          text = text.replace(anchor, insert)

          old = """expect(app.includes('let compatibilityRememberDefault = false;') &&
  app.includes(\"rememberChoice.className = 'compatibility-remember'\") &&
  app.includes(\"rememberInput.checked = compatibilityRememberDefault\") &&
  app.includes(\"finish(rememberInput.checked ? 'forced-remember' : 'forced')\") &&
  app.includes('remembered.size === forced.size') &&
  app.includes(\"rememberDefault.className = 'st-option compatibility-remember'\") &&
  app.includes('compatibilityRememberDefault = rememberDefaultInput.checked') &&
  app.includes('仅当前页面有效；刷新或重新打开网页、清除站点数据后失效。') &&
  !app.includes('wrt_compatibility_remember') &&
  css.includes('.compatibility-remember{display:inline-flex;') &&
  css.includes('.st-option.compatibility-remember{width:100%;'),
  'force-confirm remember-choice control, page-session default, tooltip, or non-persistence regressed');"""
          new = """expect(uiSession.includes('let compatibilityRememberDefault = false;') &&
  uiSession.includes('let compatibilityAcknowledgement = null;') &&
  uiSession.includes('setRememberDefault(value) { compatibilityRememberDefault = value === true; }') &&
  uiSession.includes('clearAcknowledgement() { compatibilityAcknowledgement = null; }') &&
  app.includes('UI_COMPONENTS.createUiCheckboxControl({') &&
  app.includes('checked: UI_SESSION.compatibility.getRememberDefault(),') &&
  app.includes(\"finish(rememberInput.checked ? 'forced-remember' : 'forced')\") &&
  app.includes('remembered.size === forced.size') &&
  app.includes('onChange: (checked) => UI_SESSION.compatibility.setRememberDefault(checked)') &&
  app.includes('仅当前页面有效；刷新或重新打开网页、清除站点数据后失效。') &&
  !app.includes('wrt_compatibility_remember') && !uiSession.includes('localStorage') &&
  uiComponents.includes('export function createUiCheckboxControl') &&
  uiComponentsCss.includes('.ui-checkbox-control{display:inline-flex;') &&
  css.includes('.compatibility-remember{display:inline-flex;') &&
  css.includes('.st-option.compatibility-remember{width:100%;'),
  'force-confirm remember-choice control, page-session default, tooltip, or non-persistence regressed');"""
          if text.count(old) != 1:
              raise SystemExit('compatibility UI contract block mismatch')
          text = text.replace(old, new)
          old_font = "  app.includes('const FONT_DEF = 17, FONT_MIN = 14, FONT_MAX = 24;'),"
          new_font = "  pageShell.includes('const FONT_DEF = 17, FONT_MIN = 14, FONT_MAX = 24;') &&\n  !app.includes('const FONT_DEF = 17, FONT_MIN = 14, FONT_MAX = 24;'),"
          if text.count(old_font) != 1:
              raise SystemExit('page-shell typography contract mismatch')
          text = text.replace(old_font, new_font)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare release identity
        run: node tools/dev-assistant.mjs prepare

      - name: Run UI module regression
        run: node tools/test-ui-modules.mjs

      - name: Run complete project checks
        run: node tools/check-all.mjs

      - name: Verify expected change set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(VERSION|site/wrt/app\.js|site/wrt/index\.html|site/wrt/ui-components\.css|site/wrt/lib/(ui-session-state|ui-components|page-shell-ui)\.js|site/wrt/data/site-version\.json|tools/test-ui-modules\.mjs|tools/test-catalog-ui-contract\.mjs|tools/check-all\.mjs)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected changed path: $path"; exit 1; }
          done

      - name: Commit modularized UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name weigefenxiang
          git config user.email 119787190+weigefenxiang@users.noreply.github.com
          git add VERSION site/wrt/app.js site/wrt/index.html site/wrt/ui-components.css \
            site/wrt/lib/ui-session-state.js site/wrt/lib/ui-components.js site/wrt/lib/page-shell-ui.js \
            site/wrt/data/site-version.json tools/test-ui-modules.mjs tools/test-catalog-ui-contract.mjs tools/check-all.mjs
          git commit -m "refactor: modularize shared web UI infrastructure" \
            -m "Separate page-session compatibility state, reusable DOM controls, and page-shell behavior from the main application orchestrator. Preserve Catalog, Kconfig, schema 6, and build request semantics while migrating implementation-location tests to module behavior contracts and refreshing the release identity through the project preparation tool."
          git push origin HEAD:fix-F1
