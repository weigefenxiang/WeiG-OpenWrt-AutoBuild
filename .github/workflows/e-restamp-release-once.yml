name: Restamp E release on final tree

on:
  push:
    branches: [fix-E]
    paths:
      - ".github/workflows/e-restamp-release-once.yml"

permissions:
  contents: write

concurrency:
  group: e-restamp-release-once
  cancel-in-progress: false

jobs:
  restamp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-E
          fetch-depth: 0
      - name: Remove one-shot control file before fingerprinting
        run: rm .github/workflows/e-restamp-release-once.yml
      - name: Stamp and verify final project tree
        run: node tools/dev-assistant.mjs prepare
      - name: Commit final generated release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION site/wrt/data/site-version.json .github/workflows/e-restamp-release-once.yml
          git diff --cached --check
          git commit -m "chore: restamp E plugin card release"
          git push origin HEAD:fix-E
