name: Finalize Catalog promotion contract

on:
  push:
    branches: [fix-F]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare final clean tree identity
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-f-catalog-promotion-finalize.yml
          node tools/dev-assistant.mjs prepare
          node tools/dev-assistant.mjs verify
      - name: Commit generated project identity
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset HEAD -- .github/workflows/fix-f-catalog-promotion-finalize.yml
          if git diff --cached --quiet; then
            echo "No generated identity changes."
          else
            git commit -m "chore: refresh project identity after Catalog promotion contract update"
            git push origin HEAD:fix-F
          fi
