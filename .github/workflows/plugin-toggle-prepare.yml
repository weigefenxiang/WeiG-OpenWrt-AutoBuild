name: Prepare Plugin Toggle Refinement

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/plugin-toggle-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Verify bootstrap base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "2c47d8c5c770af1e23f19eb98f639165e341f6ed"

      - name: Apply approved plugin interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('site/wrt/app.js')
          app = app_path.read_text(encoding='utf-8')

          old_toggle = """    if (curatedPluginChecked(p, st, catalogOption) && cb.checked) return;
              applyChecked(true);"""
          new_toggle = """    applyChecked(!cb.checked);"""
          if app.count(old_toggle) != 1:
              raise SystemExit('app.js: plugin double-click toggle marker mismatch')
          app = app.replace(old_toggle, new_toggle, 1)

          old_menu_badge = """  if (origin.kind !== 'inactive') {
              const badge = document.createElement('small');
              badge.className = `catalog-origin catalog-origin-${origin.kind}`;"""
          new_menu_badge = """  if (origin.kind !== 'inactive' && origin.kind !== 'user') {
              const badge = document.createElement('small');
              badge.className = `catalog-origin catalog-origin-${origin.kind}`;"""
          if app.count(old_menu_badge) != 1:
              raise SystemExit('app.js: Advanced origin badge marker mismatch')
          app = app.replace(old_menu_badge, new_menu_badge, 1)

          old_plugin_badge = """    if (origin.kind !== 'inactive') {
                const f = document.createElement('span');
                f.className = `flag flag-origin flag-origin-${origin.kind}`;"""
          new_plugin_badge = """    if (origin.kind !== 'inactive' && origin.kind !== 'user') {
                const f = document.createElement('span');
                f.className = `flag flag-origin flag-origin-${origin.kind}`;"""
          if app.count(old_plugin_badge) != 1:
              raise SystemExit('app.js: plugin origin flag marker mismatch')
          app = app.replace(old_plugin_badge, new_plugin_badge, 1)
          app_path.write_text(app, encoding='utf-8', newline='\n')

          test_path = Path('tools/test-catalog-ui-contract.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_contract = """  pluginRenderContract.includes('if (cb.disabled) return;') &&
            pluginRenderContract.includes('if (curatedPluginChecked(p, st, catalogOption) && cb.checked) return;') &&
            pluginRenderContract.includes('applyChecked(true);') &&
            !pluginRenderContract.includes('nameBtn.title = detail'),
            'plugin card double-click selection or shared tooltip binding regressed');
          """
          new_contract = """  pluginRenderContract.includes('if (cb.disabled) return;') &&
            pluginRenderContract.includes('applyChecked(!cb.checked);') &&
            !pluginRenderContract.includes('if (curatedPluginChecked(p, st, catalogOption) && cb.checked) return;') &&
            !pluginRenderContract.includes('applyChecked(true);') &&
            !pluginRenderContract.includes('nameBtn.title = detail'),
            'plugin card double-click toggle or shared tooltip binding regressed');
          expect((app.match(/origin\\.kind !== 'inactive' && origin\\.kind !== 'user'/g) || []).length >= 2 &&
            app.includes("kind: 'user', label: uiText('用户选择'"),
            'user-selected state must remain internal while its item badges stay hidden');
          """
          if test.count(old_contract) != 1:
              raise SystemExit('test-catalog-ui-contract.mjs: plugin contract marker mismatch')
          test = test.replace(old_contract, new_contract, 1)
          test_path.write_text(test, encoding='utf-8', newline='\n')
          PY
          git rm -f .github/workflows/plugin-toggle-prepare.yml

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse "${GITHUB_SHA}^")"
          actual="$(git diff --name-only "$base" | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            site/wrt/app.js \
            site/wrt/data/site-version.json \
            tools/test-catalog-ui-contract.mjs | sort)"
          test "$actual" = "$expected"

      - name: Commit prepared change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: toggle selected plugins on double click"
          git push origin HEAD:dev

      - name: Clean failed bootstrap files
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "${GITHUB_SHA}" ]; then
            echo "dev moved; skip cleanup to avoid overwriting concurrent work"
            exit 0
          fi
          git reset --hard "${GITHUB_SHA}"
          git rm -f .github/workflows/plugin-toggle-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: clean failed plugin toggle preparation"
          git push origin HEAD:dev
