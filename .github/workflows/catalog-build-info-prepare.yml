name: Prepare Catalog Build Information

on:
  push:
    branches: [fix-D]
    paths:
      - ".github/workflows/catalog-build-info-prepare.yml"

permissions:
  contents: write

concurrency:
  group: catalog-build-info-prepare-fix-D
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-D
          fetch-depth: 0

      - name: Verify bootstrap base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 712780016870572ffcd54dde03683798ddb9d24c HEAD
          test "$(git branch --show-current)" = "fix-D"

      - name: Apply approved Build Information change
        run: |
          set -euo pipefail
          git rm .github/workflows/catalog-build-info-prepare.yml
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          index = Path('site/wrt/index.html')
          replace_once(index, '<dt>Version</dt>', '<dt>Web Version</dt>')
          replace_once(index, '<dt>Commit</dt>', '<dt>Web Commit</dt>')
          built = '<div><dt>Built</dt><dd id="buildInfoBuilt">—</dd></div>'
          catalog_rows = '''<div><dt>Catalog Code</dt><dd><button type="button" class="build-info-commit" id="buildInfoCatalogCode" aria-label="Catalog code commit">—</button></dd></div>\n          <div><dt>Catalog Data</dt><dd><button type="button" class="build-info-commit" id="buildInfoCatalogData" aria-label="Catalog data revision">—</button></dd></div>\n          '''
          replace_once(index, built, catalog_rows + built)

          app = Path('site/wrt/app.js')
          text = app.read_text(encoding='utf-8')
          marker = 'function renderBuildInfo() {\n'
          if text.count(marker) != 1:
              raise SystemExit('app.js: renderBuildInfo marker mismatch')
          helper = '''function renderBuildInfoSha(id, value) {\n  const button = $(id);\n  if (!button) return;\n  const sha = String(value || '').trim().toLowerCase();\n  if (/^[a-f0-9]{40}$/.test(sha)) {\n    button.textContent = `${sha.slice(0, 12)}…`;\n    button.title = sha;\n    button.disabled = false;\n    button.onclick = async () => {\n      try { await navigator.clipboard.writeText(sha); }\n      catch (e) { /* clipboard permission can be unavailable on plain HTTP */ }\n    };\n  } else {\n    button.textContent = '—';\n    button.title = '';\n    button.disabled = true;\n    button.onclick = null;\n  }\n}\nfunction renderCatalogBuildInfo() {\n  renderBuildInfoSha('buildInfoCatalogCode', MENU_INDEX?.provenance?.codeSha);\n  renderBuildInfoSha('buildInfoCatalogData', MENU_INDEX?.assetRef);\n}\n\n'''
          text = text.replace(marker, helper + marker, 1)
          text = text.replace("  const commit = $('buildInfoCommit');\n", '', 1)
          start = text.find('  const meta = state.buildMeta;\n', text.find(marker))
          end = text.find("  trigger.addEventListener('click'", start)
          if start < 0 or end < 0:
              raise SystemExit('app.js: build info body markers missing')
          replacement = '''  const meta = state.buildMeta;\n  renderBuildInfoSha('buildInfoCommit', meta?.commit);\n  renderCatalogBuildInfo();\n  $('buildInfoBuilt').textContent = formatBuildTime(meta?.builtAt);\n'''
          text = text[:start] + replacement + text[end:]
          old = '      MENU_INDEX = index;\n      if (!importingConfig) {'
          new = '      MENU_INDEX = index;\n      renderCatalogBuildInfo();\n      if (!importingConfig) {'
          if text.count(old) != 1:
              raise SystemExit('app.js: refresh MENU_INDEX assignment mismatch')
          text = text.replace(old, new, 1)
          old = '    MENU_INDEX = remote.index;\n    const active = catalogBranchFromIndex(remote.index, source.id, branch.branch);'
          new = '    MENU_INDEX = remote.index;\n    renderCatalogBuildInfo();\n    const active = catalogBranchFromIndex(remote.index, source.id, branch.branch);'
          if text.count(old) != 1:
              raise SystemExit('app.js: bundle MENU_INDEX assignment mismatch')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8', newline='\n')

          test = Path('tools/test-catalog-ui-contract.mjs')
          text = test.read_text(encoding='utf-8')
          marker = "  'deployment metadata network/parse failures can silently fall back to the main Catalog channel');\n"
          if text.count(marker) != 1:
              raise SystemExit('test-catalog-ui-contract.mjs: insertion marker mismatch')
          regression = '''\nconst buildInfoContract = app.match(/function renderCatalogBuildInfo\\(\\) \\{([\\s\\S]*?)\\n\\}/)?.[1] || '';\nexpect(html.includes('<dt>Web Version</dt>') &&\n  html.includes('<dt>Web Commit</dt>') &&\n  html.includes('id="buildInfoCatalogCode"') &&\n  html.includes('id="buildInfoCatalogData"') &&\n  buildInfoContract.includes("renderBuildInfoSha('buildInfoCatalogCode', MENU_INDEX?.provenance?.codeSha)") &&\n  buildInfoContract.includes("renderBuildInfoSha('buildInfoCatalogData', MENU_INDEX?.assetRef)") &&\n  (app.match(/MENU_INDEX = (?:index|remote\\.index);\\n\\s+renderCatalogBuildInfo\\(\\);/g) || []).length >= 2,\n  'Build Information does not expose the loaded Catalog code and data identities');\n'''
          text = text.replace(marker, marker + regression, 1)
          test.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/catalog-build-info-prepare\.yml|VERSION|site/wrt/app\.js|site/wrt/index\.html|site/wrt/data/site-version\.json|tools/test-catalog-ui-contract\.mjs)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected prepared files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git diff -- site/wrt/index.html site/wrt/app.js tools/test-catalog-ui-contract.mjs VERSION site/wrt/data/site-version.json

      - name: Commit prepared change
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: show Catalog build identities"
          git push origin HEAD:fix-D
