name: Site Version / 网页版本

on:
  push:
    paths:
      - "site/wrt/**"
      - "VERSION"

permissions:
  contents: write

concurrency:
  group: site-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stamp only changed site content / 仅网页内容变化时更新时间戳
        run: node tools/stamp-site-version.mjs

      - name: Commit stamp when needed / 需要时提交版本文件
        run: |
          if git diff --quiet -- VERSION site/wrt/data/site-version.json; then
            echo "Site version is current / 网页版本无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION site/wrt/data/site-version.json
          git commit -m "chore(site): update page version [skip ci]"
          git push
