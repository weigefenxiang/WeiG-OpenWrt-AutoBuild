name: Project Version / 项目版本

on:
  push:
    paths:
      - ".github/workflows/**"
      - "Shell/**"
      - "config/**"
      - "site/wrt/**"
      - "tools/**"
      - "VERSION"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Shell/**"
      - "config/**"
      - "site/wrt/**"
      - "tools/**"
      - "VERSION"

permissions:
  contents: read

concurrency:
  group: project-version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project version / 验证项目版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4

      - name: Verify generated version state / 验证版本生成状态
        run: node tools/stamp-site-version.mjs --check
