name: Project Version / 项目版本

on:
  push:
    paths:
      - ".github/workflows/**"
      - "Shell/**"
      - "config/**"
      - "site/wrt/**"
      - "tools/**"
      - "VERSION"

permissions:
  contents: write

concurrency:
  group: site-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stamp changed project inputs / 更新项目版本时间戳
        run: node tools/stamp-site-version.mjs

      - name: Commit generated version files / 提交生成的版本文件
        run: |
          if git diff --quiet -- VERSION site/wrt/data/site-version.json site/wrt/app.js site/wrt/index.html; then
            echo "Project version is current / 项目版本无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION site/wrt/data/site-version.json site/wrt/app.js site/wrt/index.html
          git commit -m "chore(version): update project version [skip ci]"
          git push
