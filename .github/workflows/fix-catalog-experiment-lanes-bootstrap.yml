name: Fix Catalog experiment lanes bootstrap

on:
  push:
    branches:
      - fix/catalog-experiment-lanes-ABC
    paths:
      - .github/workflows/fix-catalog-experiment-lanes-bootstrap.yml

permissions:
  contents: write

jobs:
  prepare-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact experiment branch
        uses: actions/checkout@v6
        with:
          ref: fix/catalog-experiment-lanes-ABC
          fetch-depth: 0

      - name: Apply isolated Catalog lane contract
        run: |
          python3 .github/fix-catalog-experiment-lanes.py
          rm .github/fix-catalog-experiment-lanes.py
          rm .github/workflows/fix-catalog-experiment-lanes-bootstrap.yml

      - name: Prepare project version and contracts
        run: node tools/dev-assistant.mjs prepare

      - name: Run lane-specific regressions
        run: |
          node tools/test-build-identity.mjs
          node tools/test-catalog-loader.mjs

      - name: Verify prepared tree
        run: node tools/dev-assistant.mjs verify

      - name: Commit prepared experiment-lane support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: isolate Catalog experiment data lanes"
          git push origin HEAD:fix/catalog-experiment-lanes-ABC
