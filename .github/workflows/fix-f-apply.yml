name: Export verified fix-F runtime patch
run-name: Export verified fix-F runtime patch · ${{ github.run_number }}

on:
  push:
    branches: [fix-F]
    paths:
      - "tools/fix-f-apply.mjs"
      - "tools/fix-f-apply-v2.mjs"
      - ".github/workflows/fix-f-apply.yml"

permissions:
  contents: read

concurrency:
  group: fix-f-runtime-patch
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-F
          fetch-depth: 0
      - name: Apply guarded runtime patch
        run: node tools/fix-f-apply-v2.mjs
      - name: Prepare and verify AutoBuild
        run: node tools/dev-assistant.mjs prepare
      - name: Verify retired config authority is gone
        run: |
          set -euo pipefail
          ! grep -R -n -E 'submitted\.config|SUBMITTED_CONFIG_OUT|submitted_sha256|submittedConfig' \
            -- .github site tools || {
              echo 'Retired submitted.config authority is still referenced.'
              exit 1
            }
          test ! -e tools/fix-f-apply.mjs
          test ! -e tools/fix-f-apply-v2.mjs
          test ! -e tools/fix-f-runtime.mjs
          test ! -e .github/workflows/fix-f-apply.yml
          git diff --check
      - name: Package verified files
        run: |
          set -euo pipefail
          mkdir -p verified/.github/workflows verified/site/wrt/data verified/site/wrt verified/tools
          cp .github/workflows/custom-build.yml verified/.github/workflows/custom-build.yml
          cp VERSION verified/VERSION
          cp site/wrt/app.js verified/site/wrt/app.js
          cp site/wrt/data/site-version.json verified/site/wrt/data/site-version.json
          cp tools/check-all.mjs verified/tools/check-all.mjs
          cp tools/test-catalog-performance.mjs verified/tools/test-catalog-performance.mjs
          cp tools/test-catalog-ui-contract.mjs verified/tools/test-catalog-ui-contract.mjs
          git diff --name-status HEAD > verified/NAME-STATUS.txt
          git diff --binary HEAD > verified/verified.patch
      - name: Upload verified patch
        uses: actions/upload-artifact@v7
        with:
          name: fix-F-verified-runtime-patch
          path: verified/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
