name: Apply guarded fix-F runtime patch
run-name: Apply guarded fix-F runtime patch · ${{ github.run_number }}

on:
  push:
    branches: [fix-F]
    paths:
      - "tools/fix-f-apply.mjs"
      - "tools/fix-f-apply-v2.mjs"
      - ".github/workflows/fix-f-apply.yml"

permissions:
  contents: write

concurrency:
  group: fix-f-runtime-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-F
          fetch-depth: 0
      - name: Apply guarded runtime patch
        run: node tools/fix-f-apply-v2.mjs
      - name: Prepare and verify AutoBuild
        run: node tools/dev-assistant.mjs prepare
      - name: Verify retired config authority is gone
        run: |
          set -euo pipefail
          ! grep -R -n -E 'submitted\.config|SUBMITTED_CONFIG_OUT|submitted_sha256|submittedConfig' \
            -- .github site tools || {
              echo 'Retired submitted.config authority is still referenced.'
              exit 1
            }
      - name: Commit verified patch
        run: |
          set -euo pipefail
          test ! -e tools/fix-f-apply.mjs
          test ! -e tools/fix-f-apply-v2.mjs
          test ! -e tools/fix-f-runtime.mjs
          test ! -e .github/workflows/fix-f-apply.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No patch changes to commit.'; exit 1; }
          git commit -m "build: consume native profile baselines"
          git push origin HEAD:fix-F
