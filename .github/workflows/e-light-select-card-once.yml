name: E light selectable card one-shot

on:
  push:
    branches: [fix-E]
    paths:
      - ".github/workflows/e-light-select-card-once.yml"

permissions:
  contents: write

concurrency:
  group: e-light-select-card-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-E
          fetch-depth: 0
      - name: Normalize patch helper input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/e-light-select-card-once.py')
          text = path.read_text()
          old = "css = css_path.read_text()\n"
          new = "css = css_path.read_text().replace('\\r\\n', '\\n').replace('\\r', '\\n')\n"
          if text.count(old) != 1:
              raise SystemExit(f'patch helper read anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_dark = """if css.count(dark_old) != 2:\n    raise SystemExit(f'dark selectable-card token anchor count={css.count(dark_old)}')\ncss = css.replace(dark_old, dark_new)\n"""
          new_dark = """if css.count(dark_old) != 1:\n    raise SystemExit(f'explicit dark selectable-card token anchor count={css.count(dark_old)}')\ncss = css.replace(dark_old, dark_new, 1)\nauto_dark_old = dark_old.replace('  --', '    --')\nauto_dark_new = dark_new.replace('  --', '    --')\nif css.count(auto_dark_old) != 1:\n    raise SystemExit(f'auto dark selectable-card token anchor count={css.count(auto_dark_old)}')\ncss = css.replace(auto_dark_old, auto_dark_new, 1)\n"""
          if text.count(old_dark) != 1:
              raise SystemExit(f'patch helper dark anchor count={text.count(old_dark)}')
          text = text.replace(old_dark, new_dark, 1)
          text += """

# Keep the original independent-card regression, but source its border from the shared template token.
test_path = Path('tools/test-catalog-ui-contract.mjs')
test = test_path.read_text()
old_boundary = "css.includes('border: 1px solid color-mix(in srgb, var(--border) 72%, var(--text3));')"
new_boundary = "css.includes('border: 1px solid var(--select-card-border);')"
if test.count(old_boundary) != 1:
    raise SystemExit(f'independent plugin card border contract count={test.count(old_boundary)}')
test_path.write_text(test.replace(old_boundary, new_boundary, 1))
"""
          path.write_text(text)
          PY
      - name: Apply selectable-card patch
        run: python3 tools/e-light-select-card-once.py
      - name: Remove one-shot controls before fingerprinting
        run: rm tools/e-light-select-card-once.py .github/workflows/e-light-select-card-once.yml
      - name: Stamp and verify final project tree
        run: node tools/dev-assistant.mjs prepare
      - name: Commit final selectable-card template
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: unify light and dark selectable plugin cards"
          git push origin HEAD:fix-E
