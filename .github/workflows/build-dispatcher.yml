name: Build Dispatcher / 构建路由
run-name: Dispatch ${{ github.event.issue.user.login }}#${{ github.event.issue.number }} · ${{ github.event.issue.title }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    name: Route exact build / 路由精确构建
    if: startsWith(github.event.issue.title, '[build]')
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Checkout stable dispatcher / 检出稳定路由器
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Parse branch and commit / 解析请求分支与提交
        id: route
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node tools/parse-build-route.mjs

      - name: Reject invalid route / 拒绝非法路由
        if: steps.route.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const requester = context.payload.issue.user.login;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${requester}\n\n❌ 构建路由无效，未启动构建。请从当前部署的定制网页重新生成并提交请求。\n\nBuild route is invalid; no build was started. Regenerate the request from the current deployed customizer.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned',
            });

      - name: Stop after invalid route / 非法路由后终止
        if: steps.route.outcome == 'failure'
        run: exit 1

      - name: Validate exact ref and dispatch worker / 核对精确版本并派发 Worker
        if: steps.route.outcome == 'success'
        uses: actions/github-script@v8
        env:
          REQUEST_BRANCH: ${{ steps.route.outputs.request_branch }}
          REQUEST_COMMIT: ${{ steps.route.outputs.request_commit }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTER: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REQUEST_BRANCH;
            const commit = process.env.REQUEST_COMMIT.toLowerCase();
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const requester = process.env.REQUESTER;
            const issueBody = process.env.ISSUE_BODY;

            const reject = async (message) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `@${requester}\n\n❌ ${message}\n\n构建未启动 / Build was not started.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'not_planned',
              });
              core.setFailed(message);
            };

            const workerInputs = {
              issue_number: String(issueNumber),
              issue_title: process.env.ISSUE_TITLE,
              issue_body: issueBody,
              requester,
              issue_created_at: process.env.ISSUE_CREATED_AT,
              request_branch: branch,
              request_commit: commit,
            };
            const dispatchPayloadBytes = Buffer.byteLength(JSON.stringify({ ref: branch, inputs: workerInputs }), 'utf8');
            if (dispatchPayloadBytes > 60000) {
              await reject('Issue 正文过大，无法安全派发。请重新从网页提交 / Issue body is too large for a safe dispatch.');
              return;
            }

            const { data: currentIssue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            if (currentIssue.state !== 'open') {
              core.notice(`Issue #${issueNumber} is already closed; dispatch skipped.`);
              return;
            }

            let branchData;
            try {
              ({ data: branchData } = await github.rest.repos.getBranch({ owner, repo, branch }));
            } catch (error) {
              if (error.status === 404) {
                await reject(`请求分支不存在：\`${branch}\` / Requested branch does not exist.`);
                return;
              }
              throw error;
            }
            const head = String(branchData.commit?.sha || '').toLowerCase();
            if (head !== commit) {
              await reject(`网页请求已过期：请求 \`${branch}@${commit.slice(0, 12)}\`，当前分支 HEAD 为 \`${head.slice(0, 12)}\`。请刷新网页后重新提交。 / Stale request: branch HEAD no longer matches the requested commit.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'custom-build.yml',
              ref: branch,
              inputs: workerInputs,
            });
            core.notice(`Dispatched custom-build.yml at ${branch}@${commit}.`);
