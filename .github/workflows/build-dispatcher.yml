name: Build Routing Probe Dispatcher / 构建路由探针派发器
run-name: Route probe / 路由探针 · #${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing [route-test] Issue containing exactly one build-request.json
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: read

jobs:
  dispatch:
    name: Validate request and dispatch probe / 校验请求并派发探针
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Require default-branch dispatcher / 仅允许默认分支派发
        uses: actions/github-script@v8
        with:
          script: |
            const expected = context.payload.repository.default_branch;
            const actual = context.ref.replace(/^refs\/heads\//, '');
            if (actual !== expected) {
              core.setFailed(`Run this dispatcher from ${expected}, not ${actual}. / 请从默认分支运行派发器`);
            }

      - name: Checkout stable dispatcher / 检出稳定派发器
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Snapshot route-test Issue / 固定路由测试 Issue
        id: issue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid Issue number / Issue 编号非法');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.pull_request) {
              core.setFailed('Pull requests are not route probes / PR 不能作为路由探针');
              return;
            }
            if (issue.state !== 'open') {
              core.setFailed(`Issue #${issueNumber} is not open / Issue 不是打开状态`);
              return;
            }
            if (!String(issue.title || '').startsWith('[route-test]')) {
              core.setFailed('Probe Issue title must start with [route-test] / 路由探针 Issue 标题必须以 [route-test] 开头');
              return;
            }
            const snapshot = {
              issue: {
                number: issue.number,
                title: issue.title,
                body: String(issue.body || ''),
                created_at: issue.created_at,
                user: { login: issue.user.login },
              },
            };
            fs.writeFileSync('route-probe-event.json', `${JSON.stringify(snapshot)}\n`);
            core.setOutput('number', String(issue.number));

      - name: Read authoritative Build Request / 读取权威 Build Request
        env:
          REQUEST_EVENT_PATH: ${{ github.workspace }}/route-probe-event.json
          REQUEST_MANIFEST_OUT: route-probe-request.json
          REQUEST_DIR: route-probe-request
        run: node tools/fetch-build-request.mjs

      - name: Read routing identity from Build Request / 从 Build Request 读取路由身份
        id: route
        env:
          REQUEST_MANIFEST: route-probe-request.json
        run: node tools/parse-build-request-identity.mjs

      - name: Validate exact branch head and dispatch probe / 核对精确分支并派发探针
        uses: actions/github-script@v8
        env:
          REQUEST_BRANCH: ${{ steps.route.outputs.request_branch }}
          REQUEST_COMMIT: ${{ steps.route.outputs.request_commit }}
          REQUEST_ID: ${{ steps.route.outputs.request_id }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.REQUEST_BRANCH;
            const commit = process.env.REQUEST_COMMIT;
            let branchData;
            try {
              ({ data: branchData } = await github.rest.repos.getBranch({ owner, repo, branch }));
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Requested branch does not exist: ${branch} / 请求分支不存在`);
                return;
              }
              throw error;
            }
            const head = String(branchData.commit?.sha || '').toLowerCase();
            if (head !== commit) {
              core.setFailed(
                `Stale request: ${branch}@${commit.slice(0, 12)} != HEAD ${head.slice(0, 12)} / 请求提交与分支 HEAD 不一致`,
              );
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'build-routing-probe.yml',
              ref: branch,
              inputs: {
                request_branch: branch,
                request_commit: commit,
                request_id: process.env.REQUEST_ID,
                issue_number: process.env.ISSUE_NUMBER,
                dispatcher_run_id: String(context.runId),
              },
            });
            core.notice(`Dispatched routing probe at ${branch}@${commit}.`);
