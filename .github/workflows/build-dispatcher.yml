name: Build Dispatcher / 构建派发器
run-name: "${{ github.event_name == 'issues' && format('Route build / 构建路由 · #{0}', github.event.issue.number) || format('Route {0} / 路由验证 · #{1}', inputs.mode, inputs.issue_number) }}"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Issue containing exactly one build-request.json
        required: true
        type: string
      mode:
        description: Read-only routing probe or real custom-build canary
        required: true
        default: probe
        type: choice
        options:
          - probe
          - build-canary

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    name: Validate request and dispatch exact ref / 校验请求并派发精确版本
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[build]')
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Require default-branch dispatcher / 仅允许默认分支派发
        uses: actions/github-script@v8
        with:
          script: |
            const expected = context.payload.repository.default_branch;
            const actual = context.ref.replace(/^refs\/heads\//, '');
            if (actual !== expected) {
              core.setFailed(`Run this dispatcher from ${expected}, not ${actual}. / 请从默认分支运行派发器`);
            }

      - name: Checkout stable dispatcher / 检出稳定派发器
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Snapshot build Issue / 固定构建 Issue
        id: issue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}
          DISPATCH_MODE: ${{ github.event_name == 'issues' && 'build' || inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const mode = String(process.env.DISPATCH_MODE || '');
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid Issue number / Issue 编号非法');
              return;
            }
            if (!['build', 'probe', 'build-canary'].includes(mode)) {
              core.setFailed(`Unsupported dispatch mode: ${mode} / 不支持的派发模式`);
              return;
            }
            if (mode === 'build' && context.eventName !== 'issues') {
              core.setFailed('Production build routing is Issue-event only / 生产构建路由只接受 Issue opened 事件');
              return;
            }
            if (mode !== 'build' && context.eventName !== 'workflow_dispatch') {
              core.setFailed('Routing validation modes are manual-only / 路由验证模式只允许手动运行');
              return;
            }
            if (mode === 'build-canary' && context.actor.toLowerCase() !== context.repo.owner.toLowerCase()) {
              core.setFailed('build-canary is restricted to the repository owner / build-canary 仅允许仓库 Owner 手动运行');
              return;
            }

            let issue;
            if (context.eventName === 'issues') {
              issue = context.payload.issue;
              if (Number(issue?.number) !== issueNumber) {
                core.setFailed('Issue event identity mismatch / Issue 事件身份不一致');
                return;
              }
            } else {
              ({ data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              }));
            }
            if (issue.pull_request) {
              core.setFailed('Pull requests are not build requests / PR 不能作为构建请求');
              return;
            }
            if (issue.state !== 'open') {
              core.setFailed(`Issue #${issueNumber} is not open / Issue 不是打开状态`);
              return;
            }
            const title = String(issue.title || '');
            const requiredPrefix = mode === 'probe' ? '[route-test]' : '[build]';
            if (!title.startsWith(requiredPrefix)) {
              core.setFailed(`${mode} Issue title must start with ${requiredPrefix} / ${mode} Issue 标题必须以 ${requiredPrefix} 开头`);
              return;
            }
            const snapshot = {
              issue: {
                number: issue.number,
                title,
                body: String(issue.body || ''),
                created_at: issue.created_at,
                user: { login: issue.user.login },
              },
            };
            fs.writeFileSync('dispatcher-event.json', `${JSON.stringify(snapshot)}\n`);
            core.setOutput('mode', mode);
            core.setOutput('number', String(issue.number));
            core.setOutput('title', title);
            core.setOutput('requester', issue.user.login);
            core.setOutput('created_at', issue.created_at);

      - name: Read authoritative Build Request / 读取权威 Build Request
        env:
          REQUEST_EVENT_PATH: ${{ github.workspace }}/dispatcher-event.json
          REQUEST_MANIFEST_OUT: dispatcher-request.json
          REQUEST_DIR: dispatcher-request
        run: node tools/fetch-build-request.mjs

      - name: Read routing identity from Build Request / 从 Build Request 读取路由身份
        id: route
        env:
          REQUEST_MANIFEST: dispatcher-request.json
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          REQUESTER: ${{ steps.issue.outputs.requester }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: node tools/parse-build-request-identity.mjs

      - name: Validate exact branch head and dispatch / 核对精确分支并派发
        uses: actions/github-script@v8
        env:
          DISPATCH_MODE: ${{ steps.issue.outputs.mode }}
          REQUEST_BRANCH: ${{ steps.route.outputs.request_branch }}
          REQUEST_COMMIT: ${{ steps.route.outputs.request_commit }}
          REQUEST_ID: ${{ steps.route.outputs.request_id }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          REQUESTER: ${{ steps.issue.outputs.requester }}
          ISSUE_CREATED_AT: ${{ steps.issue.outputs.created_at }}
          RUN_TITLE: ${{ steps.route.outputs.run_title }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mode = process.env.DISPATCH_MODE;
            const branch = process.env.REQUEST_BRANCH;
            const commit = process.env.REQUEST_COMMIT.toLowerCase();
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const requester = process.env.REQUESTER;
            const snapshot = JSON.parse(fs.readFileSync('dispatcher-event.json', 'utf8'));
            const issueBody = String(snapshot.issue?.body || '');

            let branchData;
            try {
              ({ data: branchData } = await github.rest.repos.getBranch({ owner, repo, branch }));
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Requested branch does not exist: ${branch} / 请求分支不存在`);
                return;
              }
              throw error;
            }
            const head = String(branchData.commit?.sha || '').toLowerCase();
            if (head !== commit) {
              core.setFailed(
                `Stale request: ${branch}@${commit.slice(0, 12)} != HEAD ${head.slice(0, 12)} / 请求提交与分支 HEAD 不一致`,
              );
              return;
            }

            const { data: currentIssue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            if (currentIssue.state !== 'open' ||
                currentIssue.user.login.toLowerCase() !== requester.toLowerCase() ||
                currentIssue.created_at !== process.env.ISSUE_CREATED_AT ||
                currentIssue.title !== process.env.ISSUE_TITLE ||
                String(currentIssue.body || '') !== issueBody) {
              core.setFailed('Issue identity changed before dispatch / 派发前 Issue 快照已变化');
              return;
            }

            if (mode === 'probe') {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'build-routing-probe.yml',
                ref: branch,
                inputs: {
                  request_branch: branch,
                  request_commit: commit,
                  request_id: process.env.REQUEST_ID,
                  issue_number: String(issueNumber),
                  dispatcher_run_id: String(context.runId),
                },
              });
              core.notice(`Dispatched routing probe at ${branch}@${commit}.`);
              return;
            }

            if (mode === 'build' || mode === 'build-canary') {
              const workerInputs = {
                issue_number: String(issueNumber),
                issue_title: process.env.ISSUE_TITLE,
                issue_body: issueBody,
                requester,
                issue_created_at: process.env.ISSUE_CREATED_AT,
                run_title: process.env.RUN_TITLE,
                request_branch: branch,
                request_commit: commit,
              };
              const bytes = Buffer.byteLength(JSON.stringify({ ref: branch, inputs: workerInputs }), 'utf8');
              if (bytes > 60000) {
                core.setFailed(`Dispatch payload is too large: ${bytes} bytes / 派发请求过大`);
                return;
              }
              const dispatchWorker = async (inputs) => {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: 'custom-build.yml',
                    ref: branch,
                    inputs,
                  });
                  return false;
                } catch (error) {
                  const details = `${error.message || ''} ${JSON.stringify(error.response?.data || {})}`;
                  const status = Number(error.status || error.response?.status || error.response?.data?.status || 0);
                  const runTitleCompatibilityError = status === 422 && /run_title/i.test(details);
                  if (!runTitleCompatibilityError) throw error;
                  const { run_title: _optionalRunTitle, ...legacyInputs } = inputs;
                  core.warning('Target Worker does not accept optional run_title; retrying legacy dispatch without display metadata.');
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: 'custom-build.yml',
                    ref: branch,
                    inputs: legacyInputs,
                  });
                  return true;
                }
              };
              const legacyTitleFallback = await dispatchWorker(workerInputs);
              core.notice(`Dispatched custom-build ${mode} at ${branch}@${commit}${legacyTitleFallback ? ' using legacy input compatibility' : ''}.`);
              return;
            }

            core.setFailed(`Unsupported dispatch mode: ${mode} / 不支持的派发模式`);

      - name: Comment & close rejected production request / 路由失败时回评并关闭生产请求
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTER: ${{ github.event.issue.user.login }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `@${process.env.REQUESTER}\n\n❌ Build request routing validation failed; the Worker was not started.\n\nLog: ${url}\n\nRegenerate the request on the current web page, upload the complete build-request.json, and submit again.\n\n中文说明：构建请求路由校验未通过，Worker 未启动。请从当前网页重新生成并上传完整 build-request.json 后再提交。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'not_planned',
            });
