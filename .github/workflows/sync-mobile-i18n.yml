name: Sync Mobile Action Labels

on:
  push:
    branches: [fix-D]
    paths:
      - ".github/workflows/sync-mobile-i18n.yml"

permissions:
  contents: write

concurrency:
  group: sync-mobile-i18n-fix-D
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-D
          fetch-depth: 2

      - name: Verify bootstrap base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7486da5057c419ce10b9742a8c7151c78ae8ad07"
          test "$(git branch --show-current)" = "fix-D"

      - name: Generate runtime translations
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-mobile-i18n.yml
          node tools/gen-i18n.mjs

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/sync-mobile-i18n\.yml|VERSION|site/wrt/data/i18n\.json|site/wrt/data/site-version\.json)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected prepared files:"
            echo "$unexpected"
            exit 1
          fi
          grep -q '"btn.import.short"' site/wrt/data/i18n.json
          grep -q '"btn.submit.short"' site/wrt/data/i18n.json
          git diff --check

      - name: Commit generated runtime translations
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: sync mobile action labels"
          git push origin HEAD:fix-D
