name: One-shot NativeDelta compatibility fix

on:
  push:
    branches:
      - fix-F
    paths:
      - .github/workflows/one-shot-native-delta-remember.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: stage native delta compatibility fix' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix-F
        uses: actions/checkout@v6
        with:
          ref: fix-F
          fetch-depth: 0

      - name: Apply NativeDelta and remember-choice fixes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function edit(path, transform) {
            const before = readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No change produced for ${path}`);
            writeFileSync(path, after);
          }
          function replaceOnce(text, before, after, label) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected 1 match, found ${count}`);
            return text.replace(before, after);
          }

          edit('site/wrt/lib/profile-baseline.js', (input) => {
            let text = input;
            text = replaceOnce(text,
              'export function diffProfileBaseline(baseline, finalValues) {',
              'export function diffProfileBaseline(baseline, finalValues, { allowedSymbols = null } = {}) {',
              'diffProfileBaseline signature');
            text = replaceOnce(text,
              '  const protectedSymbols = baseline?.protectedSymbols instanceof Set ? baseline.protectedSymbols : new Set();\n  const overrides = [];',
              '  const protectedSymbols = baseline?.protectedSymbols instanceof Set ? baseline.protectedSymbols : new Set();\n  const allowed = allowedSymbols instanceof Set ? allowedSymbols : new Set(allowedSymbols || []);\n  const overrides = [];',
              'diffProfileBaseline allowlist');
            text = replaceOnce(text,
              '    if (!base.has(symbol)) throw new Error(`Kconfig symbol is not present in the Native Profile baseline: ${symbol}`);',
              '    if (!base.has(symbol) && !allowed.has(symbol)) {\n      throw new Error(`Kconfig symbol is outside the active Catalog: ${symbol}`);\n    }',
              'diffProfileBaseline missing symbol gate');
            text = replaceOnce(text,
              'export function applyProfileOverrides(baseline, overrides) {',
              'export function applyProfileOverrides(baseline, overrides, { allowedSymbols = null } = {}) {',
              'applyProfileOverrides signature');
            text = replaceOnce(text,
              '  const values = new Map(baseline.values);\n  const seen = new Set();',
              '  const values = new Map(baseline.values);\n  const allowed = allowedSymbols instanceof Set ? allowedSymbols : new Set(allowedSymbols || []);\n  const seen = new Set();',
              'applyProfileOverrides allowlist');
            text = replaceOnce(text,
              '    if (!values.has(symbol)) throw new Error(`Kconfig override is outside the Native Profile baseline: ${symbol}`);\n    if (baseline.protectedSymbols?.has(symbol)) throw new Error(`Target/Profile identity cannot be overridden: ${symbol}`);',
              '    if (baseline.protectedSymbols?.has(symbol)) throw new Error(`Target/Profile identity cannot be overridden: ${symbol}`);\n    if (!values.has(symbol) && !allowed.has(symbol)) {\n      throw new Error(`Kconfig override is outside the active Catalog: ${symbol}`);\n    }',
              'applyProfileOverrides missing symbol gate');
            return text;
          });

          edit('site/wrt/app.js', (input) => {
            let text = input;
            text = replaceOnce(text,
              'let compatibilityPrefetchTimer = null, compatibilityAcknowledgement = null;\n',
              'let compatibilityPrefetchTimer = null, compatibilityAcknowledgement = null;\nlet compatibilityRememberDefault = false;\n',
              'compatibility remember state');
            text = replaceOnce(text,
              '  const forced = new Set();\n  while (true) {',
              '  const forced = new Set();\n  const remembered = new Set();\n  while (true) {',
              'compatibility remembered set');
            text = replaceOnce(text,
              `      if (audit) compatibilityAcknowledgement = {\n        signature: compatibilitySignature(evaluation), audit,\n      };\n      return audit;`,
              `      if (audit && forced.size && remembered.size === forced.size) {\n        compatibilityAcknowledgement = {\n          signature: compatibilitySignature(evaluation), audit,\n        };\n      } else {\n        compatibilityAcknowledgement = null;\n      }\n      return audit;`,
              'compatibility acknowledgement persistence');
            text = replaceOnce(text,
              `    if (action === 'forced') forced.add(warning.rule.id);\n    else forced.clear();`,
              `    if (action === 'forced' || action === 'forced-remember') {\n      forced.add(warning.rule.id);\n      if (action === 'forced-remember') remembered.add(warning.rule.id);\n      else remembered.delete(warning.rule.id);\n    } else {\n      forced.clear();\n      remembered.clear();\n    }`,
              'compatibility force handling');
            text = replaceOnce(text,
              `      const actions = document.createElement('div');\n      actions.className = 'modal-actions compatibility-actions compatibility-confirm-actions';\n      const backButton = document.createElement('button');`,
              `      const actions = document.createElement('div');\n      actions.className = 'modal-actions compatibility-actions compatibility-confirm-actions';\n      const rememberChoice = document.createElement('label');\n      rememberChoice.className = 'compatibility-remember';\n      rememberChoice.dataset.uiTooltipTitle = uiText('记住选择', '記住選擇', 'Remember choice');\n      rememberChoice.dataset.uiTooltipBody = uiText(\n        '仅当前页面有效；刷新或重新打开网页、清除站点数据后失效。',\n        '僅目前頁面有效；重新整理或重新開啟網頁、清除網站資料後失效。',\n        'Valid only on this page. Refreshing or reopening the page, or clearing site data, resets it.');\n      const rememberInput = document.createElement('input');\n      rememberInput.type = 'checkbox';\n      rememberInput.checked = compatibilityRememberDefault;\n      const rememberText = document.createElement('span');\n      rememberText.textContent = uiText('记住选择', '記住選擇', 'Remember choice');\n      rememberChoice.append(rememberInput, rememberText);\n      const backButton = document.createElement('button');`,
              'force confirmation remember control');
            text = replaceOnce(text,
              `      confirmForceButton.onclick = () => finish('forced');\n      actions.append(backButton, confirmForceButton);`,
              `      confirmForceButton.onclick = () => finish(rememberInput.checked ? 'forced-remember' : 'forced');\n      actions.append(rememberChoice, backButton, confirmForceButton);`,
              'force confirmation remember action');
            text = replaceOnce(text,
              `  const finalValues = PROFILE_BASELINE_MODULE.parseConfigMap(configText);\n  return PROFILE_BASELINE_MODULE.diffProfileBaseline(ACTIVE_PROFILE_BASELINE, finalValues);`,
              `  const finalValues = PROFILE_BASELINE_MODULE.parseConfigMap(configText);\n  const allowedSymbols = CATALOG_MODEL?.bySymbol instanceof Map\n    ? new Set(CATALOG_MODEL.bySymbol.keys()) : new Set();\n  return PROFILE_BASELINE_MODULE.diffProfileBaseline(\n    ACTIVE_PROFILE_BASELINE, finalValues, { allowedSymbols },\n  );`,
              'browser NativeDelta allowlist');
            text = replaceOnce(text,
              `  intro.textContent = t('st.intro');\n  mb.appendChild(intro);\n\n  function addRow(name) {`,
              `  intro.textContent = t('st.intro');\n  mb.appendChild(intro);\n  const rememberDefault = document.createElement('label');\n  rememberDefault.className = 'st-option compatibility-remember';\n  rememberDefault.dataset.uiTooltipTitle = uiText('本页记住强制兼容选择', '本頁記住強制相容選擇', 'Remember forced compatibility choices on this page');\n  rememberDefault.dataset.uiTooltipBody = uiText(\n    '开启后，后续强制确认框中的“记住选择”默认勾选；第一次遇到新的兼容性风险仍需手动确认。刷新或重新打开网页后失效。',\n    '開啟後，後續強制確認框中的「記住選擇」預設勾選；第一次遇到新的相容性風險仍需手動確認。重新整理或重新開啟網頁後失效。',\n    'When enabled, future force-confirmation dialogs default “Remember choice” to checked. A new compatibility risk still requires an explicit first confirmation. Refreshing or reopening the page resets it.');\n  const rememberDefaultInput = document.createElement('input');\n  rememberDefaultInput.type = 'checkbox';\n  rememberDefaultInput.checked = compatibilityRememberDefault;\n  const rememberDefaultText = document.createElement('span');\n  rememberDefaultText.textContent = uiText(\n    '本页默认记住强制兼容选择', '本頁預設記住強制相容選擇',\n    'Default to remember forced compatibility choices on this page');\n  rememberDefaultInput.addEventListener('change', () => {\n    compatibilityRememberDefault = rememberDefaultInput.checked;\n  });\n  rememberDefault.append(rememberDefaultInput, rememberDefaultText);\n  mb.appendChild(rememberDefault);\n\n  function addRow(name) {`,
              'self-test remember default');
            return text;
          });

          edit('site/wrt/app.css', (input) => {
            let text = input;
            text = replaceOnce(text,
              '.compatibility-force-confirm{border-color:color-mix(in srgb,var(--warn) 65%,var(--border));background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--text);font-weight:700}\n',
              '.compatibility-force-confirm{border-color:color-mix(in srgb,var(--warn) 65%,var(--border));background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--text);font-weight:700}\n.compatibility-remember{display:inline-flex;align-items:center;gap:7px;min-height:42px;margin-right:auto;padding:7px 9px;border:1px solid transparent;border-radius:8px;color:var(--text2);font-size:var(--font-description);cursor:help;user-select:none}\n.compatibility-remember:hover,.compatibility-remember:focus-within{border-color:color-mix(in srgb,var(--accent) 28%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--card2));color:var(--text)}\n.compatibility-remember input{width:17px;height:17px;margin:0;accent-color:var(--accent)}\n.st-option.compatibility-remember{width:100%;margin:2px 0 8px;padding:8px 10px;border-color:var(--border);background:var(--card2)}\n',
              'compatibility remember css');
            return text;
          });

          edit('tools/parse-request.mjs', (input) => {
            let text = input;
            text = replaceOnce(text,
              `} from '../site/wrt/lib/build-identity.js';\nimport {\n  applyProfileOverrides, createProfileBaselineStore, serializeConfigMap,\n} from '../site/wrt/lib/profile-baseline.js';`,
              `} from '../site/wrt/lib/build-identity.js';\nimport { createCatalogModel } from '../site/wrt/lib/catalog-engine.js';\nimport {\n  applyProfileOverrides, createProfileBaselineStore, serializeConfigMap,\n} from '../site/wrt/lib/profile-baseline.js';`,
              'worker Catalog engine import');
            const anchor = `async function loadNativeProfileStore(catalogContract, catalogSource, catalogBranch) {\n  const contract = profileBaselineContract(catalogBranch);`;
            if (!text.includes(anchor)) throw new Error('worker Native Profile loader anchor missing');
            const insertion = `function graphContract(branch) {\n  const contract = branch?.assets?.graph;\n  if (!contract || typeof contract !== 'object' ||\n      !/^[A-Za-z0-9._-]+\\.graph\\.json\\.gz$/.test(String(contract.asset || '')) ||\n      !SHA256_RE.test(String(contract.hash || '').toLowerCase()) ||\n      !Number.isSafeInteger(Number(contract.bytes)) || Number(contract.bytes) <= 0) {\n    fail('固定 Catalog index 缺少有效 Kconfig graph 契约');\n  }\n  return {\n    asset: String(contract.asset),\n    hash: String(contract.hash).toLowerCase(),\n    bytes: Number(contract.bytes),\n  };\n}\n\nasync function loadCatalogKconfigSymbols(catalogContract, catalogBranch) {\n  const contract = graphContract(catalogBranch);\n  const compressed = await fetchCatalogResource(catalogContract.revision, contract.asset, { binary: true });\n  if (compressed.byteLength !== contract.bytes) {\n    fail(\`Catalog Kconfig graph bytes 不一致:\${compressed.byteLength} != \${contract.bytes}\`);\n  }\n  if (sha256(compressed) !== contract.hash) fail('Catalog Kconfig graph compressed SHA-256 不一致');\n  let document;\n  try { document = JSON.parse(gunzipSync(compressed).toString('utf8')); }\n  catch (error) { fail(\`Catalog Kconfig graph 无法解压/解析:\${error.message}\`); }\n  const actualCommit = String(document?.source?.commit || '').toLowerCase();\n  if (actualCommit && actualCommit !== catalogContract.sourceCommit) {\n    fail(\`Catalog Kconfig graph source commit 不一致:\${actualCommit} != \${catalogContract.sourceCommit}\`);\n  }\n  let model;\n  try { model = createCatalogModel({ schema: 6, relations: document?.relations }); }\n  catch (error) { fail(\`Catalog Kconfig graph 契约无效:\${error.message}\`); }\n  const symbols = new Set(model.bySymbol.keys());\n  if (!symbols.size) fail('Catalog Kconfig graph 不包含任何 Kconfig symbol');\n  return { symbols, contract };\n}\n\n`;
            text = text.replace(anchor, insertion + anchor);
            text = replaceOnce(text,
              `const rawOverrides = req.overrides;\nif (!Array.isArray(rawOverrides)) fail('schema 6 overrides 必须是数组');\nif (rawOverrides.length > 50000) fail('Kconfig override 数量超过 50000，拒绝');\nlet reconstructedValues;\ntry { reconstructedValues = applyProfileOverrides(baseline, rawOverrides); }`,
              `const rawOverrides = req.overrides;\nif (!Array.isArray(rawOverrides)) fail('schema 6 overrides 必须是数组');\nif (rawOverrides.length > 50000) fail('Kconfig override 数量超过 50000，拒绝');\nconst { symbols: catalogKconfigSymbols } = await loadCatalogKconfigSymbols(catalogContract, catalogBranch);\nlet reconstructedValues;\ntry {\n  reconstructedValues = applyProfileOverrides(\n    baseline, rawOverrides, { allowedSymbols: catalogKconfigSymbols },\n  );\n}`,
              'worker NativeDelta allowlist');
            return text;
          });

          edit('tools/test-profile-baseline.mjs', (input) => {
            let text = input;
            text = replaceOnce(text,
              `const reconstructed = applyProfileOverrides(a, delta);\nassert.deepEqual([...reconstructed], [...edited]);`,
              `const reconstructed = applyProfileOverrides(a, delta);\nassert.deepEqual([...reconstructed], [...edited]);\n\nconst allowedSymbols = new Set([...a.values.keys(), 'DYNAMIC_OPTION']);\nconst expanded = new Map(edited);\nexpanded.set('DYNAMIC_OPTION', 'y');\nconst expandedDelta = diffProfileBaseline(a, expanded, { allowedSymbols });\nassert.deepEqual(expandedDelta, [['DYNAMIC_OPTION', 'y'], ['FEATURE', 'n'], ['ROOTFS_SIZE', '512']]);\nconst expandedReconstructed = applyProfileOverrides(a, expandedDelta, { allowedSymbols });\nassert.deepEqual([...expandedReconstructed], [...expanded]);\nassert.throws(() => diffProfileBaseline(a, expanded), /outside the active Catalog/);\nassert.throws(() => applyProfileOverrides(a, [['UNKNOWN_OPTION', 'y']], { allowedSymbols }), /outside the active Catalog/);`,
              'profile baseline dynamic symbol regression');
            text = replaceOnce(text,
              `console.log('Native Profile baseline checks passed: schema3 groups, target identity, exact delta, reconstruction, serialization, identity protection.');`,
              `console.log('Native Profile baseline checks passed: schema3 groups, target identity, exact delta, Catalog-authorized dynamic symbols, reconstruction, serialization, identity protection.');`,
              'profile baseline test summary');
            return text;
          });

          edit('tools/test-catalog-ui-contract.mjs', (input) => {
            let text = input;
            const anchor = `expect(app.includes('useDefconfig: false,') &&`;
            if (!text.includes(anchor)) throw new Error('UI contract insertion anchor missing');
            const block = `expect(app.includes('let compatibilityRememberDefault = false;') &&\n  app.includes("rememberChoice.className = 'compatibility-remember'") &&\n  app.includes("rememberInput.checked = compatibilityRememberDefault") &&\n  app.includes("finish(rememberInput.checked ? 'forced-remember' : 'forced')") &&\n  app.includes('remembered.size === forced.size') &&\n  app.includes("rememberDefault.className = 'st-option compatibility-remember'") &&\n  app.includes('compatibilityRememberDefault = rememberDefaultInput.checked') &&\n  app.includes('仅当前页面有效；刷新或重新打开网页、清除站点数据后失效。') &&\n  !app.includes('wrt_compatibility_remember') &&\n  css.includes('.compatibility-remember{display:inline-flex;') &&\n  css.includes('.st-option.compatibility-remember{width:100%;'),\n  'force-confirm remember-choice control, page-session default, tooltip, or non-persistence regressed');\n\n`;
            text = text.replace(anchor, block + anchor);
            return text;
          });

          edit('tools/check-all.mjs', (input) => {
            let text = input;
            text = replaceOnce(text,
              `  parser.includes('createProfileBaselineStore') && parser.includes('applyProfileOverrides') &&\n  profileBaseline.includes('branch-common-plus-exact-config-groups-v1') &&`,
              `  parser.includes('createProfileBaselineStore') && parser.includes('applyProfileOverrides') &&\n  parser.includes('loadCatalogKconfigSymbols') && parser.includes('createCatalogModel') &&\n  parser.includes('allowedSymbols: catalogKconfigSymbols') &&\n  profileBaseline.includes('branch-common-plus-exact-config-groups-v1') &&\n  profileBaseline.includes('allowedSymbols instanceof Set') &&`,
              'Catalog-only NativeDelta contract');
            return text;
          });
          NODE

          git rm .github/workflows/one-shot-native-delta-remember.yml
          node tools/dev-assistant.mjs prepare
          node tools/test-profile-baseline.mjs
          node tools/test-catalog-ui-contract.mjs
          node tools/check-all.mjs
          git diff --check
          git status --short

      - name: Commit and push fix-F
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: allow Catalog-authorized NativeDelta symbols'
          git push origin HEAD:fix-F
