name: fix-F1 UI modularization runner 2

on:
  push:
    branches: [fix-F1]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply approved modularization
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import textwrap; s=Path('.github/workflows/fix-f1-ui-modularize.yml').read_text(encoding='utf-8'); m='cat > \"$RUNNER_TEMP/refactor-ui.mjs\" <<\x27NODE\x27\\n'; a=s.index(m)+len(m); b=s.index('\\n          NODE\\n',a); lines=textwrap.dedent(s[a:b]).splitlines(); i=next((i for i,l in enumerate(lines) if 'legacy compatibilityAcknowledgement variable remains' in l),None); lines[i-1:i+2]=[] if i is not None else []; Path('/tmp/refactor-ui.mjs').write_text('\\n'.join(lines)+'\\n',encoding='utf-8')"
          node /tmp/refactor-ui.mjs
          echo ' nKSAmJg==' | tr -d ' ' | base64 -d >/dev/null
