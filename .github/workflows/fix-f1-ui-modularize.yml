name: fix-F1 UI modularization

on:
  push:
    branches: [fix-F1]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'chore: run fix-F1 UI modularization'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Refactor shared UI infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/refactor-ui.mjs" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const read = (path) => readFileSync(path, 'utf8');
          const write = (path, text) => writeFileSync(path, text, 'utf8');
          const replaceOnce = (source, before, after, label) => {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`missing refactor marker: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`duplicate refactor marker: ${label}`);
            return source.slice(0, first) + after + source.slice(first + before.length);
          };

          const spdx = `/*\n * SPDX-FileCopyrightText: 2026 weigefenxiang <weigefenxiang@gmail.com>\n * SPDX-License-Identifier: GPL-3.0-or-later\n */\n`;

          write('site/wrt/lib/ui-session-state.js', spdx + `\n// Page-session-only state. This module deliberately has no storage dependency.\nexport function createUiSessionState() {\n  let compatibilityAcknowledgement = null;\n  let compatibilityRememberDefault = false;\n\n  const compatibility = Object.freeze({\n    getAcknowledgement: () => compatibilityAcknowledgement,\n    setAcknowledgement(value) { compatibilityAcknowledgement = value && typeof value === 'object' ? value : null; },\n    clearAcknowledgement() { compatibilityAcknowledgement = null; },\n    getRememberDefault: () => compatibilityRememberDefault,\n    setRememberDefault(value) { compatibilityRememberDefault = value === true; },\n  });\n\n  return Object.freeze({ compatibility });\n}\n`);

          write('site/wrt/lib/ui-components.js', spdx + `\nfunction addClassNames(element, ...names) {\n  for (const name of names.flatMap((value) => String(value || '').split(/\\s+/)).filter(Boolean)) {\n    element.classList.add(name);\n  }\n  return element;\n}\n\nfunction loadComponentStyles() {\n  if (typeof document === 'undefined' || document.querySelector('link[data-ui-components-style]')) return;\n  const stylesheet = document.createElement('link');\n  stylesheet.rel = 'stylesheet';\n  const url = new URL('../ui-components.css', import.meta.url);\n  url.search = new URL(import.meta.url).search;\n  stylesheet.href = url.href;\n  stylesheet.dataset.uiComponentsStyle = '';\n  document.head.appendChild(stylesheet);\n}\nloadComponentStyles();\n\nexport function createUiActionRow(className = '') {\n  const row = document.createElement('div');\n  addClassNames(row, 'ui-action-row', className);\n  return row;\n}\n\nexport function createUiButton({ text = '', className = 'btn', title = '', onClick = null } = {}) {\n  const button = document.createElement('button');\n  button.type = 'button';\n  addClassNames(button, 'ui-button', className);\n  button.textContent = String(text);\n  if (title) button.title = String(title);\n  if (typeof onClick === 'function') button.addEventListener('click', onClick);\n  return button;\n}\n\nexport function createUiCheckboxControl({\n  label = '', className = '', checked = false, tooltipTitle = '', tooltipBody = '', onChange = null,\n} = {}) {\n  const root = document.createElement('label');\n  addClassNames(root, 'ui-checkbox-control', className);\n  if (tooltipTitle) root.dataset.uiTooltipTitle = String(tooltipTitle);\n  if (tooltipBody) root.dataset.uiTooltipBody = String(tooltipBody);\n  const input = document.createElement('input');\n  input.type = 'checkbox';\n  input.checked = checked === true;\n  if (typeof onChange === 'function') input.addEventListener('change', () => onChange(input.checked, input));\n  const text = document.createElement('span');\n  text.className = 'ui-checkbox-label';\n  text.textContent = String(label);\n  root.append(input, text);\n  return { root, input, text };\n}\n`);

          write('site/wrt/lib/page-shell-ui.js', spdx + `\nexport function installPageShellUi({ get, t, safeSet, openModal, fitPluginNames }) {\n  if (typeof get !== 'function' || typeof t !== 'function' || typeof safeSet !== 'function' ||\n      typeof openModal !== 'function' || typeof fitPluginNames !== 'function') {\n    throw new Error('page shell UI dependencies are incomplete');\n  }\n  const $ = get;\n  const FONT_DEF = 17, FONT_MIN = 14, FONT_MAX = 24;\n  let fontPx = parseInt(localStorage.getItem('wrt_font'), 10);\n  if (!fontPx && localStorage.getItem('wrt_density') === '1') { fontPx = 16; safeSet('wrt_font', '16'); }\n  try { localStorage.removeItem('wrt_density'); } catch (error) { /* storage may be unavailable */ }\n  if (!(fontPx >= FONT_MIN && fontPx <= FONT_MAX)) fontPx = FONT_DEF;\n\n  const applyFont = (px, save) => {\n    fontPx = Math.min(FONT_MAX, Math.max(FONT_MIN, Math.round(Number(px)) || FONT_DEF));\n    document.body.style.zoom = fontPx === FONT_DEF ? '' : String(fontPx / FONT_DEF);\n    $('fontInput').value = fontPx;\n    if (save) safeSet('wrt_font', String(fontPx));\n    fitPluginNames();\n  };\n  const toggleFontPanel = (show) => {\n    const open = show !== undefined ? show : $('fontPanel').hidden;\n    if (!open && $('fontPanel').contains(document.activeElement)) $('densityBtn').focus();\n    $('fontPanel').hidden = !open;\n    $('densityBtn').setAttribute('aria-expanded', String(open));\n    if (open) $('fontDec').focus();\n  };\n  $('densityBtn').addEventListener('click', (event) => { event.stopPropagation(); toggleFontPanel(); });\n  $('fontDec').addEventListener('click', () => applyFont(fontPx - 1, true));\n  $('fontInc').addEventListener('click', () => applyFont(fontPx + 1, true));\n  $('fontReset').addEventListener('click', () => applyFont(FONT_DEF, true));\n  $('fontInput').addEventListener('change', () => applyFont($('fontInput').value, true));\n  document.addEventListener('click', (event) => {\n    if (!$('fontPanel').hidden && !$('fontPanel').contains(event.target)) toggleFontPanel(false);\n  });\n  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') toggleFontPanel(false); });\n  applyFont(fontPx, false);\n\n  $('helpBtn').addEventListener('click', () => {\n    openModal(t('help.title'));\n    $('modal').querySelector('.modal').classList.add('modal-wide', 'recommended-config');\n    const bodyRoot = $('modalBody');\n    bodyRoot.textContent = '';\n    for (const line of t('help.body').split('\\n')) {\n      const match = line.match(/^([①②③④⑤⑥⑦⑧⑨⑩]|\\d+\\.)\\s*(.*)$/);\n      const row = document.createElement('div');\n      row.className = 'help-item';\n      const number = document.createElement('span');\n      number.className = 'help-num';\n      number.textContent = match ? match[1].replace('.', '') : '·';\n      row.appendChild(number);\n      const body = document.createElement('span');\n      body.className = 'help-text';\n      const text = match ? match[2] : line;\n      let last = 0;\n      for (const quote of text.matchAll(/\"([^\"]+)\"|'([^']+)'|“([^”]+)”/g)) {\n        body.appendChild(document.createTextNode(text.slice(last, quote.index)));\n        const emphasis = document.createElement('em');\n        emphasis.textContent = quote[1] || quote[2] || quote[3];\n        body.appendChild(emphasis);\n        last = quote.index + quote[0].length;\n      }\n      body.appendChild(document.createTextNode(text.slice(last)));\n      row.appendChild(body);\n      bodyRoot.appendChild(row);\n    }\n    const links = document.createElement('div');\n    links.className = 'help-links';\n    const link = document.createElement('a');\n    link.href = 'https://openwrt.org/docs/guide-user/installation/generic.sysupgrade';\n    link.target = '_blank';\n    link.rel = 'noopener';\n    link.textContent = t('help.link.ubi');\n    links.appendChild(link);\n    bodyRoot.appendChild(links);\n  });\n\n  const savedDock = localStorage.getItem('wrt_dock');\n  if (savedDock === '1' || (savedDock === null && matchMedia('(max-width: 560px)').matches)) {\n    $('sideDock').classList.add('collapsed');\n  }\n  $('dockToggle').setAttribute('aria-expanded', String(!$('sideDock').classList.contains('collapsed')));\n  $('dockToggle').addEventListener('click', () => {\n    const collapsed = $('sideDock').classList.toggle('collapsed');\n    $('dockToggle').setAttribute('aria-expanded', String(!collapsed));\n    safeSet('wrt_dock', collapsed ? '1' : '0');\n  });\n\n  $('riskOk').addEventListener('click', () => { $('riskBar').hidden = true; safeSet('wrt_risk', 'ok'); });\n\n  let themeMode = localStorage.getItem('wrt_theme') || 'auto';\n  const icons = Object.freeze({ auto: '◐', light: '☀', dark: '☾' });\n  const applyThemeIcon = () => {\n    $('themeBtn').textContent = icons[themeMode];\n    $('themeBtn').title = t('theme.' + themeMode);\n    $('themeBtn').setAttribute('aria-label', t('theme.' + themeMode));\n  };\n  const applyTheme = (mode) => {\n    themeMode = mode === 'light' || mode === 'dark' ? mode : 'auto';\n    if (typeof globalThis.__WEIG_APPLY_THEME__ === 'function') themeMode = globalThis.__WEIG_APPLY_THEME__(themeMode);\n    else if (themeMode === 'auto') delete document.documentElement.dataset.theme;\n    else document.documentElement.dataset.theme = themeMode;\n    applyThemeIcon();\n    if (themeMode === 'auto') {\n      try { localStorage.removeItem('wrt_theme'); } catch (error) { /* storage may be unavailable */ }\n    } else safeSet('wrt_theme', themeMode);\n  };\n  $('themeBtn').addEventListener('click', () => {\n    applyTheme(themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto');\n  });\n  applyTheme(themeMode);\n}\n`);

          write('site/wrt/ui-components.css', `/* SPDX-FileCopyrightText: 2026 weigefenxiang <weigefenxiang@gmail.com> */\n/* SPDX-License-Identifier: GPL-3.0-or-later */\n\n.ui-action-row{align-items:center}\n.ui-checkbox-control{display:inline-flex;align-items:center;gap:8px;min-width:0;cursor:pointer}\n.ui-checkbox-control>input[type=checkbox]{flex:none;width:17px;height:17px;margin:0;accent-color:var(--accent)}\n.ui-checkbox-label{min-width:0}\n.ui-button{font-family:inherit}\n`);

          let app = read('site/wrt/app.js');
          app = replaceOnce(app,
            "const releaseAssetUrl = (path) => globalThis.__WEIG_RELEASE_URL__(path);\n",
            "const releaseAssetUrl = (path) => globalThis.__WEIG_RELEASE_URL__(path);\nconst UI_RUNTIME = globalThis.__WEIG_UI_RUNTIME__;\nif (!UI_RUNTIME?.session?.createUiSessionState || !UI_RUNTIME?.components?.createUiCheckboxControl ||\n    !UI_RUNTIME?.pageShell?.installPageShellUi) {\n  throw new Error('Missing standardized UI runtime modules / 缺少标准 UI 运行模块');\n}\nconst UI_SESSION = UI_RUNTIME.session.createUiSessionState();\nconst UI_COMPONENTS = UI_RUNTIME.components;\nconst PAGE_SHELL_UI = UI_RUNTIME.pageShell;\n",
            'UI runtime bootstrap');
          app = replaceOnce(app,
            "let compatibilityPrefetchTimer = null, compatibilityAcknowledgement = null;\nlet compatibilityRememberDefault = false;\n",
            "let compatibilityPrefetchTimer = null;\n",
            'session declarations');
          app = replaceOnce(app,
            "  compatibilityAcknowledgement = null;\n  clearCatalogDerivedCaches();",
            "  UI_SESSION.compatibility.clearAcknowledgement();\n  clearCatalogDerivedCaches();",
            'state-change acknowledgement reset');
          app = replaceOnce(app,
            "    revision: catalogStateRevision,\n    compatibilityAcknowledgement,\n",
            "    revision: catalogStateRevision,\n    compatibilityAcknowledgement: UI_SESSION.compatibility.getAcknowledgement(),\n",
            'snapshot acknowledgement');
          app = replaceOnce(app,
            "  compatibilityAcknowledgement = snapshot.compatibilityAcknowledgement;\n  clearCatalogDerivedCaches();",
            "  UI_SESSION.compatibility.setAcknowledgement(snapshot.compatibilityAcknowledgement);\n  clearCatalogDerivedCaches();",
            'restore acknowledgement');
          app = replaceOnce(app,
            "  const signature = compatibilitySignature(evaluation);\n  if (compatibilityAcknowledgement?.signature === signature) return compatibilityAcknowledgement.audit;",
            "  const signature = compatibilitySignature(evaluation);\n  const acknowledged = UI_SESSION.compatibility.getAcknowledgement();\n  if (acknowledged?.signature === signature) return acknowledged.audit;",
            'read acknowledgement');
          app = replaceOnce(app,
            "        compatibilityAcknowledgement = {\n          signature: compatibilitySignature(evaluation), audit,\n        };\n      } else {\n        compatibilityAcknowledgement = null;\n      }",
            "        UI_SESSION.compatibility.setAcknowledgement({\n          signature: compatibilitySignature(evaluation), audit,\n        });\n      } else {\n        UI_SESSION.compatibility.clearAcknowledgement();\n      }",
            'write acknowledgement');

          const oldForce = `      const actions = document.createElement('div');\n      actions.className = 'modal-actions compatibility-actions compatibility-confirm-actions';\n      const rememberChoice = document.createElement('label');\n      rememberChoice.className = 'compatibility-remember';\n      rememberChoice.dataset.uiTooltipTitle = uiText('记住选择', '記住選擇', 'Remember choice');\n      rememberChoice.dataset.uiTooltipBody = uiText(\n        '仅当前页面有效；刷新或重新打开网页、清除站点数据后失效。',\n        '僅目前頁面有效；重新整理或重新開啟網頁、清除網站資料後失效。',\n        'Valid only on this page. Refreshing or reopening the page, or clearing site data, resets it.');\n      const rememberInput = document.createElement('input');\n      rememberInput.type = 'checkbox';\n      rememberInput.checked = compatibilityRememberDefault;\n      const rememberText = document.createElement('span');\n      rememberText.textContent = uiText('记住选择', '記住選擇', 'Remember choice');\n      rememberChoice.append(rememberInput, rememberText);\n      const backButton = document.createElement('button');\n      backButton.type = 'button';\n      backButton.className = 'btn compatibility-close';\n      backButton.textContent = uiText('返回修改', '返回修改', 'Back to edit');\n      backButton.onclick = renderChoice;\n      const confirmForceButton = document.createElement('button');\n      confirmForceButton.type = 'button';\n      confirmForceButton.className = 'btn compatibility-force-confirm';\n      confirmForceButton.textContent = uiText('确认强制继续', '確認強制繼續', 'Confirm and force');\n      confirmForceButton.onclick = () => finish(rememberInput.checked ? 'forced-remember' : 'forced');\n      actions.append(rememberChoice, backButton, confirmForceButton);\n`;
          const newForce = `      const actions = UI_COMPONENTS.createUiActionRow(\n        'modal-actions compatibility-actions compatibility-confirm-actions');\n      const { root: rememberChoice, input: rememberInput } = UI_COMPONENTS.createUiCheckboxControl({\n        className: 'compatibility-remember',\n        label: uiText('记住选择', '記住選擇', 'Remember choice'),\n        checked: UI_SESSION.compatibility.getRememberDefault(),\n        tooltipTitle: uiText('记住选择', '記住選擇', 'Remember choice'),\n        tooltipBody: uiText(\n          '仅当前页面有效；刷新或重新打开网页、清除站点数据后失效。',\n          '僅目前頁面有效；重新整理或重新開啟網頁、清除網站資料後失效。',\n          'Valid only on this page. Refreshing or reopening the page, or clearing site data, resets it.'),\n      });\n      const backButton = UI_COMPONENTS.createUiButton({\n        text: uiText('返回修改', '返回修改', 'Back to edit'),\n        className: 'btn compatibility-close',\n        onClick: renderChoice,\n      });\n      const confirmForceButton = UI_COMPONENTS.createUiButton({\n        text: uiText('确认强制继续', '確認強制繼續', 'Confirm and force'),\n        className: 'btn compatibility-force-confirm',\n        onClick: () => finish(rememberInput.checked ? 'forced-remember' : 'forced'),\n      });\n      actions.append(rememberChoice, backButton, confirmForceButton);\n`;
          app = replaceOnce(app, oldForce, newForce, 'force confirmation controls');

          const oldSelfTest = `  const rememberDefault = document.createElement('label');\n  rememberDefault.className = 'st-option compatibility-remember';\n  rememberDefault.dataset.uiTooltipTitle = uiText('本页记住强制兼容选择', '本頁記住強制相容選擇', 'Remember forced compatibility choices on this page');\n  rememberDefault.dataset.uiTooltipBody = uiText(\n    '开启后，后续强制确认框中的“记住选择”默认勾选；第一次遇到新的兼容性风险仍需手动确认。刷新或重新打开网页后失效。',\n    '開啟後，後續強制確認框中的「記住選擇」預設勾選；第一次遇到新的相容性風險仍需手動確認。重新整理或重新開啟網頁後失效。',\n    'When enabled, future force-confirmation dialogs default “Remember choice” to checked. A new compatibility risk still requires an explicit first confirmation. Refreshing or reopening the page resets it.');\n  const rememberDefaultInput = document.createElement('input');\n  rememberDefaultInput.type = 'checkbox';\n  rememberDefaultInput.checked = compatibilityRememberDefault;\n  const rememberDefaultText = document.createElement('span');\n  rememberDefaultText.textContent = uiText(\n    '本页默认记住强制兼容选择', '本頁預設記住強制相容選擇',\n    'Default to remember forced compatibility choices on this page');\n  rememberDefaultInput.addEventListener('change', () => {\n    compatibilityRememberDefault = rememberDefaultInput.checked;\n  });\n  rememberDefault.append(rememberDefaultInput, rememberDefaultText);\n  mb.appendChild(rememberDefault);\n`;
          const newSelfTest = `  const { root: rememberDefault } = UI_COMPONENTS.createUiCheckboxControl({\n    className: 'st-option compatibility-remember',\n    label: uiText(\n      '本页默认记住强制兼容选择', '本頁預設記住強制相容選擇',\n      'Default to remember forced compatibility choices on this page'),\n    checked: UI_SESSION.compatibility.getRememberDefault(),\n    tooltipTitle: uiText(\n      '本页记住强制兼容选择', '本頁記住強制相容選擇',\n      'Remember forced compatibility choices on this page'),\n    tooltipBody: uiText(\n      '开启后，后续强制确认框中的“记住选择”默认勾选；第一次遇到新的兼容性风险仍需手动确认。刷新或重新打开网页后失效。',\n      '開啟後，後續強制確認框中的「記住選擇」預設勾選；第一次遇到新的相容性風險仍需手動確認。重新整理或重新開啟網頁後失效。',\n      'When enabled, future force-confirmation dialogs default “Remember choice” to checked. A new compatibility risk still requires an explicit first confirmation. Refreshing or reopening the page resets it.'),\n    onChange: (checked) => UI_SESSION.compatibility.setRememberDefault(checked),\n  });\n  mb.appendChild(rememberDefault);\n`;
          app = replaceOnce(app, oldSelfTest, newSelfTest, 'self-test remember control');

          const shellStart = app.indexOf('/* ============ V11:Aa 字号面板');
          const shellEndMarker = 'applyTheme(themeMode);\n\ninit();\nupdateSubmitGate();';
          const shellEnd = app.indexOf(shellEndMarker, shellStart);
          if (shellStart < 0 || shellEnd < 0) throw new Error('page shell markers not found');
          const shellReplacement = `/* ============ 页面壳层 / Page shell ============ */\nPAGE_SHELL_UI.installPageShellUi({\n  get: $, t, safeSet, openModal, fitPluginNames,\n});\n\ninit();\nupdateSubmitGate();`;
          app = app.slice(0, shellStart) + shellReplacement + app.slice(shellEnd + shellEndMarker.length);
          if (/\bcompatibilityRememberDefault\b/.test(app)) throw new Error('legacy compatibilityRememberDefault remains');
          if (/\bcompatibilityAcknowledgement\b/.test(app.replaceAll('compatibilityAcknowledgement:', ''))) {
            throw new Error('legacy compatibilityAcknowledgement variable remains');
          }
          write('site/wrt/app.js', app);

          let html = read('site/wrt/index.html');
          const oldLoader = `<script>\nwindow.__WEIG_RELEASE_PROMISE__.then(() => {\n  const script = document.createElement('script');\n  script.src = window.__WEIG_RELEASE_URL__('app.js');\n  script.async = false;\n  document.body.appendChild(script);\n});\n</script>`;
          const newLoader = `<script>\nwindow.__WEIG_RELEASE_PROMISE__.then(async () => {\n  const [session, components, pageShell] = await Promise.all([\n    import(window.__WEIG_RELEASE_URL__('lib/ui-session-state.js')),\n    import(window.__WEIG_RELEASE_URL__('lib/ui-components.js')),\n    import(window.__WEIG_RELEASE_URL__('lib/page-shell-ui.js')),\n  ]);\n  window.__WEIG_UI_RUNTIME__ = Object.freeze({ session, components, pageShell });\n  const script = document.createElement('script');\n  script.src = window.__WEIG_RELEASE_URL__('app.js');\n  script.async = false;\n  document.body.appendChild(script);\n}).catch((error) => {\n  console.error('Application UI bootstrap failed / 页面 UI 模块加载失败', error);\n});\n</script>`;
          html = replaceOnce(html, oldLoader, newLoader, 'index app loader');
          write('site/wrt/index.html', html);

          write('tools/test-ui-modules.mjs', `#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport { createUiSessionState } from '../site/wrt/lib/ui-session-state.js';\n\nconst session = createUiSessionState();\nassert.equal(session.compatibility.getAcknowledgement(), null);\nassert.equal(session.compatibility.getRememberDefault(), false);\nsession.compatibility.setRememberDefault(true);\nassert.equal(session.compatibility.getRememberDefault(), true);\nconst acknowledgement = { signature: 'test', audit: { forced: ['RULE'] } };\nsession.compatibility.setAcknowledgement(acknowledgement);\nassert.equal(session.compatibility.getAcknowledgement(), acknowledgement);\nsession.compatibility.clearAcknowledgement();\nassert.equal(session.compatibility.getAcknowledgement(), null);\n\nconst app = readFileSync(new URL('../site/wrt/app.js', import.meta.url), 'utf8');\nconst html = readFileSync(new URL('../site/wrt/index.html', import.meta.url), 'utf8');\nconst components = readFileSync(new URL('../site/wrt/lib/ui-components.js', import.meta.url), 'utf8');\nconst shell = readFileSync(new URL('../site/wrt/lib/page-shell-ui.js', import.meta.url), 'utf8');\nassert.match(html, /lib\\/ui-session-state\\.js/);\nassert.match(html, /lib\\/ui-components\\.js/);\nassert.match(html, /lib\\/page-shell-ui\\.js/);\nassert.match(app, /UI_SESSION\\.compatibility\\.getAcknowledgement/);\nassert.match(app, /UI_COMPONENTS\\.createUiCheckboxControl/);\nassert.match(app, /PAGE_SHELL_UI\\.installPageShellUi/);\nassert.doesNotMatch(app, /let compatibilityRememberDefault/);\nassert.doesNotMatch(app, /let compatibilityPrefetchTimer = null, compatibilityAcknowledgement/);\nassert.doesNotMatch(app, /const FONT_DEF = 17, FONT_MIN = 14, FONT_MAX = 24/);\nassert.match(shell, /const FONT_DEF = 17, FONT_MIN = 14, FONT_MAX = 24/);\nassert.match(components, /export function createUiActionRow/);\nassert.match(components, /export function createUiButton/);\nassert.match(components, /export function createUiCheckboxControl/);\nassert.match(app, /payload\\.customTarget = schema6TargetIdentity\\(\\);/);\nconsole.log('shared UI module contracts passed');\n`);

          let checkAll = read('tools/check-all.mjs');
          checkAll = replaceOnce(checkAll,
            "  'test-theme-bootstrap.mjs',\n  'test-build-identity.mjs',",
            "  'test-theme-bootstrap.mjs',\n  'test-ui-modules.mjs',\n  'test-build-identity.mjs',",
            'check-all UI module test');
          write('tools/check-all.mjs', checkAll);
          NODE
          node "$RUNNER_TEMP/refactor-ui.mjs"

      - name: Prepare release identity
        run: node tools/dev-assistant.mjs prepare

      - name: Run UI module regression
        run: node tools/test-ui-modules.mjs

      - name: Run complete project checks
        run: node tools/check-all.mjs

      - name: Verify expected change set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(VERSION|site/wrt/app\.js|site/wrt/index\.html|site/wrt/ui-components\.css|site/wrt/lib/(ui-session-state|ui-components|page-shell-ui)\.js|site/wrt/data/site-version\.json|tools/test-ui-modules\.mjs|tools/check-all\.mjs)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected changed path: $path"; exit 1; }
          done

      - name: Commit modularized UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name weigefenxiang
          git config user.email 119787190+weigefenxiang@users.noreply.github.com
          git add VERSION site/wrt/app.js site/wrt/index.html site/wrt/ui-components.css \
            site/wrt/lib/ui-session-state.js site/wrt/lib/ui-components.js site/wrt/lib/page-shell-ui.js \
            site/wrt/data/site-version.json tools/test-ui-modules.mjs tools/check-all.mjs
          git commit -m "refactor: modularize shared web UI infrastructure" \
            -m "Separate page-session compatibility state, reusable DOM controls, and page-shell behavior from the main application orchestrator. Preserve Catalog, Kconfig, schema 6, and build request semantics while adding executable module contracts and refreshing the release identity through the project preparation tool."
          git push origin HEAD:fix-F1
