# 每周低峰自动同步上游机型目录与种子配置;有变化才提交 / Weekly off-peak upstream sync; commits only when something changed.
name: Sync Upstream / 上游同步
run-name: Sync Upstream 上游同步 · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: '37 18 * * 6'   # 周六 18:37 UTC = 北京周日 02:37;避开整点/整半的 Actions 拥堵高峰 / odd minute avoids the on-the-hour scheduling rush

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync / 同步
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev / 检出 dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch upstream device catalog / 抓取上游机型目录(确定性解析)
        run: node tools/fetch-catalog.mjs

      - name: "Drift sentinel: OpenWrt branch policy / 漂移哨兵:OpenWrt 分支策略"
        id: drift
        continue-on-error: true
        run: node tools/check-drift.mjs

      - name: Open drift alert issue / 漂移则开 issue 提醒
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
                title: '[drift] OpenWrt 上游分支策略漂移,请核对目录',
                body: `漂移哨兵发现 OpenWrt 上游分支不再符合项目策略。\n详情见 run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n请核对 tools/device-catalog.json 与源码目录策略：应保留 main，且不应重新加入 lede-17.01、pcs-standalone-back、master。`,
              labels: ['drift'],
            });

      - name: Regenerate seed configs & data / 重新生成种子配置与数据
        run: |
          node tools/gen-seed-configs.mjs
          node tools/gen-plugins.mjs
          node tools/gen-i18n.mjs
          node tools/gen-pkg-page.mjs
          node tools/stamp-site-version.mjs

      - name: Commit only when changed / 有变化才提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '上游无变化 / no upstream changes'
          else
            # 变化摘要写进 commit message / change summary goes into the commit message
            ADDED=$(git diff --cached --numstat -- 'config/**' | wc -l)
            git commit -m "chore(sync): weekly upstream refresh (${ADDED} config changes)" \
                       -m "auto-generated by sync-upstream.yml"
            git push origin HEAD:dev
          fi
