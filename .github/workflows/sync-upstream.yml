# 每周低峰自动同步上游机型目录与种子配置;有变化才提交 / Weekly off-peak upstream sync; commits only when something changed.
name: Sync Upstream / 上游同步
run-name: Sync Upstream 上游同步 · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: '37 18 * * 6'   # 周六 18:37 UTC = 北京周日 02:37;避开整点/整半的 Actions 拥堵高峰 / odd minute avoids the on-the-hour scheduling rush

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync / 同步
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4

      - name: Fetch upstream device catalog / 抓取上游机型目录(确定性解析)
        run: node tools/fetch-catalog.mjs

      - name: "Drift sentinel: 360T7 stockPatch still upstream? / 漂移哨兵:360T7 分区替换字符串仍在上游?"
        id: drift
        continue-on-error: true
        run: node tools/check-drift.mjs

      - name: Open drift alert issue / 漂移则开 issue 提醒
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '[drift] 上游机型定义漂移,请核对 360T7 的 stockPatch',
              body: `漂移哨兵在本次同步中发现上游 profile 名变化。\n详情见 run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n请人工核对 site/wrt/data/devices.json 里 360t7 各源的 stockPatch 字符串是否需要更新(历史教训:qihoo_360-t7 曾更名为 qihoo_360t7)。`,
              labels: ['drift'],
            });

      - name: Regenerate seed configs & data / 重新生成种子配置与数据
        run: |
          node tools/gen-seed-configs.mjs
          node tools/gen-plugins.mjs
          node tools/gen-i18n.mjs
          node tools/gen-pkg-page.mjs
          node tools/stamp-site-version.mjs

      - name: Commit only when changed / 有变化才提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '上游无变化 / no upstream changes'
          else
            # 变化摘要写进 commit message / change summary goes into the commit message
            ADDED=$(git diff --cached --numstat -- 'config/**' | wc -l)
            git commit -m "chore(sync): 每周上游同步,涉及 ${ADDED} 个配置文件变动 [skip ci]" \
                       -m "auto-generated by sync-upstream.yml"
            git push
          fi
