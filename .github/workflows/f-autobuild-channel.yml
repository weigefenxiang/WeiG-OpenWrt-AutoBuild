name: F AutoBuild Catalog channel validation

on:
  push:
    branches: [fix-F]
    paths:
      - ".f-autobuild-channel.py"
      - ".github/workflows/f-autobuild-channel.yml"

permissions:
  contents: write

concurrency:
  group: f-autobuild-channel-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Apply Catalog channel migration
        run: python3 .f-autobuild-channel.py
      - name: Remove temporary validation controls before stamping
        run: git rm -f .f-autobuild-channel.py .github/workflows/f-autobuild-channel.yml
      - name: Prepare final business tree
        run: node tools/dev-assistant.mjs prepare
      - name: Verify final business tree
        run: node tools/dev-assistant.mjs verify
      - name: Restore temporary controls before bot commit
        run: git checkout HEAD -- .f-autobuild-channel.py .github/workflows/f-autobuild-channel.yml
      - name: Commit validated business changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "refactor: standardize AutoBuild Catalog channels"
          git push origin HEAD:fix-F
