name: Prepare Refined Build Information

on:
  push:
    branches: [fix-D]
    paths:
      - ".github/workflows/refine-build-info-prepare.yml"
      - "tools/.refine-build-info-patch.py"

permissions:
  contents: write

concurrency:
  group: refine-build-info-prepare-fix-D
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-D
          fetch-depth: 4

      - name: Verify bootstrap base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b5ffa907856abc894bcafa261325e7f614eb9194 HEAD
          test "$(git branch --show-current)" = "fix-D"

      - name: Apply approved layout change
        run: |
          set -euo pipefail
          python3 tools/.refine-build-info-patch.py
          git rm .github/workflows/refine-build-info-prepare.yml tools/.refine-build-info-patch.py

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/refine-build-info-prepare\.yml|tools/\.refine-build-info-patch\.py|VERSION|site/wrt/app\.js|site/wrt/app\.css|site/wrt/index\.html|site/wrt/data/site-version\.json|site/wrt/data/i18n\.json|tools/test-catalog-ui-contract\.mjs|tools/i18n-source\.json|tools/i18n-translations\.json)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected prepared files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit prepared change
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: refine build information panel"
          git push origin HEAD:fix-D
