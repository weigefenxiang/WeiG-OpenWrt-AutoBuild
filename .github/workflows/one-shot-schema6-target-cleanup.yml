name: One-shot schema6 target cleanup

on:
  push:
    branches:
      - fix-F
    paths:
      - .github/workflows/one-shot-schema6-target-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: lock schema6 workflow cleanup' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix-F
        uses: actions/checkout@v6
        with:
          ref: fix-F
          fetch-depth: 0

      - name: Lock workflow metadata cleanup regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'tools/check-all.mjs';
          let text = readFileSync(path, 'utf8');
          const readAnchor = "const requestAudit = readFileSync(join(ROOT, 'tools', 'request-audit.mjs'), 'utf8');\nconst project = parsed.get('site/wrt/data/project.json');";
          const readReplacement = "const requestAudit = readFileSync(join(ROOT, 'tools', 'request-audit.mjs'), 'utf8');\nconst customBuildWorkflow = readFileSync(join(ROOT, '.github', 'workflows', 'custom-build.yml'), 'utf8');\nconst project = parsed.get('site/wrt/data/project.json');";
          if ((text.split(readAnchor).length - 1) !== 1) throw new Error('check-all workflow source anchor mismatch');
          text = text.replace(readAnchor, readReplacement);
          const contractAnchor = "  !parser.includes('catalog_profile_packages=');";
          const contractReplacement = "  !parser.includes('catalog_profile_packages=') &&\n  !customBuildWorkflow.includes('steps.req.outputs.catalog_arch') &&\n  !customBuildWorkflow.includes('steps.req.outputs.catalog_arch_packages') &&\n  !customBuildWorkflow.includes('steps.req.outputs.catalog_profile_packages');";
          if ((text.split(contractAnchor).length - 1) !== 1) throw new Error('check-all workflow contract anchor mismatch');
          text = text.replace(contractAnchor, contractReplacement);
          writeFileSync(path, text);
          NODE
          node tools/check-all.mjs
          git diff --check

      - name: Commit and push fix-F
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/check-all.mjs
          git commit -m 'test: lock minimal schema 6 build metadata'
          git push origin HEAD:fix-F
