name: Custom Build / 定制构建
run-name: ${{ github.event_name == 'repository_dispatch' && format('Smoke build · {0} {1}/{2}', github.event.client_payload.source, github.event.client_payload.version, github.event.client_payload.variant) || github.event.issue.title }}

on:
  repository_dispatch:
    types: [smoke-build]
  issues:
    types: [opened]

env:
  TZ: Asia/Shanghai

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  admission:
    name: Admission / 构建准入
    if: github.event_name == 'repository_dispatch' || startsWith(github.event.issue.title, '[build]')
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.limit.outputs.allowed }}
      requester: ${{ steps.limit.outputs.requester }}
      slot: ${{ steps.limit.outputs.slot }}
    steps:
      - name: Limit active builds per user / 限制每用户活跃构建数
        id: limit
        uses: actions/github-script@v7
        env:
          MAX_BUILDS_PER_USER: ${{ vars.MAX_BUILDS_PER_USER || '2' }}
        with:
          script: |
            const isIssue = context.eventName === 'issues';
            const isSmoke = context.eventName === 'repository_dispatch';
            const requester = isIssue ? context.payload.issue.user.login
              : `smoke-${String(context.payload.client_payload?.source || 'internal').toLowerCase()}`;
            const isRepositoryOwner = isIssue && requester.toLowerCase() === context.repo.owner.toLowerCase();
            if (isSmoke || isRepositoryOwner) {
              core.setOutput('allowed', 'true');
              core.setOutput('requester', isRepositoryOwner ? `owner-${context.runId}` : requester);
              core.setOutput('slot', '0');
              core.notice(isRepositoryOwner
                ? `Repository owner build admitted without queue: ${requester}`
                : `Internal smoke build admitted: ${requester}`);
              return;
            }
            const configured = Number(process.env.MAX_BUILDS_PER_USER || '2');
            const limit = Number.isInteger(configured) && configured > 0 ? configured : 2;
            const list = async (status) => (await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'custom-build.yml', actor: requester, status, per_page: 100,
            })).data.workflow_runs;
            const active = [...await list('queued'), ...await list('in_progress')]
              .filter((run) => String(run.id) !== String(context.runId));
            active.push({
              id: context.runId,
              created_at: isIssue ? context.payload.issue.created_at : new Date().toISOString(),
            });
            const unique = [...new Map(active.map((run) => [String(run.id), run])).values()]
              .sort((a, b) => a.created_at.localeCompare(b.created_at) || Number(a.id) - Number(b.id));
            const rank = unique.findIndex((run) => String(run.id) === String(context.runId));
            const allowed = rank >= 0 && rank < limit;
            core.setOutput('allowed', String(allowed));
            core.setOutput('requester', requester.toLowerCase());
            core.setOutput('slot', String(Number(context.runId) % limit));
            if (allowed) {
              core.notice(`Build admission granted: ${requester} ${rank + 1}/${limit}`);
              return;
            }
            core.notice(`Build admission refused: ${requester} already has ${limit} active builds.`);
            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${requester}\n\n⏳ 当前你已有 ${limit} 个排队中或运行中的构建，本次未开始。请等待其中一个完成，或在自己的构建 Issue 回复 \`/cancel\` 后再提交。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned',
              });
            }

  build:
    name: Build / 构建
    needs: admission
    if: needs.admission.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    concurrency:
      group: custom-build-user-${{ needs.admission.outputs.requester }}-${{ needs.admission.outputs.slot }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4

      - name: Read Issue attachment or mobile request / 读取附件或手机请求
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          REQUEST_MANIFEST_OUT: request-attachments.json
          REQUEST_DIR: request-attachments
        run: node tools/fetch-build-request.mjs

      - name: Parse & validate request / 解析校验请求(白名单)
        id: req
        env:
          REQUEST_MANIFEST: ${{ github.event_name == 'issues' && 'request-attachments.json' || '' }}
          SUBMITTED_CONFIG_OUT: submitted.config
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IN_DEVICE: ${{ github.event.client_payload.device }}
          IN_SOURCE: ${{ github.event.client_payload.source }}
          IN_VERSION: ${{ github.event.client_payload.version }}
          IN_VARIANT: ${{ github.event.client_payload.variant }}
          IN_PLUGINS: ${{ github.event.client_payload.plugins }}
          IN_TAG: ${{ github.event.client_payload.tag }}
          IN_PACKAGES: ${{ github.event.client_payload.packages }}
        run: node tools/parse-request.mjs

      - name: "Comment on issue: build started / 回评 issue:构建开始"
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${context.payload.issue.user.login}\n\n🚀 构建已开始:${{ steps.req.outputs.summary }}\n\n进度与产物:${url}\n\n如需取消，请在本 Issue 回复 \`/cancel\`（仅提交者本人可取消）。\n\n完成后固件在该页面底部 Artifacts(需登录 GitHub 才能下载),整机编译预计 2~3 小时,请耐心等待。失败时也会上传错误日志供自查。`,
            });

      - name: Comment & close issue on invalid request / 校验失败时回评并关闭 issue
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${context.payload.issue.user.login}\n\n❌ 请求校验未通过,构建未开始。日志:${url}\n\n请核对附件格式与机型字段后重新提交。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned',
            });

      - name: Free disk space / 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies / 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget qemu-utils
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          echo "Runner process timezone / Runner 进程时区: $TZ"

      - name: Clone source code / 拉取源码
        run: |
          git clone "https://github.com/${{ steps.req.outputs.repo }}" -b "${{ steps.req.outputs.branch }}" --depth 1 openwrt
          cd openwrt && git log -1 --pretty='源码提交: %h %an %ad %s'
          # 版本信息写进日志与 Summary,排障时能对照"哪个定制器版本 × 哪个上游快照" / Emit version info to the log and run summary so failures map to exact customizer × upstream snapshots
          TEST_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          echo "测试版本 / test version: $TEST_VERSION"
          echo "定制器版本 / customizer commit: ${GITHUB_SHA::7}"
          {
            echo "### 🧾 构建信息 / Build info"
            echo ""
            echo "- 测试版本 / test version: \`$TEST_VERSION\`"
            echo "- 定制器 / customizer: \`${GITHUB_SHA::7}\`"
            echo "- 上游源码 / upstream: \`$(git log -1 --format='%h %ad' --date=short)\` (${{ steps.req.outputs.repo }} @ ${{ steps.req.outputs.branch }})"
            echo "- 参数 / inputs: \`${{ steps.req.outputs.device }} · ${{ steps.req.outputs.source }} · ${{ steps.req.outputs.version }} · ${{ steps.req.outputs.variant }}\`"
            echo "- 插件 / plugins: \`${{ steps.req.outputs.plugins }}\`"
            echo "- 原始包 / packages: \`${{ steps.req.outputs.packages }}\`"
            echo "- 标识 / tag: \`${{ steps.req.outputs.tag }}\`"
            echo "- 构建编号 / build reference: \`${{ steps.req.outputs.build_ref }}\`"
            echo "- 网页版本 / page version: \`${{ steps.req.outputs.page_version }}\`"
            echo ""
            echo "#### 固件设置 / Firmware settings"
            echo ""
            echo "| 设置 / Setting | 已提交 / Submitted |"
            echo "| --- | --- |"
            echo "| 时区名称 / Zone | \`${{ steps.req.outputs.zonename }}\` |"
            echo "| POSIX 时区 / Timezone | \`${{ steps.req.outputs.timezone }}\` |"
            echo "| 固件主题 / Theme | \`${{ steps.req.outputs.theme }}\` |"
            echo "| NTP | \`${{ steps.req.outputs.ntp_id }}\` · \`${{ steps.req.outputs.ntp_1 }}\` · \`${{ steps.req.outputs.ntp_2 }}\` · \`${{ steps.req.outputs.ntp_3 }}\` · \`${{ steps.req.outputs.ntp_4 }}\` |"
            echo "| opkg | \`${{ steps.req.outputs.opkg_id }}\` · \`${{ steps.req.outputs.opkg_mirror }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          df -hT

      - name: DIY script P1 (before feeds) / DIY 脚本 P1(feeds 前)
        run: |
          chmod +x Shell/*.sh
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/${{ steps.req.outputs.diy1 }}"

      - name: Update & install feeds / 更新并安装 feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: DIY script P2 (default settings) / DIY 脚本 P2(默认设置)
        env:
          WRT_ZONENAME: ${{ steps.req.outputs.zonename }}
          WRT_TIMEZONE: ${{ steps.req.outputs.timezone }}
          WRT_THEME: ${{ steps.req.outputs.theme }}
          WRT_NTP_1: ${{ steps.req.outputs.ntp_1 }}
          WRT_NTP_2: ${{ steps.req.outputs.ntp_2 }}
          WRT_NTP_3: ${{ steps.req.outputs.ntp_3 }}
          WRT_NTP_4: ${{ steps.req.outputs.ntp_4 }}
          WRT_NTP_ID: ${{ steps.req.outputs.ntp_id }}
          WRT_OPKG_ID: ${{ steps.req.outputs.opkg_id }}
          WRT_OPKG_MIRROR: ${{ steps.req.outputs.opkg_mirror }}
          WRT_PAGE_VERSION: ${{ steps.req.outputs.page_version }}
          WRT_BUILD_REF: ${{ steps.req.outputs.build_ref }}
        run: |
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/${{ steps.req.outputs.diy2 }}"

      - name: Verify firmware settings / 核验固件设置
        if: steps.req.outputs.firmware_snapshot == '1'
        env:
          EXPECTED_ZONENAME: ${{ steps.req.outputs.zonename }}
          EXPECTED_TIMEZONE: ${{ steps.req.outputs.timezone }}
          EXPECTED_THEME: ${{ steps.req.outputs.theme }}
          EXPECTED_NTP: ${{ steps.req.outputs.ntp_id }}
          EXPECTED_OPKG: ${{ steps.req.outputs.opkg_id }}
        run: |
          set -euo pipefail
          INFO="openwrt/files/etc/weig-build-info"
          DEFAULTS="openwrt/files/etc/uci-defaults/10-weig-system"
          test -s "$INFO"
          test -s "$DEFAULTS"
          grep -Fx "zonename=$EXPECTED_ZONENAME" "$INFO"
          grep -Fx "timezone=$EXPECTED_TIMEZONE" "$INFO"
          grep -Fx "theme=$EXPECTED_THEME" "$INFO"
          grep -Fx "ntp=$EXPECTED_NTP" "$INFO"
          grep -Fx "opkg=$EXPECTED_OPKG" "$INFO"
          cp "$INFO" firmware-settings.txt

      - name: Set custom LAN IP / 自定义后台登录地址
        if: steps.req.outputs.lanip != '192.168.1.1'
        run: |
          cd openwrt
          # diy2 已把各源默认地址统一为 192.168.1.1,这里再改成用户选的 / diy2 normalized every source to 192.168.1.1 first, now switch to the user's choice
          sed -i 's/192\.168\.1\.1/${{ steps.req.outputs.lanip }}/g' package/base-files/files/bin/config_generate
          grep -n '${{ steps.req.outputs.lanip }}' package/base-files/files/bin/config_generate | head -3

      - name: Set initial root password / 设置初始密码(uci-defaults,首次开机生效)
        if: steps.req.outputs.rootpw != ''
        env:
          RPW: ${{ steps.req.outputs.rootpw }}
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          # 字符集已在 parse-request 白名单校验,单引号包裹安全 / charset whitelisted upstream, single-quoting is safe
          if [ "$RPW" = "@empty" ]; then
            printf '#!/bin/sh\npasswd -d root\nexit 0\n' > openwrt/files/etc/uci-defaults/99-init-password
          else
            printf '#!/bin/sh\nprintf '\''%%s\\n%%s\\n'\'' '\''%s'\'' '\''%s'\'' | passwd root\nexit 0\n' "$RPW" "$RPW" > openwrt/files/etc/uci-defaults/99-init-password
          fi
          chmod +x openwrt/files/etc/uci-defaults/99-init-password
          echo "Initial password script created / 初始密码脚本已创建"

      - name: Prepare authoritative .config / 准备权威配置
        run: |
          if [ "${{ steps.req.outputs.authoritative_config }}" = "1" ]; then
            cp submitted.config openwrt/.config
          else
            # repository_dispatch is the hidden internal smoke compatibility path.
            node tools/build-config.mjs \
              --device "${{ steps.req.outputs.device }}" \
              --source "${{ steps.req.outputs.source }}" \
              --version "${{ steps.req.outputs.version }}" \
              --variant "${{ steps.req.outputs.variant }}" \
               --plugins "${{ steps.req.outputs.plugins }}" \
                --packages "${{ steps.req.outputs.packages }}" \
                --theme "${{ steps.req.outputs.theme }}" \
                --zonename "${{ steps.req.outputs.zonename }}" \
                --timezone "${{ steps.req.outputs.timezone }}" \
                --page-version "${{ steps.req.outputs.page_version }}" \
               --out openwrt/.config
            cp openwrt/.config submitted.config
          fi
          cd openwrt
          set_config_flag() {
            sed -i -E "/^(CONFIG_${1}=|# CONFIG_${1} is not set)/d" .config
            echo "CONFIG_${1}=y" >> .config
          }
          set_config_flag DEVEL
          set_config_flag BUILD_LOG
          grep -Fx 'CONFIG_DEVEL=y' .config || { echo 'CONFIG_DEVEL is missing from the build config' >&2; exit 1; }
          grep -Fx 'CONFIG_BUILD_LOG=y' .config || { echo 'CONFIG_BUILD_LOG is missing from the build config' >&2; exit 1; }
          if [ "${{ steps.req.outputs.firmware_snapshot }}" = "1" ]; then
            grep -Fx "CONFIG_PACKAGE_${{ steps.req.outputs.theme }}=y" .config || {
              echo "Selected firmware theme is missing from the submitted config: ${{ steps.req.outputs.theme }}" >&2
              exit 1
            }
          fi
          cp .config "$GITHUB_WORKSPACE/build.config"
          grep '^CONFIG_TARGET_PROFILE' .config
          grep -c '^CONFIG_PACKAGE_luci-app' .config || true

      - name: Record effective configuration / 记录实际构建配置
        run: |
          cd openwrt
          TEST_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          GEOIP_STATE="$(grep -E '^CONFIG_PACKAGE_v2ray-geoip=[ym]$' .config || echo 'disabled')"
          GEOSITE_STATE="$(grep -E '^CONFIG_PACKAGE_v2ray-geosite=[ym]$' .config || echo 'disabled')"
          PROXY_RE='^CONFIG_PACKAGE_.*(passwall|ssr|vssr|shadowsocks|v2ray|xray|trojan|tinyproxy|brook|haproxy|pdnsd|kcptun|simple-obfs|chinadns|dns2socks|ipt2socks|microsocks|naiveproxy|redsocks|openclash|homeproxy).*=([ym])$'
          PROXY_COUNT="$(grep -Ec "$PROXY_RE" .config || true)"
          grep -E "$PROXY_RE" .config > "$GITHUB_WORKSPACE/proxy-selected.txt" || true
          if [ ! -s "$GITHUB_WORKSPACE/proxy-selected.txt" ]; then
            echo "(none / 无)" > "$GITHUB_WORKSPACE/proxy-selected.txt"
          fi
          {
            echo "test_version=$TEST_VERSION"
            echo "customizer=${GITHUB_SHA::7}"
            echo "upstream=$(git rev-parse --short HEAD)"
            echo "device=${{ steps.req.outputs.device }}"
            echo "source=${{ steps.req.outputs.source }}"
            echo "version=${{ steps.req.outputs.version }}"
            echo "variant=${{ steps.req.outputs.variant }}"
            echo "request_mode=${{ steps.req.outputs.request_mode }}"
            echo "config_policy=authoritative-no-defconfig"
            echo "config_id=${{ steps.req.outputs.config_id }}"
            echo "submitted_sha256=${{ steps.req.outputs.submitted_sha256 }}"
            echo "plugins=${{ steps.req.outputs.plugins }}"
            echo "packages=${{ steps.req.outputs.packages }}"
            echo "tag=${{ steps.req.outputs.tag }}"
            echo "build_ref=${{ steps.req.outputs.build_ref }}"
            echo "page_version=${{ steps.req.outputs.page_version }}"
            echo "zonename=${{ steps.req.outputs.zonename }}"
            echo "timezone=${{ steps.req.outputs.timezone }}"
            echo "theme=${{ steps.req.outputs.theme }}"
            echo "ntp=${{ steps.req.outputs.ntp_id }}"
            echo "ntp_servers=${{ steps.req.outputs.ntp_1 }} ${{ steps.req.outputs.ntp_2 }} ${{ steps.req.outputs.ntp_3 }} ${{ steps.req.outputs.ntp_4 }}"
            echo "opkg=${{ steps.req.outputs.opkg_id }}"
            echo "opkg_mirror=${{ steps.req.outputs.opkg_mirror }}"
            echo "v2ray_geoip=$GEOIP_STATE"
            echo "v2ray_geosite=$GEOSITE_STATE"
            echo "proxy_selected_count=$PROXY_COUNT"
          } | tee "$GITHUB_WORKSPACE/build-metadata.txt"
          {
            echo "### 🔎 配置预检 / Config preflight"
            echo ""
            echo "- v2ray-geoip: \`$GEOIP_STATE\`"
            echo "- v2ray-geosite: \`$GEOSITE_STATE\`"
            echo "- 代理相关已选符号 / selected proxy-related symbols: \`$PROXY_COUNT\`"
            echo ""
            echo '```text'
            cat "$GITHUB_WORKSPACE/proxy-selected.txt"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final .config / 上传最终 .config(编译失败也能拿到)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.build_ref }}-CONFIG-${{ steps.req.outputs.artifact_tail }}
          path: |
            openwrt/.config
            submitted.config
            build.config
            build-metadata.txt
            firmware-settings.txt
            proxy-selected.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Download packages / 下载依赖包
        run: |
          cd openwrt
          JOBS=$(( $(nproc) + 1 ))
          echo "下载并发 / download jobs: $JOBS"
          set +e
          set -o pipefail
          stdbuf -oL -eL make download -j"$JOBS" 2>&1 |
            tee "$GITHUB_WORKSPACE/download.log"
          DOWNLOAD_RC=${PIPESTATUS[0]}
          set -e
          echo "下载退出码 / download exit code: $DOWNLOAD_RC"
          {
            echo "### 📥 下载阶段 / Download stage"
            echo ""
            echo "- jobs: \`$JOBS\`"
            echo "- exit code: \`$DOWNLOAD_RC\`"
            echo "- Actions 实时显示原始输出,并保存到 \`download.log\`。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DOWNLOAD_RC" -ne 0 ]; then
            echo "::warning::依赖下载存在失败;将继续编译。完整信息已写入 download.log。"
          fi

      - name: Compile / 编译(原始实时日志)
        id: compile
        continue-on-error: true
        run: |
          cd openwrt
          JOBS=$(( $(nproc) + 1 ))
          echo "编译并发 / compile jobs: $JOBS"
          set +e
          set -o pipefail
          stdbuf -oL -eL make -j"$JOBS" 2>&1 |
            tee "$GITHUB_WORKSPACE/build.log"
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "### 🛠️ 编译 / Compile"
            echo ""
            echo "- jobs: \`$JOBS\`"
            echo "- exit code: \`$RC\`"
            echo "- Actions 实时显示原始输出,并保存到 \`build.log\`。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败;完整信息已写入 build.log。"
          fi
          exit "$RC"

      - name: Diagnose failed compile / 单线程定位失败原因
        id: diagnose
        if: steps.compile.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          cd openwrt
          echo "单线程重试 / single-thread retry: make -j1 V=s (60 minute limit)"
          set +e
          set -o pipefail
          timeout 60m stdbuf -oL -eL make -j1 V=s 2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostic.log"
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "### 🔎 单线程重试 / Single-thread retry"
            echo ""
            echo "- command: \`make -j1 V=s\`"
            echo "- exit code: \`$RC\`"
            echo "- log: \`build-diagnostic.log\`"
            echo "- result: exit 0 resumes the build; a non-zero exit keeps it failed."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -eq 124 ]; then
            echo "::warning::单线程重试超过 60 分钟，已停止；请查看 build-diagnostic.log。"
          elif [ "$RC" -ne 0 ]; then
            echo "::error::单线程重试仍失败；请查看 build-diagnostic.log。"
          fi
          exit "$RC"

      - name: Finalize compile result / 确认编译结果
        if: always()
        run: |
          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            echo "Parallel compile succeeded / 并行编译成功"
            exit 0
          fi
          if [ "${{ steps.diagnose.outcome }}" = "success" ]; then
            echo "::warning::并行编译失败，但单线程重试成功；构建继续。"
            {
              echo "### ✅ 单线程恢复 / Recovered by single-thread retry"
              echo ""
              echo "- parallel build: failed"
              echo "- make -j1 V=s: succeeded"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::并行与单线程编译均失败；请下载 BUILD-LOGS。"
          exit 1

      - name: Collect failure logs / 收集失败日志
        if: failure()
        run: |
          mkdir -p failure-logs
          cp build.log build-diagnostic.log download.log failure-logs/ 2>/dev/null || true
          cp build-metadata.txt failure-logs/ 2>/dev/null || true
          cp proxy-selected.txt failure-logs/ 2>/dev/null || true
          cp submitted.config build.config failure-logs/ 2>/dev/null || true
          cp openwrt/.config failure-logs/final.config 2>/dev/null || true
          # OpenWrt 的 CONFIG_BUILD_LOG=y 会把每个包的日志写到 openwrt/logs/ / With CONFIG_BUILD_LOG=y, OpenWrt writes per-package build logs to openwrt/logs/
          if [ -d openwrt/logs ]; then
            tar czf failure-logs/package-logs.tar.gz -C openwrt logs || true
          fi
          # 00-SUMMARY 排在最前:构建参数 + 报错关键字,方便一眼定位 / 00-SUMMARY sorts first: build params + error keywords for quick triage
          {
            echo "===================== 失败总结 / FAILURE SUMMARY ====================="
            echo "测试版本/test version: $(tr -d '\r\n' < VERSION)"
            echo "机型/device : ${{ steps.req.outputs.device }}"
            echo "源码/source : ${{ steps.req.outputs.source }} @ ${{ steps.req.outputs.branch }}"
            echo "版本/version: ${{ steps.req.outputs.version }}   变体/variant: ${{ steps.req.outputs.variant }}"
            echo "定制器/customizer: ${GITHUB_SHA::7}"
            echo "网页版本/page version: ${{ steps.req.outputs.page_version }}"
            echo "插件/plugins: ${{ steps.req.outputs.plugins }}"
            echo "标识/tag    : ${{ steps.req.outputs.tag }}   run: ${{ github.run_id }}"
            # 离线看此文件时可凭下面的直链回到本次 run / Keep the run URL here so this file can be traced back offline
            echo "本次构建 / this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "-------- 已收集日志 / COLLECTED LOGS --------"
            for log in build.log build-diagnostic.log package-logs.tar.gz; do
              [ -f "failure-logs/$log" ] && echo "- $log"
            done
            echo ""
            echo "-------- 定位关键字 / SEARCH KEYWORDS --------"
            for log in build-diagnostic.log build.log; do
              [ -s "$log" ] || continue
              echo "[$log]"
              grep -oE 'Package [A-Za-z0-9._-]+ is missing|No rule to make target[^,]*|undefined reference to [^ ]+|error: [^;]{0,80}|Error [0-9]+' "$log" 2>/dev/null | sort | uniq -c | sort -rn | head -n 20 || true
            done
            echo ""
            echo "-------- 最后出错的目标 / LAST FAILING TARGETS --------"
            for log in build-diagnostic.log build.log; do
              [ -s "$log" ] || continue
              echo "[$log]"
              grep -E 'make\[[0-9]+\].*(Error|failed)' "$log" 2>/dev/null | tail -n 10 || true
            done
            echo ""
            echo "-------- 报错行摘录(最后 40 条)/ ERROR LINES (last 40) --------"
            for log in build-diagnostic.log build.log; do
              [ -s "$log" ] || continue
              echo "[$log]"
              grep -nE 'Error [0-9]+|error:|No rule to make target|failed|missing' "$log" 2>/dev/null | tail -n 40 || true
            done
            echo ""
            echo "完整日志见本 artifact 内实际列出的文件。"
          } > failure-logs/00-SUMMARY.txt
          cat failure-logs/00-SUMMARY.txt >> "$GITHUB_STEP_SUMMARY" || true
          # 取件指引追加到 Summary 页(Markdown)/ Append the log-retrieval guide to the step summary page (Markdown)
          {
            echo ''
            echo '## 📥 完整日志取件 / How to get full logs'
            echo ''
            echo '| 步骤 / Step | 操作 / Action |'
            echo '| --- | --- |'
            echo '| 1 | 打开本次构建页面 / Open this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |'
            echo '| 2 | 拉到页面最底部 **Artifacts** 区 / Scroll to the **Artifacts** section at the very bottom |'
            echo '| 3 | 下载 `${{ steps.req.outputs.build_ref }}-BUILD-LOGS-` 开头的压缩包并解压 / Download and unzip the archive whose name starts with `${{ steps.req.outputs.build_ref }}-BUILD-LOGS-` |'
            echo '| 4 | 先看 `00-SUMMARY.txt`,再看 `build-diagnostic.log`（如有）/ `build.log` / `errors.txt` / `package-logs.tar.gz`（如有） / Read `00-SUMMARY.txt` first, then `build-diagnostic.log` (if present) / `build.log` / `errors.txt` / `package-logs.tar.gz` (if present) |'
            echo ''
            echo '> ⏳ 完整日志 Artifact 保留 14 天,过期需重新提交构建 / Complete log artifacts are kept for 14 days.'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # 摘出最后 200 行与含 Error 的行,方便快速定位 / Extract the last 200 lines and the error lines for quick triage
          LOG_FOR_TAIL=build.log
          [ -s build-diagnostic.log ] && LOG_FOR_TAIL=build-diagnostic.log
          tail -n 200 "$LOG_FOR_TAIL" > failure-logs/tail-200.txt 2>/dev/null || true
          {
            for log in build-diagnostic.log build.log; do
              [ -s "$log" ] || continue
              echo "===== $log ====="
              grep -nE 'Error [0-9]+|error:|No rule to make target|failed|missing' "$log" | tail -n 60 || true
            done
          } > failure-logs/errors.txt
          echo '===== 最后 60 行 ====='
          tail -n 60 build.log 2>/dev/null || echo '(没有 build.log,可能在编译前就失败了)'
          ls -lh failure-logs
          # 在步骤日志末尾指明取件入口 / Point users at the artifact and where to find retrieval steps
          echo "📤 artifact:${{ steps.req.outputs.build_ref }}-BUILD-LOGS-${{ steps.req.outputs.artifact_tail }} —— 完整日志将上传,取件方法见 issue 回评/Summary 页 / Full logs will be uploaded; see the issue comment or Summary"

      - name: Collect menuconfig M packages / 收集 menuconfig 的 M 软件包
        if: success()
        run: node tools/collect-optional-packages.mjs --config openwrt/.config --bin openwrt/bin --out optional-packages

      - name: Check disk usage / 检查空间
        if: (!cancelled())
        run: df -hT

      - name: Classify artifacts and write download guide / 分类产物并生成下载说明
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact-staging"
          FIRMWARE="$ROOT/FIRMWARE-ALL"
          LOGS="$ROOT/BUILD-LOGS"
          mkdir -p "$FIRMWARE" "$LOGS"

          shopt -s nullglob
          for file in openwrt/bin/targets/*/*/*; do
            [ -f "$file" ] || continue
            cp -a "$file" "$FIRMWARE/"
          done
          if [ -s firmware-settings.txt ]; then
            cp firmware-settings.txt "$FIRMWARE/00-BUILD-SETTINGS.txt"
          fi
          printf '%s\n' \
            '固件全集 / ALL FIRMWARE FILES' \
            '首次刷机通常使用 factory；sysupgrade 仅用于当前固件与闪存布局兼容的升级。' \
            'First flash usually uses factory. Use sysupgrade only for a compatible installed firmware and flash layout.' \
            'initramfs 用于临时启动/救援；manifest、buildinfo、sha256sums 仅用于核对。' \
            'Always verify the exact model and partition layout before flashing.' > "$FIRMWARE/00-请先读我-README.txt"

          cp build.log download.log build-metadata.txt firmware-settings.txt proxy-selected.txt "$LOGS/" 2>/dev/null || true
          if [ -d failure-logs ]; then cp -a failure-logs/. "$LOGS/"; fi
          if [ -d openwrt/logs ]; then
            tar czf "$LOGS/package-logs.tar.gz" -C openwrt logs || true
          fi
          printf '%s\n' \
            '完整构建日志 / BUILD LOGS' \
            '先看 00-SUMMARY.txt（若存在），再看 build.log、download.log 与 errors.txt。' \
            '日志 Artifact 保留 14 天。' > "$LOGS/00-请先读我-README.txt"

          {
            echo ''
            echo '## 📦 固件下载与安装选择 / Firmware download guide'
            echo ''
            echo '> [!IMPORTANT]'
            echo '> 下载 `${{ steps.req.outputs.build_ref }}-FIRMWARE-ALL-*`。首次刷机通常用 `factory`；`sysupgrade` 只适用于当前固件和闪存布局兼容的升级。'
            echo '> Download `${{ steps.req.outputs.build_ref }}-FIRMWARE-ALL-*`. First flash usually uses `factory`; use `sysupgrade` only for a compatible installed firmware and flash layout.'
            echo '> GitHub 会提供 ZIP 下载外壳；这里使用零压缩上传，内部固件保持原文件与原后缀。'
            echo '> GitHub provides the ZIP download wrapper; upload uses zero compression and preserves every original firmware file and suffix.'
            echo ''
            echo '| Artifact | 内容 / Contents |'
            echo '| --- | --- |'
            echo '| 📦 `${{ steps.req.outputs.build_ref }}-FIRMWARE-ALL-${{ steps.req.outputs.artifact_tail }}` | 全部固件与 manifest/buildinfo/sha256sums；文件保持原后缀 |'
            echo '| ⚙️ `${{ steps.req.outputs.build_ref }}-CONFIG-${{ steps.req.outputs.artifact_tail }}` | 用户提交配置、实际开编配置和构建元数据 |'
            echo '| 🧾 `${{ steps.req.outputs.build_ref }}-BUILD-LOGS-${{ steps.req.outputs.artifact_tail }}` | 完整下载/编译日志；保留 14 天 |'
            echo '| 🧩 `${{ steps.req.outputs.build_ref }}-OPTIONAL-PACKAGES-${{ steps.req.outputs.artifact_tail }}` | menuconfig 选为 M：已编译但未写入固件的软件包 |'
            echo ''
            echo '> [!WARNING]'
            echo '> `sysupgrade` 不是通用更新包。不确定机型、当前固件或布局时不要刷。 / `sysupgrade` is not a universal updater.'
            echo ''
            echo '- 固件、配置、构建信息保留 **30 天**；完整日志保留 **14 天**。'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all firmware / 上传全部固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.build_ref }}-FIRMWARE-ALL-${{ steps.req.outputs.artifact_tail }}
          path: artifact-staging/FIRMWARE-ALL/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload complete logs / 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.build_ref }}-BUILD-LOGS-${{ steps.req.outputs.artifact_tail }}
          path: artifact-staging/BUILD-LOGS/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload optional M packages / 上传可选 M 软件包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.build_ref }}-OPTIONAL-PACKAGES-${{ steps.req.outputs.artifact_tail }}
          path: optional-packages/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: "Comment on issue: success & close / 回评 issue:构建成功并关闭"
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${context.payload.issue.user.login}\n\n✅ 构建完成!\n\n下载 / Download:${url}\n\n- \`${{ steps.req.outputs.build_ref }}-FIRMWARE-ALL-${{ steps.req.outputs.artifact_tail }}\`:全部固件及校验资料;首次刷机通常选 \`factory\`\n- \`${{ steps.req.outputs.build_ref }}-OPTIONAL-PACKAGES-${{ steps.req.outputs.artifact_tail }}\`:menuconfig 选为 M、未写入固件的可选安装包\n- \`${{ steps.req.outputs.build_ref }}-CONFIG-${{ steps.req.outputs.artifact_tail }}\`:用户提交配置、实际开编配置和构建元数据\n- \`${{ steps.req.outputs.build_ref }}-BUILD-LOGS-${{ steps.req.outputs.artifact_tail }}\`:完整日志(14 天)\n\n\`sysupgrade\` 只用于当前固件与闪存布局兼容的升级。固件/配置保留 30 天。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed', state_reason: 'completed',
            });

      - name: "Comment on issue: failure & close / 回评 issue:构建失败(附日志)并关闭"
        if: github.event_name == 'issues' && steps.req.outcome == 'success' && (failure() || cancelled())
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let errs = '';
            const failureDir = 'failure-logs';
            try {
              errs = fs.readFileSync(`${failureDir}/00-SUMMARY.txt`, 'utf8').trim().split('\n').slice(0, 40).join('\n');
            } catch (e) { /* 编译前就失败,没有日志 / Failed before compiling, so no error log exists */ }
            const logFiles = [
              ['00-SUMMARY.txt', '失败总结与定位关键字(先看这个)'],
              ['build-diagnostic.log', '单线程 V=s 诊断日志'],
              ['build.log', '完整并行编译输出'],
              ['tail-200.txt', '最后 200 行'],
              ['errors.txt', '摘出的报错行'],
              ['package-logs.tar.gz', '各软件包日志'],
              ['final.config', '本次实际使用的配置'],
            ].filter(([name]) => fs.existsSync(`${failureDir}/${name}`))
              .map(([name, description]) => `- \`${name}\` ${description}`).join('\n');
            const body = `@${context.payload.issue.user.login}\n\n❌ 构建失败或被取消。\n\n完整日志与产物:${url}\n` +
              `底部 Artifacts 里有 \`${{ steps.req.outputs.build_ref }}-BUILD-LOGS-${{ steps.req.outputs.artifact_tail }}\`(保留 14 天),内含:\n` +
              `${logFiles}\n\n` +
              (errs ? `摘录报错:\n\`\`\`\n${errs}\n\`\`\`\n\n` : '') +
              `常见原因:插件相互冲突、原厂分区容量不足(插件勾太多)、高级模式强制开启了该源没有的包、上游源码当日有问题。` +
              `可减少插件、换大分区变体、关掉高级模式或改天重试。` +
              `\n\n📥 完整日志取件 / How to get full logs\n` +
              `1. 打开本次构建页面 / Open this run:${url}\n` +
              `2. 拉到页面最底部 Artifacts 区 / Scroll to the Artifacts section at the very bottom\n` +
              `3. 下载 \`${{ steps.req.outputs.build_ref }}-BUILD-LOGS-\` 开头的压缩包,解压后先看 \`00-SUMMARY.txt\`,再看实际列出的日志 / Download the \`${{ steps.req.outputs.build_ref }}-BUILD-LOGS-\` archive; read \`00-SUMMARY.txt\` first, then the listed logs.\n\n` +
              `⏳ BUILD-LOGS 保留 14 天,过期需重新提交构建 / BUILD-LOGS is kept for 14 days; resubmit after it expires.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned',
            });
