name: Custom Build / 定制构建
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build {0}#{1} · {2}', inputs.requester, inputs.issue_number, inputs.issue_title) || github.event.issue.title }}

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Original build Issue number
        required: true
        type: string
      issue_title:
        description: Original build Issue title snapshot
        required: true
        type: string
      issue_body:
        description: Original build Issue body snapshot
        required: true
        type: string
      requester:
        description: Original build Issue author
        required: true
        type: string
      issue_created_at:
        description: Original build Issue creation time
        required: true
        type: string
      request_branch:
        description: Exact AutoBuild branch requested by the page
        required: true
        type: string
      request_commit:
        description: Exact AutoBuild commit requested by the page
        required: true
        type: string

env:
  TZ: Asia/Shanghai

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  identity:
    name: Exact identity / 精确身份
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      valid: ${{ steps.guard.outputs.valid }}
    steps:
      - name: Verify dispatch ref and original Issue / 核对派发版本与原始 Issue
        id: guard
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          REQUESTER: ${{ inputs.requester }}
          ISSUE_CREATED_AT: ${{ inputs.issue_created_at }}
          REQUEST_BRANCH: ${{ inputs.request_branch }}
          REQUEST_COMMIT: ${{ inputs.request_commit }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const requester = process.env.REQUESTER;
            const requestBranch = process.env.REQUEST_BRANCH;
            const requestCommit = process.env.REQUEST_COMMIT.toLowerCase();
            const workflowBranch = process.env.WORKFLOW_BRANCH;
            const workflowCommit = process.env.WORKFLOW_COMMIT.toLowerCase();
            core.setOutput('valid', 'false');

            const reject = async (message) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `@${requester}\n\n❌ ${message}\n\n构建已阻止 / Build blocked.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'not_planned',
              });
              core.setFailed(message);
            };

            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0 || !/^[A-Za-z0-9-]{1,39}$/.test(requester)) {
              await reject('派发身份字段非法 / Invalid dispatch identity fields.');
              return;
            }
            if (workflowBranch !== requestBranch || workflowCommit !== requestCommit) {
              await reject(`Worker 身份不匹配：request=${requestBranch}@${requestCommit.slice(0, 12)}, workflow=${workflowBranch}@${workflowCommit.slice(0, 12)} / Worker ref does not match the exact request.`);
              return;
            }
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            if (issue.state !== 'open') {
              core.notice(`Issue #${issueNumber} is closed; worker will not start.`);
              return;
            }
            if (issue.user.login.toLowerCase() !== requester.toLowerCase() ||
                issue.created_at !== process.env.ISSUE_CREATED_AT || issue.title !== process.env.ISSUE_TITLE) {
              await reject('原始 Issue 身份已变化 / Original Issue identity no longer matches the dispatch snapshot.');
              return;
            }
            core.setOutput('valid', 'true');

  admission:
    name: Admission / 构建准入
    needs: identity
    if: always() && ((github.event_name == 'issues' && startsWith(github.event.issue.title, '[build]')) || (github.event_name == 'workflow_dispatch' && needs.identity.outputs.valid == 'true'))
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.limit.outputs.allowed }}
      requester: ${{ steps.limit.outputs.requester }}
      slot: ${{ steps.limit.outputs.slot }}
    steps:
      - name: Limit active builds per user / 限制每用户活跃构建数
        id: limit
        uses: actions/github-script@v8
        env:
          MAX_BUILDS_PER_USER: ${{ vars.MAX_BUILDS_PER_USER || '2' }}
          REQUESTER: ${{ github.event_name == 'workflow_dispatch' && inputs.requester || github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_created_at || github.event.issue.created_at }}
        with:
          script: |
            const requester = process.env.REQUESTER;
            const isRepositoryOwner = requester.toLowerCase() === context.repo.owner.toLowerCase();
            if (isRepositoryOwner) {
              core.setOutput('allowed', 'true');
              core.setOutput('requester', `owner-${context.runId}`);
              core.setOutput('slot', '0');
              core.notice(`Repository owner build admitted without queue: ${requester}`);
              return;
            }
            const configured = Number(process.env.MAX_BUILDS_PER_USER || '2');
            const limit = Number.isInteger(configured) && configured > 0 ? configured : 2;
            const list = async (status) => (await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'custom-build.yml', status, per_page: 100,
            })).data.workflow_runs;
            const userPrefix = `Build ${requester}#`.toLowerCase();
            const active = [...await list('queued'), ...await list('in_progress')]
              .filter((run) => {
                if (String(run.id) === String(context.runId)) return false;
                if (run.event === 'workflow_dispatch') {
                  return String(run.display_title || '').toLowerCase().startsWith(userPrefix);
                }
                return run.event === 'issues' &&
                  String(run.actor?.login || '').toLowerCase() === requester.toLowerCase();
              });
            active.push({
              id: context.runId,
              created_at: process.env.ISSUE_CREATED_AT,
            });
            const unique = [...new Map(active.map((run) => [String(run.id), run])).values()]
              .sort((a, b) => a.created_at.localeCompare(b.created_at) || Number(a.id) - Number(b.id));
            const rank = unique.findIndex((run) => String(run.id) === String(context.runId));
            const allowed = rank >= 0 && rank < limit;
            core.setOutput('allowed', String(allowed));
            core.setOutput('requester', requester.toLowerCase());
            core.setOutput('slot', String(Number(context.runId) % limit));
            if (allowed) {
              core.notice(`Build admission granted: ${requester} ${rank + 1}/${limit}`);
              return;
            }
            core.notice(`Build admission refused: ${requester} already has ${limit} active builds.`);
            {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                body: `@${requester}\n\n⏳ 当前你已有 ${limit} 个排队中或运行中的构建，本次未开始。请等待其中一个完成，或在自己的构建 Issue 回复 \`/cancel\` 后再提交。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER), state: 'closed', state_reason: 'not_planned',
              });
            }

  build:
    name: Build / 构建
    needs: admission
    if: needs.admission.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    concurrency:
      group: custom-build-user-${{ needs.admission.outputs.requester }}-${{ needs.admission.outputs.slot }}
      cancel-in-progress: false
    outputs:
      firmware_matrix: ${{ steps.firmware_manifest.outputs.matrix }}
      bridge_artifact_id: ${{ steps.raw_bridge.outputs.artifact-id }}
      build_ref: ${{ steps.req.outputs.build_ref }}
      artifact_ref: ${{ steps.req.outputs.artifact_ref }}

    steps:
      - name: Checkout exact request commit / 检出精确请求提交
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.request_commit || github.sha }}

      - name: Verify checked-out commit / 核对检出提交
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUEST_COMMIT: ${{ inputs.request_commit }}
        run: test "$(git rev-parse HEAD)" = "$REQUEST_COMMIT"

      - name: Read Issue attachment or mobile request / 读取附件或手机请求
        env:
          ISSUE_BODY: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_body || '' }}
          REQUEST_MANIFEST_OUT: request-attachments.json
          REQUEST_DIR: request-attachments
        run: node tools/fetch-build-request.mjs

      - name: Parse & validate request / 解析校验请求(白名单)
        id: req
        env:
          REQUEST_MANIFEST: request-attachments.json
          SUBMITTED_CONFIG_OUT: submitted.config
          RECOMMENDED_AUDIT_OUT: recommended-audit.json
          ISSUE_TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_title || github.event.issue.title }}
          EXPECTED_REQUEST_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.request_branch || '' }}
          EXPECTED_REQUEST_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.request_commit || '' }}
        run: node tools/parse-request.mjs

      - name: "Comment on issue: build started / 回评 issue:构建开始"
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          REQUESTER: ${{ github.event_name == 'workflow_dispatch' && inputs.requester || github.event.issue.user.login }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `@${process.env.REQUESTER}\n\n🚀 构建已开始:${{ steps.req.outputs.summary }}\n\n进度与产物:${url}\n\n如需取消，请在本 Issue 回复 \`/cancel\`（仅提交者本人可取消）。\n\n完成后固件在该页面底部 Artifacts(需登录 GitHub 才能下载),整机编译预计 2~3 小时,请耐心等待。失败时也会上传错误日志供自查。`,
            });

      - name: Comment & close issue on invalid request / 校验失败时回评并关闭 issue
        if: failure()
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          REQUESTER: ${{ github.event_name == 'workflow_dispatch' && inputs.requester || github.event.issue.user.login }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `@${process.env.REQUESTER}\n\n❌ 请求校验未通过,构建未开始。日志:${url}\n\n请核对附件格式与机型字段后重新提交。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER), state: 'closed', state_reason: 'not_planned',
            });

      - name: Free disk space / 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "- Defconfig / 官方补全: ${{ steps.req.outputs.use_defconfig == '1' && 'enabled' || 'disabled' }}"
          df -hT

      - name: Install build dependencies / 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget qemu-utils
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          echo "Runner process timezone / Runner 进程时区: $TZ"

      - name: Clone source code / 拉取源码
        env:
          REQUEST_BRANCH: ${{ steps.req.outputs.source_env }}
          REQUEST_COMMIT: ${{ steps.req.outputs.request_commit }}
        run: |
          if [ -n "${{ steps.req.outputs.source_commit }}" ]; then
            git init openwrt
            git -C openwrt remote add origin "https://github.com/${{ steps.req.outputs.repo }}"
            git -C openwrt fetch --depth 1 origin "${{ steps.req.outputs.source_commit }}"
            git -C openwrt checkout --detach FETCH_HEAD
            test "$(git -C openwrt rev-parse HEAD)" = "${{ steps.req.outputs.source_commit }}"
          else
            git clone "https://github.com/${{ steps.req.outputs.repo }}" -b "${{ steps.req.outputs.branch }}" --depth 1 openwrt
          fi
          cd openwrt && git log -1 --pretty='源码提交: %h %an %ad %s'
          # 版本信息写进日志与 Summary,排障时能对照"哪个定制器版本 × 哪个上游快照" / Emit version info to the log and run summary so failures map to exact customizer × upstream snapshots
          TEST_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          echo "测试版本 / test version: $TEST_VERSION"
          echo "定制器版本 / customizer commit: ${GITHUB_SHA::7}"
          {
            echo "### 🧾 构建信息 / Build info"
            echo ""
            echo "- 测试版本 / test version: \`$TEST_VERSION\`"
            echo "- 定制器 / customizer: \`${GITHUB_SHA::7}\`"
            echo "- 请求分支 / request branch: \`${REQUEST_BRANCH:-main}\`"
            echo "- 请求提交 / request commit: \`${REQUEST_COMMIT:-unknown}\`"
            echo "- Workflow 分支 / workflow branch: \`${GITHUB_REF_NAME:-unknown}\`"
            echo "- Workflow 提交 / workflow commit: \`${GITHUB_SHA}\`"
            echo "- 上游源码 / upstream: \`$(git log -1 --format='%h %ad' --date=short)\` (${{ steps.req.outputs.repo }} @ ${{ steps.req.outputs.branch }})"
            echo "- Catalog: \`${{ steps.req.outputs.catalog_revision }}\` · \`${{ steps.req.outputs.catalog_asset }}\`"
            echo "- 参数 / inputs: \`${{ steps.req.outputs.device }} · ${{ steps.req.outputs.source }} · ${{ steps.req.outputs.version }} · ${{ steps.req.outputs.variant }}\`"
            echo "- 构建契约 / build contract: build arch \`${{ steps.req.outputs.catalog_arch }}\`; package arch \`${{ steps.req.outputs.catalog_arch_packages }}\`; profile packages \`${{ steps.req.outputs.catalog_profile_packages }}\`"
            echo "- 插件 / plugins: \`${{ steps.req.outputs.plugins }}\`"
            echo "- 原始包 / packages: \`${{ steps.req.outputs.packages }}\`"
            echo "- 标识 / tag: \`${{ steps.req.outputs.tag }}\`"
            echo "- 构建编号 / build reference: \`${{ steps.req.outputs.build_ref }}\`"
            echo "- 网页版本 / page version: \`${{ steps.req.outputs.page_version }}\`"
            echo ""
            echo "#### 固件设置 / Firmware settings"
            echo ""
            echo "| 设置 / Setting | 已提交 / Submitted |"
            echo "| --- | --- |"
            echo "| 时区名称 / Zone | \`${{ steps.req.outputs.zonename }}\` |"
            echo "| POSIX 时区 / Timezone | \`${{ steps.req.outputs.timezone }}\` |"
            echo "| 固件主题 / Theme | \`${{ steps.req.outputs.theme }}\` |"
            echo "| NTP | \`${{ steps.req.outputs.ntp_id }}\` · \`${{ steps.req.outputs.ntp_1 }}\` · \`${{ steps.req.outputs.ntp_2 }}\` · \`${{ steps.req.outputs.ntp_3 }}\` · \`${{ steps.req.outputs.ntp_4 }}\` |"
            echo "| 软件包镜像 / Package mirror | \`${{ steps.req.outputs.package_mirror_id }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          df -hT

      - name: DIY script P1 (before feeds) / DIY 脚本 P1(feeds 前)
        run: |
          chmod +x Shell/*.sh
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/${{ steps.req.outputs.diy1 }}"

      - name: Update & install feeds / 更新并安装 feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: DIY script P2 (default settings) / DIY 脚本 P2(默认设置)
        env:
          WRT_ZONENAME: ${{ steps.req.outputs.zonename }}
          WRT_TIMEZONE: ${{ steps.req.outputs.timezone }}
          WRT_THEME: ${{ steps.req.outputs.theme }}
          WRT_NTP_1: ${{ steps.req.outputs.ntp_1 }}
          WRT_NTP_2: ${{ steps.req.outputs.ntp_2 }}
          WRT_NTP_3: ${{ steps.req.outputs.ntp_3 }}
          WRT_NTP_4: ${{ steps.req.outputs.ntp_4 }}
          WRT_NTP_ID: ${{ steps.req.outputs.ntp_id }}
          WRT_PAGE_VERSION: ${{ steps.req.outputs.page_version }}
          WRT_BUILD_REF: ${{ steps.req.outputs.build_ref }}
        run: |
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/${{ steps.req.outputs.diy2 }}"

      - name: Set custom LAN IP / 自定义后台登录地址
        if: steps.req.outputs.lanip != '192.168.1.1'
        run: |
          cd openwrt
          # diy2 已把各源默认地址统一为 192.168.1.1,这里再改成用户选的 / diy2 normalized every source to 192.168.1.1 first, now switch to the user's choice
          sed -i 's/192\.168\.1\.1/${{ steps.req.outputs.lanip }}/g' package/base-files/files/bin/config_generate
          grep -n '${{ steps.req.outputs.lanip }}' package/base-files/files/bin/config_generate | head -3

      - name: Set initial root password / 设置初始密码(uci-defaults,首次开机生效)
        if: steps.req.outputs.rootpw != ''
        env:
          RPW: ${{ steps.req.outputs.rootpw }}
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          # 字符集已在 parse-request 白名单校验,单引号包裹安全 / charset whitelisted upstream, single-quoting is safe
          if [ "$RPW" = "@empty" ]; then
            printf '#!/bin/sh\npasswd -d root\nexit 0\n' > openwrt/files/etc/uci-defaults/99-init-password
          else
            printf '#!/bin/sh\nprintf '\''%%s\\n%%s\\n'\'' '\''%s'\'' '\''%s'\'' | passwd root\nexit 0\n' "$RPW" "$RPW" > openwrt/files/etc/uci-defaults/99-init-password
          fi
          chmod +x openwrt/files/etc/uci-defaults/99-init-password
          echo "Initial password script created / 初始密码脚本已创建"

      - name: Prepare authoritative .config / 准备权威配置
        run: |
          cp submitted.config openwrt/.config
          cp submitted.config openwrt/pre-defconfig.config
          if [ "${{ steps.req.outputs.use_defconfig }}" = "1" ]; then
            cd openwrt
            echo "Defconfig enabled / 官方补全已启用: make defconfig"
            set -o pipefail
            make defconfig 2>&1 | tee "$GITHUB_WORKSPACE/defconfig.log"
            cp .config "$GITHUB_WORKSPACE/defconfig.config"
            diff -u pre-defconfig.config "$GITHUB_WORKSPACE/defconfig.config" > "$GITHUB_WORKSPACE/defconfig.diff" || true
            cd ..
          else
            cp submitted.config defconfig.config
            : > defconfig.diff
            : > defconfig.log
          fi

      - name: Apply package mirror / 应用软件包镜像（APK/OPKG）
        env:
          WRT_WORKSPACE: ${{ github.workspace }}
          WRT_PACKAGE_MIRROR_ID: ${{ steps.req.outputs.package_mirror_id }}
          WRT_SOURCE_ID: ${{ steps.req.outputs.source }}
          WRT_BRANCH: ${{ steps.req.outputs.branch }}
          WRT_ZONENAME: ${{ steps.req.outputs.zonename }}
          WRT_TIMEZONE: ${{ steps.req.outputs.timezone }}
          WRT_THEME: ${{ steps.req.outputs.theme }}
          WRT_NTP_1: ${{ steps.req.outputs.ntp_1 }}
          WRT_NTP_2: ${{ steps.req.outputs.ntp_2 }}
          WRT_NTP_3: ${{ steps.req.outputs.ntp_3 }}
          WRT_NTP_4: ${{ steps.req.outputs.ntp_4 }}
          WRT_NTP_ID: ${{ steps.req.outputs.ntp_id }}
          WRT_PAGE_VERSION: ${{ steps.req.outputs.page_version }}
          WRT_BUILD_REF: ${{ steps.req.outputs.build_ref }}
          WRT_PACKAGE_MIRROR_REPORT: ${{ github.workspace }}/package-mirror-report.json
        run: |
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/apply-package-mirror.sh"

      - name: Verify firmware settings / 核验固件设置
        if: steps.req.outputs.firmware_snapshot == '1'
        env:
          EXPECTED_ZONENAME: ${{ steps.req.outputs.zonename }}
          EXPECTED_TIMEZONE: ${{ steps.req.outputs.timezone }}
          EXPECTED_THEME: ${{ steps.req.outputs.theme }}
          EXPECTED_NTP: ${{ steps.req.outputs.ntp_id }}
          EXPECTED_PACKAGE_MIRROR: ${{ steps.req.outputs.package_mirror_id }}
        run: |
          set -euo pipefail
          INFO="openwrt/files/etc/weig-build-info"
          test -s "$INFO"
          test -s "openwrt/files/etc/uci-defaults/10-weig-system" || \
            test -s "openwrt/files/etc/uci-defaults/10-weig-timezone"
          grep -Fx "zonename=$EXPECTED_ZONENAME" "$INFO"
          grep -Fx "timezone=$EXPECTED_TIMEZONE" "$INFO"
          grep -Fx "theme=$EXPECTED_THEME" "$INFO"
          grep -Fx "ntp=$EXPECTED_NTP" "$INFO"
          grep -Fx "package_mirror_requested=$EXPECTED_PACKAGE_MIRROR" "$INFO"
          grep -Eq '^package_mirror_effective=.+$' "$INFO"
          grep -Eq '^package_managers=.+$' "$INFO"
          cp "$INFO" firmware-settings.txt

      - name: Record effective configuration / 记录实际构建配置
        env:
          REQUEST_BRANCH: ${{ steps.req.outputs.source_env }}
          REQUEST_COMMIT: ${{ steps.req.outputs.request_commit }}
        run: |
          cd openwrt
          node "$GITHUB_WORKSPACE/tools/audit-recommended.mjs" \
            --requested "$GITHUB_WORKSPACE/recommended-audit.json" \
            --config .config \
            --report "$GITHUB_WORKSPACE/recommended-report.json"
          cp .config "$GITHUB_WORKSPACE/build.config"
          grep -c '^CONFIG_PACKAGE_luci-app' .config || true
          PACKAGE_MIRROR_EFFECTIVE="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).effective || "source-default"' "$GITHUB_WORKSPACE/package-mirror-report.json")"
          PACKAGE_MANAGERS="$(node -p '(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).packageManagers || ["unknown"]).join(",")' "$GITHUB_WORKSPACE/package-mirror-report.json")"
          PACKAGE_MIRROR_FALLBACK="$(node -p 'String(Boolean(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).fallback))' "$GITHUB_WORKSPACE/package-mirror-report.json")"
          TEST_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          RECOMMENDED_REQUESTED="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).counts?.requested || 0' "$GITHUB_WORKSPACE/recommended-report.json")"
          RECOMMENDED_APPLIED="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).counts?.applied || 0' "$GITHUB_WORKSPACE/recommended-report.json")"
          RECOMMENDED_SKIPPED="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).counts?.skipped || 0' "$GITHUB_WORKSPACE/recommended-report.json")"
          GEOIP_STATE="$(grep -E '^CONFIG_PACKAGE_v2ray-geoip=[ym]$' .config || echo 'disabled')"
          GEOSITE_STATE="$(grep -E '^CONFIG_PACKAGE_v2ray-geosite=[ym]$' .config || echo 'disabled')"
          PROXY_RE='^CONFIG_PACKAGE_.*(passwall|ssr|vssr|shadowsocks|v2ray|xray|trojan|tinyproxy|brook|haproxy|pdnsd|kcptun|simple-obfs|chinadns|dns2socks|ipt2socks|microsocks|naiveproxy|redsocks|openclash|homeproxy).*=([ym])$'
          PROXY_COUNT="$(grep -Ec "$PROXY_RE" .config || true)"
          grep -E "$PROXY_RE" .config > "$GITHUB_WORKSPACE/proxy-selected.txt" || true
          if [ ! -s "$GITHUB_WORKSPACE/proxy-selected.txt" ]; then
            echo "(none / 无)" > "$GITHUB_WORKSPACE/proxy-selected.txt"
          fi
          {
            echo "test_version=$TEST_VERSION"
            echo "customizer=${GITHUB_SHA::7}"
            echo "request_branch=${REQUEST_BRANCH:-main}"
            echo "request_commit=${REQUEST_COMMIT:-unknown}"
            echo "workflow_branch=${GITHUB_REF_NAME:-unknown}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "upstream=$(git rev-parse --short HEAD)"
            echo "device=${{ steps.req.outputs.device }}"
            echo "source=${{ steps.req.outputs.source }}"
            echo "version=${{ steps.req.outputs.version }}"
            echo "variant=${{ steps.req.outputs.variant }}"
            echo "catalog_arch=${{ steps.req.outputs.catalog_arch }}"
            echo "catalog_arch_packages=${{ steps.req.outputs.catalog_arch_packages }}"
            echo "catalog_profile_packages=${{ steps.req.outputs.catalog_profile_packages }}"
            echo "request_mode=${{ steps.req.outputs.request_mode }}"
            echo "use_defconfig=${{ steps.req.outputs.use_defconfig }}"
            echo "recommended_enabled=${{ steps.req.outputs.recommended_enabled }}"
            echo "recommended_requested=$RECOMMENDED_REQUESTED"
            echo "recommended_applied=$RECOMMENDED_APPLIED"
            echo "recommended_skipped=$RECOMMENDED_SKIPPED"
            if [ "${{ steps.req.outputs.use_defconfig }}" = "1" ]; then
              echo "config_policy=upstream-defconfig"
            else
              echo "config_policy=authoritative-no-defconfig"
            fi
            echo "config_id=${{ steps.req.outputs.config_id }}"
            echo "submitted_sha256=${{ steps.req.outputs.submitted_sha256 }}"
            echo "plugins=${{ steps.req.outputs.plugins }}"
            echo "packages=${{ steps.req.outputs.packages }}"
            echo "tag=${{ steps.req.outputs.tag }}"
            echo "build_ref=${{ steps.req.outputs.build_ref }}"
            echo "page_version=${{ steps.req.outputs.page_version }}"
            echo "zonename=${{ steps.req.outputs.zonename }}"
            echo "timezone=${{ steps.req.outputs.timezone }}"
            echo "theme=${{ steps.req.outputs.theme }}"
            echo "ntp=${{ steps.req.outputs.ntp_id }}"
            echo "ntp_servers=${{ steps.req.outputs.ntp_1 }} ${{ steps.req.outputs.ntp_2 }} ${{ steps.req.outputs.ntp_3 }} ${{ steps.req.outputs.ntp_4 }}"
            echo "package_mirror_requested=${{ steps.req.outputs.package_mirror_id }}"
            echo "package_mirror_effective=$PACKAGE_MIRROR_EFFECTIVE"
            echo "package_managers=$PACKAGE_MANAGERS"
            echo "package_mirror_fallback=$PACKAGE_MIRROR_FALLBACK"
            echo "v2ray_geoip=$GEOIP_STATE"
            echo "v2ray_geosite=$GEOSITE_STATE"
            echo "proxy_selected_count=$PROXY_COUNT"
          } | tee "$GITHUB_WORKSPACE/build-metadata.txt"
          {
            echo "#### 推荐项审计 / Recommended audit"
            echo ""
            echo "- requested / 请求: `$RECOMMENDED_REQUESTED`"
            echo "- applied / 已应用: `$RECOMMENDED_APPLIED`"
            echo "- skipped / 跳过: `$RECOMMENDED_SKIPPED`"
            echo "- 详细报告 / details: `recommended-report.json` (CONFIG artifact)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "#### 软件包镜像 / Package mirror"
            echo ""
            echo "- requested / 请求: `${{ steps.req.outputs.package_mirror_id }}`"
            echo "- effective / 生效: `$PACKAGE_MIRROR_EFFECTIVE`"
            echo "- package manager / 包管理器: `$PACKAGE_MANAGERS`"
            echo "- fallback / 回退: `$PACKAGE_MIRROR_FALLBACK`"
            echo "- report / 报告: `package-mirror-report.json` (CONFIG artifact)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### 🔎 配置预检 / Config preflight"
            echo ""
            echo "- v2ray-geoip: \`$GEOIP_STATE\`"
            echo "- v2ray-geosite: \`$GEOSITE_STATE\`"
            echo "- 代理相关已选符号 / selected proxy-related symbols: \`$PROXY_COUNT\`"
            echo ""
            echo '```text'
            cat "$GITHUB_WORKSPACE/proxy-selected.txt"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final .config / 上传最终 .config(编译失败也能拿到)
        if: always() && steps.req.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-CONFIG
          path: |
            openwrt/.config
            submitted.config
            pre-defconfig.config
            defconfig.config
            defconfig.diff
            defconfig.log
            build.config
            build-metadata.txt
            recommended-audit.json
            recommended-report.json
            package-mirror-report.json
            firmware-settings.txt
            proxy-selected.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Download packages / 下载依赖包
        run: |
          cd openwrt
          JOBS=$(( $(nproc) + 1 ))
          echo "下载并发 / download jobs: $JOBS"
          set +e
          set -o pipefail
          stdbuf -oL -eL make download -j"$JOBS" 2>&1 |
            tee "$GITHUB_WORKSPACE/download.log"
          DOWNLOAD_RC=${PIPESTATUS[0]}
          set -e
          echo "下载退出码 / download exit code: $DOWNLOAD_RC"
          {
            echo "### 📥 下载阶段 / Download stage"
            echo ""
            echo "- jobs: \`$JOBS\`"
            echo "- exit code: \`$DOWNLOAD_RC\`"
            echo "- Actions 实时显示原始输出,并保存到 \`download.log\`。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DOWNLOAD_RC" -ne 0 ]; then
            echo "::warning::依赖下载存在失败;将继续编译。完整信息已写入 download.log。"
          fi

      - name: Compile / 编译(原始实时日志)
        id: compile
        continue-on-error: true
        run: |
          cd openwrt
          JOBS=$(( $(nproc) + 1 ))
          echo "编译并发 / compile jobs: $JOBS"
          set +e
          set -o pipefail
          stdbuf -oL -eL make -j"$JOBS" BUILD_LOG=1 2>&1 |
            tee "$GITHUB_WORKSPACE/build.log"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "### 🛠️ 编译 / Compile"
            echo ""
            echo "- jobs: \`$JOBS\`"
            echo "- command: \`make -j$JOBS BUILD_LOG=1\`"
            echo "- exit code: \`$RC\`"
            echo "- Actions 实时显示原始输出,并保存到 \`build.log\`。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            echo "::error::并行编译失败;先冻结原始现场，再进入单线程诊断。"
          fi
          exit "$RC"

      - name: Snapshot parallel failure / 冻结并行失败现场
        if: steps.compile.outcome == 'failure'
        run: |
          "$GITHUB_WORKSPACE/Shell/collect-build-evidence.sh" snapshot parallel \
            "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/failure-logs"
          rm -rf "$GITHUB_WORKSPACE/openwrt/logs"

      - name: Diagnose failed compile / 单线程定位失败原因
        id: diagnose
        if: steps.compile.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 185
        run: |
          cd openwrt
          echo "单线程重试 / single-thread retry: make -j1 V=s BUILD_LOG=1 (180 minute limit)"
          set +e
          set -o pipefail
          timeout 180m stdbuf -oL -eL make -j1 V=s BUILD_LOG=1 2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostic.log"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "### 🔎 单线程重试 / Single-thread retry"
            echo ""
            echo "- command: \`make -j1 V=s BUILD_LOG=1\`"
            echo "- limit: \`180 minutes\`"
            echo "- exit code: \`$RC\`"
            echo "- log: \`build-diagnostic.log\`"
            echo "- result: exit 0 resumes the build; 124 means timeout; other non-zero exits remain failed."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -eq 124 ]; then
            echo "::warning::单线程重试超过 180 分钟，已停止；请查看 diagnostic/。"
          elif [ "$RC" -ne 0 ]; then
            echo "::error::单线程重试仍失败；请查看 diagnostic/。"
          fi
          exit "$RC"

      - name: Snapshot diagnostic retry / 冻结单线程诊断现场
        if: always() && steps.compile.outcome == 'failure' && steps.diagnose.outcome != 'skipped'
        run: |
          "$GITHUB_WORKSPACE/Shell/collect-build-evidence.sh" snapshot diagnostic \
            "$GITHUB_WORKSPACE/build-diagnostic.log" "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/failure-logs"

      - name: Finalize compile result / 确认编译结果
        if: always()
        run: |
          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            echo "Parallel compile succeeded / 并行编译成功"
            exit 0
          fi
          if [ "${{ steps.compile.outcome }}" = "skipped" ] || [ -z "${{ steps.compile.outcome }}" ]; then
            echo "Compile was not started because an earlier step failed / 前置步骤失败，编译未开始"
            exit 0
          fi
          if [ "${{ steps.diagnose.outcome }}" = "success" ]; then
            echo "::warning::并行编译失败，但单线程重试成功；构建继续。"
            {
              echo "### ✅ 单线程恢复 / Recovered by single-thread retry"
              echo ""
              echo "- parallel build: failed"
              echo "- make -j1 V=s BUILD_LOG=1: succeeded"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::并行与单线程编译均失败；请下载 BUILD-LOGS。"
          exit 1

      - name: Collect failure logs / 收集失败日志
        if: failure() || steps.compile.outcome == 'failure'
        run: |
          mkdir -p failure-logs
          cp download.log failure-logs/ 2>/dev/null || true
          cp build-metadata.txt failure-logs/ 2>/dev/null || true
          cp proxy-selected.txt failure-logs/ 2>/dev/null || true
          cp submitted.config recommended-audit.json recommended-report.json package-mirror-report.json pre-defconfig.config defconfig.config defconfig.diff defconfig.log build.config failure-logs/ 2>/dev/null || true
          cp openwrt/.config failure-logs/final.config 2>/dev/null || true

          PARALLEL_OUTCOME="${{ steps.compile.outcome }}"
          PARALLEL_EXIT="${{ steps.compile.outputs.exit_code }}"
          DIAGNOSTIC_OUTCOME="${{ steps.diagnose.outcome }}"
          DIAGNOSTIC_EXIT="${{ steps.diagnose.outputs.exit_code }}"
          PARALLEL_RESULT="NOT STARTED"
          DIAGNOSTIC_RESULT="NOT RUN"
          FINAL_RESULT="BUILD FAILED"
          if [ "$PARALLEL_OUTCOME" = "success" ]; then
            PARALLEL_RESULT="SUCCEEDED"
            FINAL_RESULT="FAILED AFTER COMPILE"
          elif [ "$PARALLEL_OUTCOME" = "failure" ]; then
            PARALLEL_RESULT="FAILED"
            if [ "$DIAGNOSTIC_EXIT" = "0" ]; then
              DIAGNOSTIC_RESULT="SUCCEEDED"
              FINAL_RESULT="RECOVERED"
            elif [ "$DIAGNOSTIC_EXIT" = "124" ]; then
              DIAGNOSTIC_RESULT="TIMEOUT"
            elif [ -n "$DIAGNOSTIC_EXIT" ]; then
              DIAGNOSTIC_RESULT="FAILED"
            elif [ "$DIAGNOSTIC_OUTCOME" = "failure" ]; then
              DIAGNOSTIC_RESULT="FAILED"
            elif [ "$DIAGNOSTIC_OUTCOME" = "cancelled" ]; then
              DIAGNOSTIC_RESULT="CANCELLED"
            fi
          fi

          ROOTFS_PARTSIZE="$(sed -n 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=//p' failure-logs/final.config 2>/dev/null | tail -n 1 | tr -d '\r')"
          ROOTFS_TOO_SMALL=false
          if grep -Eqi 'ext4_allocate[^:]*:.*out of space|failed to allocate [0-9]+ blocks, out of space' \
            failure-logs/parallel/build.log failure-logs/diagnostic/build.log 2>/dev/null; then
            ROOTFS_TOO_SMALL=true
          fi

          {
            echo "===================== 构建诊断 / BUILD DIAGNOSTICS ====================="
            echo "测试版本/test version: $(tr -d '\r\n' < VERSION)"
            echo "机型/device : ${{ steps.req.outputs.device }}"
            echo "源码/source : ${{ steps.req.outputs.source }} @ ${{ steps.req.outputs.branch }}"
            echo "版本/version: ${{ steps.req.outputs.version }}   变体/variant: ${{ steps.req.outputs.variant }}"
            echo "请求分支/request branch: ${{ steps.req.outputs.source_env || 'main' }}"
            echo "请求提交/request commit: ${{ steps.req.outputs.request_commit || 'unknown' }}"
            echo "Workflow 分支/workflow branch: ${GITHUB_REF_NAME:-unknown}"
            echo "Workflow 提交/workflow commit: ${GITHUB_SHA}"
            echo "网页版本/page version: ${{ steps.req.outputs.page_version }}"
            echo "插件/plugins: ${{ steps.req.outputs.plugins }}"
            echo "标识/tag    : ${{ steps.req.outputs.tag }}   run: ${{ github.run_id }}"
            echo "本次构建 / this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "-------- 阶段结果 / STAGE RESULTS --------"
            echo "Parallel compile"
            echo "  result : $PARALLEL_RESULT"
            echo "  exit   : ${PARALLEL_EXIT:-n/a}"
            echo "  logs   : $([ -d failure-logs/parallel ] && echo 'parallel/' || echo 'n/a')"
            echo "Diagnostic retry"
            echo "  command: make -j1 V=s BUILD_LOG=1"
            echo "  limit  : 180 minutes"
            echo "  result : $DIAGNOSTIC_RESULT"
            echo "  exit   : ${DIAGNOSTIC_EXIT:-n/a}"
            echo "  logs   : $([ -d failure-logs/diagnostic ] && echo 'diagnostic/' || echo 'n/a')"
            echo "Final result"
            echo "  $FINAL_RESULT"
            if [ "$ROOTFS_TOO_SMALL" = "true" ]; then
              echo ""
              echo "-------- RootFS 容量 / ROOTFS CAPACITY --------"
              echo "RootFS image is too small."
              echo "项目：Root filesystem partition size (in MiB)"
              if [ -n "$ROOTFS_PARTSIZE" ]; then
                echo "当前值：$ROOTFS_PARTSIZE MiB"
              else
                echo "当前值：unknown"
              fi
              echo "路径：Target Images → TARGET_ROOTFS_PARTSIZE"
              echo "Please increase TARGET_ROOTFS_PARTSIZE and rebuild."
            fi
            echo ""
            echo "-------- 已收集日志 / COLLECTED LOGS --------"
            for stage in parallel diagnostic; do
              if [ -d "failure-logs/$stage" ]; then
                echo "[$stage/]"
                for name in build.log errors.txt last-targets.txt tail.txt package-logs.tar.gz evidence.txt; do
                  [ -f "failure-logs/$stage/$name" ] && echo "- $stage/$name"
                done
              fi
            done
            echo ""
            echo "-------- 定位关键字 / SEARCH KEYWORDS --------"
            for stage in parallel diagnostic; do
              [ -s "failure-logs/$stage/errors.txt" ] || continue
              echo "[$stage/errors.txt]"
              tail -n 40 "failure-logs/$stage/errors.txt"
            done
            echo ""
            echo "-------- 最后出错的目标 / LAST FAILING TARGETS --------"
            for stage in parallel diagnostic; do
              [ -s "failure-logs/$stage/last-targets.txt" ] || continue
              echo "[$stage/last-targets.txt]"
              tail -n 20 "failure-logs/$stage/last-targets.txt"
            done
            echo ""
            echo "完整日志见 parallel/ 与 diagnostic/；两阶段证据互不覆盖。"
          } > failure-logs/00-SUMMARY.txt
          cat failure-logs/00-SUMMARY.txt >> "$GITHUB_STEP_SUMMARY" || true

          {
            echo ''
            echo '## 📥 完整日志取件 / How to get full logs'
            echo ''
            echo '| 步骤 / Step | 操作 / Action |'
            echo '| --- | --- |'
            echo '| 1 | 打开本次构建页面 / Open this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |'
            echo '| 2 | 拉到页面最底部 **Artifacts** 区 / Scroll to the **Artifacts** section at the very bottom |'
            echo '| 3 | 下载 `${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS` 并解压 / Download and unzip `${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS` |'
            echo '| 4 | 先看 `00-SUMMARY.txt`；并行现场看 `parallel/`，单线程诊断看 `diagnostic/` / Read `00-SUMMARY.txt` first; use `parallel/` for the original parallel failure and `diagnostic/` for the single-thread retry |'
            echo '| 5 | 每阶段依次看 `errors.txt` → `last-targets.txt` → `tail.txt` → `build.log` → `package-logs.tar.gz`（如有） / Per stage, read `errors.txt` → `last-targets.txt` → `tail.txt` → `build.log` → `package-logs.tar.gz` (if present) |'
            echo ''
            echo '> ⏳ 完整日志 Artifact 保留 14 天,过期需重新提交构建 / Complete log artifacts are kept for 14 days.'
          } >> "$GITHUB_STEP_SUMMARY" || true
          ls -lh failure-logs
          echo "📤 artifact:${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS —— parallel/ 保存原始并行现场，diagnostic/ 保存单线程诊断现场。"

      - name: Collect menuconfig M packages / 收集 menuconfig 的 M 软件包
        if: success()
        run: node tools/collect-optional-packages.mjs --config openwrt/.config --bin openwrt/bin --out optional-packages

      - name: Check disk usage / 检查空间
        if: (!cancelled())
        run: df -hT

      - name: Classify artifacts and write download guide / 分类产物并生成下载说明
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact-staging"
          FIRMWARE="$ROOT/FIRMWARE-OTHER"
          RAW="$ROOT/RAW-IMG-GZ"
          LOGS="$ROOT/BUILD-LOGS"
          mkdir -p "$FIRMWARE" "$RAW" "$LOGS"

          shopt -s nullglob
          for file in openwrt/bin/targets/*/*/*; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            if [[ "$base" == *.img.gz ]]; then
              cp -a "$file" "$RAW/${{ steps.req.outputs.artifact_ref }}-$base"
            else
              cp -a "$file" "$FIRMWARE/${{ steps.req.outputs.artifact_ref }}-$base"
            fi
          done
          if compgen -G "$RAW/*.img.gz" >/dev/null; then
            (cd "$RAW" && sha256sum -- *.img.gz) > "$FIRMWARE/${{ steps.req.outputs.artifact_ref }}-sha256sums-img-gz.txt"
          fi
          if [ -s firmware-settings.txt ]; then
            cp firmware-settings.txt "$FIRMWARE/${{ steps.req.outputs.artifact_ref }}-00-BUILD-SETTINGS.txt"
          fi
          printf '%s\n' \
            '其他固件与构建资料 / OTHER FIRMWARE AND BUILD FILES' \
            '首次刷机通常使用 factory；sysupgrade 仅用于当前固件与闪存布局兼容的升级。' \
            'First flash usually uses factory. Use sysupgrade only for a compatible installed firmware and flash layout.' \
            'initramfs 用于临时启动/救援；manifest、buildinfo、sha256sums 仅用于核对。' \
            'Always verify the exact model and partition layout before flashing.' > "$FIRMWARE/00-请先读我-README.txt"

          cp download.log build-metadata.txt firmware-settings.txt proxy-selected.txt "$LOGS/" 2>/dev/null || true
          if [ -d failure-logs ]; then
            cp -a failure-logs/. "$LOGS/"
          else
            cp build.log "$LOGS/" 2>/dev/null || true
          fi
          printf '%s\n' \
            '完整构建日志 / BUILD LOGS' \
            '若存在 00-SUMMARY.txt，先看它；parallel/ 是原始并行失败现场，diagnostic/ 是单线程诊断现场。' \
            '成功且未进入诊断时仅保留常规 build.log / download.log。' \
            '日志 Artifact 保留 14 天。' > "$LOGS/00-请先读我-README.txt"

          {
            echo ''
            echo '## 📦 固件下载与安装选择 / Firmware download guide'
            echo ''
            echo '> [!IMPORTANT]'
            echo '> 最终 `.img.gz` 固件按 `${{ steps.req.outputs.artifact_ref }}-原文件名.img.gz` 逐个上传，不解压、不套 ZIP；首次刷机通常用 `factory`。'
            echo '> Final `.img.gz` images are uploaded one by one as `${{ steps.req.outputs.artifact_ref }}-original-name.img.gz`, without decompression or a ZIP wrapper. First flash usually uses `factory`.'
            echo ''
            echo '| Artifact | 内容 / Contents |'
            echo '| --- | --- |'
            echo '| 📦 `${{ steps.req.outputs.artifact_ref }}-*.img.gz` | 可直接下载的最终固件；一个文件对应一个 Artifact |'
            echo '| 📁 `${{ steps.req.outputs.artifact_ref }}-FIRMWARE-OTHER` | manifest、buildinfo、校验和及其他非 `.img.gz` 文件 |'
            echo '| ⚙️ `${{ steps.req.outputs.artifact_ref }}-CONFIG` | 用户提交配置、实际开编配置和构建元数据 |'
            echo '| 🧾 `${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS` | 完整下载/编译日志；保留 14 天 |'
            echo '| 🧩 `${{ steps.req.outputs.artifact_ref }}-OPTIONAL-PACKAGES` | menuconfig 选为 M：已编译但未写入固件的软件包 |'
            echo ''
            echo '> [!WARNING]'
            echo '> `sysupgrade` 不是通用更新包。不确定机型、当前固件或布局时不要刷。 / `sysupgrade` is not a universal updater.'
            echo ''
            echo '- 固件、配置、构建信息保留 **30 天**；完整日志保留 **14 天**。'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build raw firmware manifest / 生成原始固件清单
        id: firmware_manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          json="$(find artifact-staging/RAW-IMG-GZ -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | jq -Rsc 'split("\n") | map(select(length > 0)) | if length == 0 then [{name:"__none__", enabled:false}] else map({name:., enabled:true}) end')"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          if find artifact-staging/RAW-IMG-GZ -maxdepth 1 -type f -name '*.img.gz' -print -quit 2>/dev/null | grep -q .; then
            echo "has_raw=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_raw=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload raw firmware bridge / 上传原始固件桥接包
        id: raw_bridge
        if: success() && steps.firmware_manifest.outputs.has_raw == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-RAW-BRIDGE
          path: artifact-staging/RAW-IMG-GZ/
          if-no-files-found: error
          retention-days: 1

      - name: Upload other firmware / 上传其他固件文件
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-FIRMWARE-OTHER
          path: artifact-staging/FIRMWARE-OTHER/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload complete logs / 上传完整日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS
          path: artifact-staging/BUILD-LOGS/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload optional M packages / 上传可选 M 软件包
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-OPTIONAL-PACKAGES
          path: optional-packages/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

  publish-firmware:
    name: Publish raw firmware / 发布原始固件
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.build.outputs.firmware_matrix || '[{"name":"__none__","enabled":false}]') }}
    steps:
      - name: Download raw bridge / 下载原始固件桥接包
        if: matrix.file.enabled == true
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_ref }}-RAW-BRIDGE
          path: raw-bridge

      - name: Upload one raw .img.gz / 逐个上传原始 .img.gz
        if: matrix.file.enabled == true
        uses: actions/upload-artifact@v7
        with:
          path: raw-bridge/${{ matrix.file.name }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  cleanup-raw-bridge:
    name: Cleanup raw bridge / 清理原始桥接包
    needs: [build, publish-firmware]
    if: always() && needs.build.outputs.bridge_artifact_id != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Delete this run's bridge artifact / 删除本次桥接 Artifact
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          BRIDGE_ARTIFACT_ID: ${{ needs.build.outputs.bridge_artifact_id }}
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number(process.env.BRIDGE_ARTIFACT_ID),
            });

  notify:
    name: Final result / 最终结果
    needs: [admission, build, publish-firmware, cleanup-raw-bridge]
    if: always() && needs.build.outputs.build_ref != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Comment final result / 回评最终结果
        uses: actions/github-script@v8
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish-firmware.result }}
          ARTIFACT_REF: ${{ needs.build.outputs.artifact_ref }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          REQUESTER: ${{ github.event_name == 'workflow_dispatch' && inputs.requester || github.event.issue.user.login }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success' && process.env.PUBLISH_RESULT === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ref = process.env.ARTIFACT_REF;
            const body = ok
              ? `@${process.env.REQUESTER}\n\n✅ 构建和固件发布全部完成。\n\n下载 / Download: ${url}\n\n- 每个 \`${ref}-*.img.gz\` 是可直接下载的独立 Artifact，不解压、不套 ZIP。\n- \`${ref}-CONFIG\`、\`${ref}-BUILD-LOGS\`、\`${ref}-OPTIONAL-PACKAGES\`、\`${ref}-FIRMWARE-OTHER\` 为分类资料（没有对应内容时可能不生成）。\n\n首次刷机通常选 \`factory\`；\`sysupgrade\` 只用于当前固件与闪存布局兼容的升级。`
              : `@${process.env.REQUESTER}\n\n❌ 构建或原始固件发布失败。\n\nBuild: ${process.env.BUILD_RESULT}; raw publish: ${process.env.PUBLISH_RESULT}\n\n请打开本次 Actions 查看 \`${ref}-CONFIG\` 与 \`${ref}-BUILD-LOGS\`：${url}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed',
              state_reason: ok ? 'completed' : 'not_planned',
            });
