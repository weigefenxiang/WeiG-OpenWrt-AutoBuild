name: Custom Build / 定制构建
run-name: "${{ inputs.run_title || format('Build {0}#{1} · {2}', inputs.requester, inputs.issue_number, inputs.issue_title) }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Original build Issue number
        required: true
        type: string
      issue_title:
        description: Original build Issue title snapshot
        required: true
        type: string
      issue_body:
        description: Original build Issue body snapshot
        required: true
        type: string
      requester:
        description: Original build Issue author
        required: true
        type: string
      issue_created_at:
        description: Original build Issue creation time
        required: true
        type: string
      run_title:
        description: Optional prevalidated Actions run title; legacy Dispatchers may omit it
        required: false
        type: string
      request_branch:
        description: Exact AutoBuild branch requested by the page
        required: true
        type: string
      request_commit:
        description: Exact AutoBuild commit requested by the page
        required: true
        type: string

env:
  TZ: Asia/Shanghai

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  identity:
    name: Exact identity / 精确身份
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      valid: ${{ steps.guard.outputs.valid }}
    steps:
      - name: Verify dispatch ref and original Issue / 核对派发版本与原始 Issue
        id: guard
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          REQUESTER: ${{ inputs.requester }}
          ISSUE_CREATED_AT: ${{ inputs.issue_created_at }}
          ISSUE_BODY: ${{ inputs.issue_body }}
          REQUEST_BRANCH: ${{ inputs.request_branch }}
          REQUEST_COMMIT: ${{ inputs.request_commit }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const requester = process.env.REQUESTER;
            const requestBranch = process.env.REQUEST_BRANCH;
            const requestCommit = process.env.REQUEST_COMMIT.toLowerCase();
            const workflowBranch = process.env.WORKFLOW_BRANCH;
            const workflowCommit = process.env.WORKFLOW_COMMIT.toLowerCase();
            core.setOutput('valid', 'false');

            const reject = async (message) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `@${requester}\n\n❌ ${message}\n\nBuild blocked.\n\n中文说明：构建已阻止。`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'not_planned',
              });
              core.setFailed(message);
            };

            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0 || !/^[A-Za-z0-9-]{1,39}$/.test(requester)) {
              await reject('Invalid dispatch identity fields. / 派发身份字段非法。');
              return;
            }
            if (workflowBranch !== requestBranch || workflowCommit !== requestCommit) {
              await reject(`Worker ref does not match the exact request: request=${requestBranch}@${requestCommit.slice(0, 12)}, workflow=${workflowBranch}@${workflowCommit.slice(0, 12)}. / Worker 身份不匹配。`);
              return;
            }
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            if (issue.state !== 'open') {
              core.notice(`Issue #${issueNumber} is closed; worker will not start.`);
              return;
            }
            if (issue.user.login.toLowerCase() !== requester.toLowerCase() ||
                issue.created_at !== process.env.ISSUE_CREATED_AT || issue.title !== process.env.ISSUE_TITLE ||
                String(issue.body || '') !== String(process.env.ISSUE_BODY || '')) {
              await reject('Original Issue no longer matches the dispatch snapshot. / 原始 Issue 快照已变化。');
              return;
            }
            core.setOutput('valid', 'true');

  admission:
    name: Admission / 构建准入
    needs: identity
    if: always() && needs.identity.outputs.valid == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.limit.outputs.allowed }}
      requester: ${{ steps.limit.outputs.requester }}
    steps:
      - name: Checkout exact admission policy / 检出精确准入策略
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.request_commit }}
      - name: Limit active builds per user / 限制每用户活跃构建数
        id: limit
        uses: actions/github-script@v8
        env:
          REQUESTER: ${{ inputs.requester }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_CREATED_AT: ${{ inputs.issue_created_at }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { decideBuildAdmission } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/tools/build-admission.mjs`).href);
            const requester = process.env.REQUESTER;
            const isRepositoryOwner = requester.toLowerCase() === context.repo.owner.toLowerCase();
            if (isRepositoryOwner) {
              const decision = decideBuildAdmission({
                isRepositoryOwner: true,
                currentRunId: context.runId,
                currentCreatedAt: process.env.ISSUE_CREATED_AT,
              });
              core.setOutput('allowed', String(decision.allowed));
              core.setOutput('requester', requester.toLowerCase());
              core.notice(`Build admission granted: ${requester} (repository owner; no project limit).`);
              return;
            }
            const list = async (status) => (await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'custom-build.yml', status, per_page: 100,
            })).data.workflow_runs;
            const authorCache = new Map();
            const issueNumberFromTitle = (title) => {
              const value = String(title || '');
              return Number(value.match(/#[0-9]+\//)?.[0].slice(1, -1) ||
                value.match(/^(?:Build )?[^#]+#([0-9]+)/i)?.[1] || 0);
            };
            const active = [];
            for (const run of [...await list('queued'), ...await list('in_progress')]) {
              if (String(run.id) === String(context.runId) || run.event !== 'workflow_dispatch') continue;
              const issueNumber = issueNumberFromTitle(run.display_title);
              if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) continue;
              let identity = authorCache.get(issueNumber);
              if (!identity) {
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                  });
                  identity = {
                    author: String(issue.user?.login || '').toLowerCase(),
                    createdAt: String(issue.created_at || run.created_at),
                  };
                  authorCache.set(issueNumber, identity);
                } catch (error) {
                  core.warning(`Cannot resolve build Issue #${issueNumber}: ${error.message}`);
                  continue;
                }
              }
              if (identity.author === requester.toLowerCase()) {
                active.push({ id: run.id, created_at: identity.createdAt });
              }
            }
            const decision = decideBuildAdmission({
              isRepositoryOwner: false,
              currentRunId: context.runId,
              currentCreatedAt: process.env.ISSUE_CREATED_AT,
              activeRuns: active,
            });
            core.setOutput('allowed', String(decision.allowed));
            core.setOutput('requester', requester.toLowerCase());
            if (decision.allowed) {
              core.notice(`Build admission granted: ${requester} ${decision.rank + 1}/${decision.limit}.`);
              return;
            }
            core.notice(`Build admission refused: ${requester} already has ${decision.limit} active builds.`);
            {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                body: `@${requester}\n\nBuild not started / 构建未开始\n\nYou already have ${decision.limit} queued or running builds. Wait for one to finish, or reply with exactly \`/cancel\` in your own build Issue before submitting again. / 你已有 ${decision.limit} 个排队中或运行中的构建。请等待其中一个完成，或在自己的构建 Issue 准确回复 \`/cancel\` 后再提交。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER), state: 'closed', state_reason: 'not_planned',
              });
            }

  build:
    name: Build / 构建
    needs: admission
    if: needs.admission.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    outputs:
      standalone_matrix: ${{ steps.artifact_manifest.outputs.matrix }}
      bridge_artifact_id: ${{ steps.standalone_bridge.outputs.artifact-id }}
      build_ref: ${{ steps.req.outputs.build_ref }}
      artifact_ref: ${{ steps.req.outputs.artifact_ref }}

    steps:
      - name: Checkout exact request commit / 检出精确请求提交
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.request_commit }}

      - name: Verify checked-out commit / 核对检出提交
        env:
          REQUEST_COMMIT: ${{ inputs.request_commit }}
        run: |
          checkout_head="$(git rev-parse HEAD)"
          echo "Request commit: $REQUEST_COMMIT"
          echo "Checkout HEAD: $checkout_head"
          test "$checkout_head" = "$REQUEST_COMMIT"
          echo "Exact checkout verified."

      - name: Read Issue attachment or mobile request / 读取附件或手机请求
        env:
          ISSUE_BODY: ${{ inputs.issue_body }}
          REQUEST_MANIFEST_OUT: request-attachments.json
          REQUEST_DIR: request-attachments
        run: node tools/fetch-build-request.mjs

      - name: Parse & validate request / 解析校验请求(白名单)
        id: req
        env:
          REQUEST_MANIFEST: request-attachments.json
          PROFILE_BASELINE_CONFIG_OUT: profile-baseline.config
          RECONSTRUCTED_CONFIG_OUT: reconstructed.config
          REQUEST_OVERRIDES_OUT: request-overrides.json
          REQUEST_AUDIT_OUT: request-audit.json
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_REQUEST_BRANCH: ${{ inputs.request_branch }}
          EXPECTED_REQUEST_COMMIT: ${{ inputs.request_commit }}
        run: node tools/parse-request.mjs

      - name: "Comment on issue: build started / 回评 issue:构建开始"
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUESTER: ${{ inputs.requester }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `@${process.env.REQUESTER}\n\nBuild started / 构建已开始: ${{ steps.req.outputs.summary }}\n\nProgress and artifacts / 进度与产物: ${url}\n\nTo cancel, reply with exactly \`/cancel\` in this Issue. The requester or a collaborator with write access may cancel. / 如需取消，请在本 Issue 准确回复 \`/cancel\`。请求提交者或具有写权限的协作者可以取消。\n\nArtifacts appear at the bottom of the Run after completion (GitHub login required). A complete build usually takes 2–3 hours; failure logs are uploaded for diagnosis. / 完成后产物位于 Run 页面底部（需登录 GitHub）；整机编译通常需要 2–3 小时，失败时也会上传诊断日志。`,
            });

      - name: Comment & close issue on invalid request / 校验失败时回评并关闭 issue
        if: failure()
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUESTER: ${{ inputs.requester }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `@${process.env.REQUESTER}\n\n❌ Request validation failed; the build was not started.\n\nLog: ${url}\n\nCheck the attachment format and target fields, then submit again.\n\n中文说明：请求校验未通过，构建未开始。请核对附件格式与机型字段后重新提交。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER), state: 'closed', state_reason: 'not_planned',
            });

      - name: Free disk space / 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "- Defconfig / 官方补全: ${{ steps.req.outputs.use_defconfig == '1' && 'enabled' || 'disabled' }}"
          df -hT

      - name: Install build dependencies / 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget qemu-utils
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          echo "Runner process timezone / Runner 进程时区: $TZ"

      - name: Clone source code / 拉取源码
        env:
          REQUEST_BRANCH: ${{ steps.req.outputs.source_env }}
          REQUEST_COMMIT: ${{ steps.req.outputs.request_commit }}
        run: |
          if [ -n "${{ steps.req.outputs.source_commit }}" ]; then
            git init openwrt
            git -C openwrt remote add origin "https://github.com/${{ steps.req.outputs.repo }}"
            git -C openwrt fetch --depth 1 origin "${{ steps.req.outputs.source_commit }}"
            git -C openwrt checkout --detach FETCH_HEAD
            test "$(git -C openwrt rev-parse HEAD)" = "${{ steps.req.outputs.source_commit }}"
          else
            git clone "https://github.com/${{ steps.req.outputs.repo }}" -b "${{ steps.req.outputs.branch }}" --depth 1 openwrt
          fi
          cd openwrt && git log -1 --pretty='源码提交: %h %an %ad %s'
          # 版本信息写进日志与 Summary,排障时能对照"哪个定制器版本 × 哪个上游快照" / Emit version info to the log and run summary so failures map to exact customizer × upstream snapshots
          TEST_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          echo "测试版本 / test version: $TEST_VERSION"
          echo "定制器版本 / customizer commit: ${GITHUB_SHA::7}"
          {
            echo "### 🧾 构建信息 / Build info"
            echo ""
            echo "- 测试版本 / test version: \`$TEST_VERSION\`"
            echo "- 定制器 / customizer: \`${GITHUB_SHA::7}\`"
            echo "- 请求分支 / request branch: \`${REQUEST_BRANCH:-main}\`"
            echo "- 请求提交 / request commit: \`${REQUEST_COMMIT:-unknown}\`"
            echo "- Workflow 分支 / workflow branch: \`${GITHUB_REF_NAME:-unknown}\`"
            echo "- Workflow 提交 / workflow commit: \`${GITHUB_SHA}\`"
            echo "- 上游源码 / upstream: \`$(git log -1 --format='%h %ad' --date=short)\` (${{ steps.req.outputs.repo }} @ ${{ steps.req.outputs.branch }})"
            echo "- Catalog: \`${{ steps.req.outputs.catalog_revision }}\` · \`${{ steps.req.outputs.catalog_asset }}\`"
            echo "- 参数 / inputs: \`${{ steps.req.outputs.device }} · ${{ steps.req.outputs.source }} · ${{ steps.req.outputs.version }} · ${{ steps.req.outputs.variant }}\`"
            echo "- 插件 / plugins: \`${{ steps.req.outputs.plugins }}\`"
            echo "- 标识 / tag: \`${{ steps.req.outputs.tag }}\`"
            echo "- 构建编号 / build reference: \`${{ steps.req.outputs.build_ref }}\`"
            echo "- 网页版本 / page version: \`${{ steps.req.outputs.page_version }}\`"
            echo ""
            echo "#### 固件设置 / Firmware settings"
            echo ""
            echo "| 设置 / Setting | 已提交 / Submitted |"
            echo "| --- | --- |"
            echo "| 时区名称 / Zone | \`${{ steps.req.outputs.zonename }}\` |"
            echo "| POSIX 时区 / Timezone | \`${{ steps.req.outputs.timezone }}\` |"
            echo "| 固件主题 / Theme | \`${{ steps.req.outputs.theme }}\` |"
            echo "| NTP | \`${{ steps.req.outputs.ntp_id }}\` · \`${{ steps.req.outputs.ntp_1 }}\` · \`${{ steps.req.outputs.ntp_2 }}\` · \`${{ steps.req.outputs.ntp_3 }}\` · \`${{ steps.req.outputs.ntp_4 }}\` |"
            echo "| 软件包镜像 / Package mirror | \`${{ steps.req.outputs.package_mirror_id }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          df -hT

      - name: DIY script P1 (before feeds) / DIY 脚本 P1(feeds 前)
        run: |
          chmod +x Shell/*.sh
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/${{ steps.req.outputs.diy1 }}"

      - name: Update & install feeds / 更新并安装 feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: DIY script P2 (default settings) / DIY 脚本 P2(默认设置)
        env:
          WRT_ZONENAME: ${{ steps.req.outputs.zonename }}
          WRT_TIMEZONE: ${{ steps.req.outputs.timezone }}
          WRT_THEME: ${{ steps.req.outputs.theme }}
          WRT_NTP_1: ${{ steps.req.outputs.ntp_1 }}
          WRT_NTP_2: ${{ steps.req.outputs.ntp_2 }}
          WRT_NTP_3: ${{ steps.req.outputs.ntp_3 }}
          WRT_NTP_4: ${{ steps.req.outputs.ntp_4 }}
          WRT_NTP_ID: ${{ steps.req.outputs.ntp_id }}
          WRT_PAGE_VERSION: ${{ steps.req.outputs.page_version }}
          WRT_BUILD_REF: ${{ steps.req.outputs.build_ref }}
        run: |
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/${{ steps.req.outputs.diy2 }}"

      - name: Set custom LAN IP / 自定义后台登录地址
        if: steps.req.outputs.lanip != '192.168.1.1'
        run: |
          cd openwrt
          # diy2 已把各源默认地址统一为 192.168.1.1,这里再改成用户选的 / diy2 normalized every source to 192.168.1.1 first, now switch to the user's choice
          sed -i 's/192\.168\.1\.1/${{ steps.req.outputs.lanip }}/g' package/base-files/files/bin/config_generate
          grep -n '${{ steps.req.outputs.lanip }}' package/base-files/files/bin/config_generate | head -3

      - name: Set initial root password / 设置初始密码(uci-defaults,首次开机生效)
        if: steps.req.outputs.rootpw != '' || steps.req.outputs.password_mode == 'empty' || steps.req.outputs.password_mode == 'secret'
        env:
          REQUEST_ROOT_PASSWORD: ${{ steps.req.outputs.rootpw }}
          PASSWORD_MODE: ${{ steps.req.outputs.password_mode }}
          DEFAULT_ROOT_PASSWORD: ${{ secrets.DEFAULT_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          RPW="$REQUEST_ROOT_PASSWORD"
          if [ -z "$RPW" ]; then
            case "$PASSWORD_MODE" in
              empty)
                RPW='@empty'
                ;;
              secret)
                if [ -z "$DEFAULT_ROOT_PASSWORD" ]; then
                  echo "::error::DEFAULT_ROOT_PASSWORD is required by the project password policy."
                  exit 1
                fi
                RPW="$DEFAULT_ROOT_PASSWORD"
                ;;
              *)
                echo "::error::Invalid project password mode."
                exit 1
                ;;
            esac
          fi
          if [ "$RPW" != '@empty' ]; then
            echo "::add-mask::$RPW"
          fi
          mkdir -p openwrt/files/etc/uci-defaults
          if [ "$RPW" = "@empty" ]; then
            printf '#!/bin/sh\npasswd -d root\nexit 0\n' > openwrt/files/etc/uci-defaults/99-init-password
          else
            ROOT_HASH="$(printf '%s' "$RPW" | openssl passwd -6 -stdin)"
            case "$ROOT_HASH" in
              '$6$'*) ;;
              *) echo "::error::Unable to derive the root password hash."; exit 1 ;;
            esac
            echo "::add-mask::$ROOT_HASH"
            printf '%s\n' '#!/bin/sh' "sed -i 's|^root:[^:]*:|root:${ROOT_HASH}:|' /etc/shadow" 'exit 0' > openwrt/files/etc/uci-defaults/99-init-password
          fi
          chmod +x openwrt/files/etc/uci-defaults/99-init-password
          echo "Initial password script created / 初始密码脚本已创建"
          unset DEFAULT_ROOT_PASSWORD REQUEST_ROOT_PASSWORD PASSWORD_MODE RPW ROOT_HASH

      - name: Prepare authoritative .config / 准备权威配置
        run: |
          cp reconstructed.config openwrt/.config
          cp reconstructed.config openwrt/pre-defconfig.config

      - name: Optional upstream defconfig / 可选上游配置规范化
        if: steps.req.outputs.use_defconfig == '1'
        run: |
          cd openwrt
          echo "Defconfig enabled / 官方补全已启用: make defconfig"
          set -o pipefail
          make defconfig 2>&1 | tee "$GITHUB_WORKSPACE/defconfig.log"
          cp .config "$GITHUB_WORKSPACE/defconfig.config"
          diff -u pre-defconfig.config "$GITHUB_WORKSPACE/defconfig.config" > "$GITHUB_WORKSPACE/defconfig.diff" || true

      - name: Record disabled defconfig evidence / 记录未启用官方规范化
        if: steps.req.outputs.use_defconfig != '1'
        run: |
          cp reconstructed.config defconfig.config
          : > defconfig.diff
          : > defconfig.log

      - name: Verify explicit configuration overrides / 核验显式配置覆盖
        run: |
          node tools/verify-effective-config.mjs \
            --overrides request-overrides.json \
            --config openwrt/.config \
            --out config-verification.json \
            --stage post-defconfig

      - name: Apply package mirror / 应用软件包镜像（APK/OPKG）
        env:
          WRT_WORKSPACE: ${{ github.workspace }}
          WRT_PACKAGE_MIRROR_ID: ${{ steps.req.outputs.package_mirror_id }}
          WRT_SOURCE_ID: ${{ steps.req.outputs.source }}
          WRT_BRANCH: ${{ steps.req.outputs.branch }}
          WRT_ZONENAME: ${{ steps.req.outputs.zonename }}
          WRT_TIMEZONE: ${{ steps.req.outputs.timezone }}
          WRT_THEME: ${{ steps.req.outputs.theme }}
          WRT_NTP_1: ${{ steps.req.outputs.ntp_1 }}
          WRT_NTP_2: ${{ steps.req.outputs.ntp_2 }}
          WRT_NTP_3: ${{ steps.req.outputs.ntp_3 }}
          WRT_NTP_4: ${{ steps.req.outputs.ntp_4 }}
          WRT_NTP_ID: ${{ steps.req.outputs.ntp_id }}
          WRT_PAGE_VERSION: ${{ steps.req.outputs.page_version }}
          WRT_BUILD_REF: ${{ steps.req.outputs.build_ref }}
          WRT_PACKAGE_MIRROR_REPORT: ${{ github.workspace }}/package-mirror-report.json
        run: |
          cd openwrt
          "$GITHUB_WORKSPACE/Shell/apply-package-mirror.sh"

      - name: Verify firmware settings / 核验固件设置
        if: steps.req.outputs.firmware_snapshot == '1'
        env:
          EXPECTED_ZONENAME: ${{ steps.req.outputs.zonename }}
          EXPECTED_TIMEZONE: ${{ steps.req.outputs.timezone }}
          EXPECTED_THEME: ${{ steps.req.outputs.theme }}
          EXPECTED_NTP: ${{ steps.req.outputs.ntp_id }}
          EXPECTED_PACKAGE_MIRROR: ${{ steps.req.outputs.package_mirror_id }}
        run: |
          set -euo pipefail
          INFO="openwrt/files/etc/weig-build-info"
          test -s "$INFO"
          test -s "openwrt/files/etc/uci-defaults/10-weig-system" || \
            test -s "openwrt/files/etc/uci-defaults/10-weig-timezone"
          grep -Fx "zonename=$EXPECTED_ZONENAME" "$INFO"
          grep -Fx "timezone=$EXPECTED_TIMEZONE" "$INFO"
          grep -Fx "theme=$EXPECTED_THEME" "$INFO"
          grep -Fx "ntp=$EXPECTED_NTP" "$INFO"
          grep -Fx "package_mirror_requested=$EXPECTED_PACKAGE_MIRROR" "$INFO"
          grep -Eq '^package_mirror_effective=.+$' "$INFO"
          grep -Eq '^package_managers=.+$' "$INFO"
          cp "$INFO" firmware-settings.txt

      - name: Record effective configuration / 记录实际构建配置
        env:
          REQUEST_BRANCH: ${{ steps.req.outputs.source_env }}
          REQUEST_COMMIT: ${{ steps.req.outputs.request_commit }}
        run: |
          cd openwrt
          cp .config "$GITHUB_WORKSPACE/build.config"
          PACKAGE_MIRROR_EFFECTIVE="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).effective || "source-default"' "$GITHUB_WORKSPACE/package-mirror-report.json")"
          PACKAGE_MANAGERS="$(node -p '(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).packageManagers || ["unknown"]).join(",")' "$GITHUB_WORKSPACE/package-mirror-report.json")"
          PACKAGE_MIRROR_FALLBACK="$(node -p 'String(Boolean(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).fallback))' "$GITHUB_WORKSPACE/package-mirror-report.json")"
          TEST_VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          {
            echo "test_version=$TEST_VERSION"
            echo "customizer=${GITHUB_SHA::7}"
            echo "request_branch=${REQUEST_BRANCH:-main}"
            echo "request_commit=${REQUEST_COMMIT:-unknown}"
            echo "workflow_branch=${GITHUB_REF_NAME:-unknown}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "upstream=$(git rev-parse --short HEAD)"
            echo "device=${{ steps.req.outputs.device }}"
            echo "source=${{ steps.req.outputs.source }}"
            echo "version=${{ steps.req.outputs.version }}"
            echo "variant=${{ steps.req.outputs.variant }}"
            echo "request_mode=${{ steps.req.outputs.request_mode }}"
            echo "use_defconfig=${{ steps.req.outputs.use_defconfig }}"
            if [ "${{ steps.req.outputs.use_defconfig }}" = "1" ]; then
              echo "config_policy=upstream-defconfig"
            else
              echo "config_policy=authoritative-no-defconfig"
            fi
            echo "config_id=${{ steps.req.outputs.config_id }}"
            echo "reconstructed_sha256=${{ steps.req.outputs.reconstructed_sha256 }}"
            echo "plugins=${{ steps.req.outputs.plugins }}"
            echo "tag=${{ steps.req.outputs.tag }}"
            echo "build_ref=${{ steps.req.outputs.build_ref }}"
            echo "page_version=${{ steps.req.outputs.page_version }}"
            echo "zonename=${{ steps.req.outputs.zonename }}"
            echo "timezone=${{ steps.req.outputs.timezone }}"
            echo "theme=${{ steps.req.outputs.theme }}"
            echo "ntp=${{ steps.req.outputs.ntp_id }}"
            echo "ntp_servers=${{ steps.req.outputs.ntp_1 }} ${{ steps.req.outputs.ntp_2 }} ${{ steps.req.outputs.ntp_3 }} ${{ steps.req.outputs.ntp_4 }}"
            echo "package_mirror_requested=${{ steps.req.outputs.package_mirror_id }}"
            echo "package_mirror_effective=$PACKAGE_MIRROR_EFFECTIVE"
            echo "package_managers=$PACKAGE_MANAGERS"
            echo "package_mirror_fallback=$PACKAGE_MIRROR_FALLBACK"
          } | tee "$GITHUB_WORKSPACE/build-metadata.txt"
          {
            echo "#### Package mirror / 软件包镜像"
            echo ""
            echo "- requested / 请求: `${{ steps.req.outputs.package_mirror_id }}`"
            echo "- effective / 生效: `$PACKAGE_MIRROR_EFFECTIVE`"
            echo "- package manager / 包管理器: `$PACKAGE_MANAGERS`"
            echo "- fallback / 回退: `$PACKAGE_MIRROR_FALLBACK`"
            echo "- report / 报告: `package-mirror-report.json` (CONFIG artifact)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final .config / 上传最终 .config(编译失败也能拿到)
        if: always() && steps.req.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-CONFIG
          path: |
            openwrt/.config
            profile-baseline.config
            reconstructed.config
            request-overrides.json
            config-verification.json
            pre-defconfig.config
            defconfig.config
            defconfig.diff
            defconfig.log
            build.config
            build-metadata.txt
            request-audit.json
            package-mirror-report.json
            firmware-settings.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 60

      - name: Download packages / 下载依赖包
        run: |
          cd openwrt
          case "${{ steps.req.outputs.download_jobs }}" in
            auto) JOBS=$(( $(nproc) + 1 )) ;;
            ''|*[!0-9]*) echo "::error::Invalid project download job policy."; exit 1 ;;
            *) JOBS="${{ steps.req.outputs.download_jobs }}" ;;
          esac
          echo "Download jobs / 下载并发: $JOBS"
          set +e
          set -o pipefail
          stdbuf -oL -eL make download -j"$JOBS" 2>&1 |
            tee "$GITHUB_WORKSPACE/download.log"
          DOWNLOAD_RC=${PIPESTATUS[0]}
          set -e
          echo "Download exit code / 下载退出码: $DOWNLOAD_RC"
          {
            echo "### 📥 Download stage / 下载阶段"
            echo ""
            echo "- jobs: \`$JOBS\`"
            echo "- exit code: \`$DOWNLOAD_RC\`"
            echo "- Actions displays the live command output and saves it to \`download.log\`. / Actions 实时显示原始输出，并保存到 \`download.log\`。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DOWNLOAD_RC" -ne 0 ]; then
            echo "::warning::Some dependencies failed to download; compilation will continue. Full details are in download.log. / 部分依赖下载失败，将继续编译；完整信息已写入 download.log。"
          fi

      - name: Compile / 编译(原始实时日志)
        id: compile
        continue-on-error: true
        run: |
          cd openwrt
          case "${{ steps.req.outputs.compile_jobs }}" in
            auto) JOBS=$(( $(nproc) + 1 )) ;;
            ''|*[!0-9]*) echo "::error::Invalid project compile job policy."; exit 1 ;;
            *) JOBS="${{ steps.req.outputs.compile_jobs }}" ;;
          esac
          echo "Compile jobs / 编译并发: $JOBS"
          set +e
          set -o pipefail
          stdbuf -oL -eL make -j"$JOBS" BUILD_LOG=1 2>&1 |
            tee "$GITHUB_WORKSPACE/build.log"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "### 🛠️ Compile / 编译"
            echo ""
            echo "- jobs: \`$JOBS\`"
            echo "- command: \`make -j$JOBS BUILD_LOG=1\`"
            echo "- exit code: \`$RC\`"
            echo "- Actions displays the live command output and saves it to \`build.log\`. / Actions 实时显示原始输出，并保存到 \`build.log\`。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            echo "::error::Parallel compilation failed; the original workspace will be captured before single-thread diagnosis. / 并行编译失败，将先冻结原始现场，再进入单线程诊断。"
          fi
          exit "$RC"

      - name: Snapshot parallel failure / 冻结并行失败现场
        if: steps.compile.outcome == 'failure'
        run: |
          "$GITHUB_WORKSPACE/Shell/collect-build-evidence.sh" snapshot parallel \
            "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/failure-logs"
          rm -rf "$GITHUB_WORKSPACE/openwrt/logs"

      - name: Diagnose failed compile / 单线程定位失败原因
        id: diagnose
        if: steps.compile.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 185
        run: |
          cd openwrt
          echo "Single-thread retry / 单线程重试: make -j1 V=s BUILD_LOG=1 (180-minute limit)"
          set +e
          set -o pipefail
          timeout 180m stdbuf -oL -eL make -j1 V=s BUILD_LOG=1 2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostic.log"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "### 🔎 Single-thread retry / 单线程重试"
            echo ""
            echo "- command: \`make -j1 V=s BUILD_LOG=1\`"
            echo "- limit: \`180 minutes\`"
            echo "- exit code: \`$RC\`"
            echo "- log: \`build-diagnostic.log\`"
            echo "- result: exit 0 resumes the build; 124 means timeout; other non-zero exits remain failed."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -eq 124 ]; then
            echo "::warning::The single-thread retry exceeded 180 minutes and was stopped; see diagnostic/. / 单线程重试超过 180 分钟，已停止；请查看 diagnostic/。"
          elif [ "$RC" -ne 0 ]; then
            echo "::error::The single-thread retry also failed; see diagnostic/. / 单线程重试仍失败；请查看 diagnostic/。"
          fi
          exit "$RC"

      - name: Snapshot diagnostic retry / 冻结单线程诊断现场
        if: always() && steps.compile.outcome == 'failure' && steps.diagnose.outcome != 'skipped'
        run: |
          "$GITHUB_WORKSPACE/Shell/collect-build-evidence.sh" snapshot diagnostic \
            "$GITHUB_WORKSPACE/build-diagnostic.log" "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/failure-logs"

      - name: Finalize compile result / 确认编译结果
        if: always()
        run: |
          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            echo "Parallel compile succeeded / 并行编译成功"
            exit 0
          fi
          if [ "${{ steps.compile.outcome }}" = "skipped" ] || [ -z "${{ steps.compile.outcome }}" ]; then
            echo "Compile was not started because an earlier step failed / 前置步骤失败，编译未开始"
            exit 0
          fi
          if [ "${{ steps.diagnose.outcome }}" = "success" ]; then
            echo "::warning::Parallel compilation failed, but the single-thread retry succeeded; the build will continue. / 并行编译失败，但单线程重试成功；构建继续。"
            {
              echo "### ✅ 单线程恢复 / Recovered by single-thread retry"
              echo ""
              echo "- parallel build: failed"
              echo "- make -j1 V=s BUILD_LOG=1: succeeded"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Both parallel compilation and the single-thread retry failed; download BUILD-LOGS. / 并行与单线程编译均失败；请下载 BUILD-LOGS。"
          exit 1

      - name: Collect failure logs / 收集失败日志
        if: failure() || steps.compile.outcome == 'failure'
        run: |
          mkdir -p failure-logs
          cp download.log failure-logs/ 2>/dev/null || true
          cp build-metadata.txt failure-logs/ 2>/dev/null || true
          cp profile-baseline.config reconstructed.config request-overrides.json config-verification.json request-audit.json package-mirror-report.json pre-defconfig.config defconfig.config defconfig.diff defconfig.log build.config failure-logs/ 2>/dev/null || true
          cp openwrt/.config failure-logs/final.config 2>/dev/null || true

          PARALLEL_OUTCOME="${{ steps.compile.outcome }}"
          PARALLEL_EXIT="${{ steps.compile.outputs.exit_code }}"
          DIAGNOSTIC_OUTCOME="${{ steps.diagnose.outcome }}"
          DIAGNOSTIC_EXIT="${{ steps.diagnose.outputs.exit_code }}"
          PARALLEL_RESULT="NOT STARTED"
          DIAGNOSTIC_RESULT="NOT RUN"
          FINAL_RESULT="BUILD FAILED"
          CONFIG_RESULT="$(node -p 'try { JSON.parse(require("fs").readFileSync("failure-logs/config-verification.json", "utf8")).result || "NOT RUN" } catch { "NOT RUN" }')"
          CONFIG_CODE="$(node -p 'try { JSON.parse(require("fs").readFileSync("failure-logs/config-verification.json", "utf8")).code || "none" } catch { "none" }')"
          if [ "$PARALLEL_OUTCOME" = "success" ]; then
            PARALLEL_RESULT="SUCCEEDED"
            FINAL_RESULT="FAILED AFTER COMPILE"
          elif [ "$PARALLEL_OUTCOME" = "failure" ]; then
            PARALLEL_RESULT="FAILED"
            if [ "$DIAGNOSTIC_EXIT" = "0" ]; then
              DIAGNOSTIC_RESULT="SUCCEEDED"
              FINAL_RESULT="RECOVERED"
            elif [ "$DIAGNOSTIC_EXIT" = "124" ]; then
              DIAGNOSTIC_RESULT="TIMEOUT"
            elif [ -n "$DIAGNOSTIC_EXIT" ]; then
              DIAGNOSTIC_RESULT="FAILED"
            elif [ "$DIAGNOSTIC_OUTCOME" = "failure" ]; then
              DIAGNOSTIC_RESULT="FAILED"
            elif [ "$DIAGNOSTIC_OUTCOME" = "cancelled" ]; then
              DIAGNOSTIC_RESULT="CANCELLED"
            fi
          fi

          ROOTFS_PARTSIZE="$(sed -n 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=//p' failure-logs/final.config 2>/dev/null | tail -n 1 | tr -d '\r')"
          ROOTFS_TOO_SMALL=false
          if grep -Eqi 'ext4_allocate[^:]*:.*out of space|failed to allocate [0-9]+ blocks, out of space' \
            failure-logs/parallel/build.log failure-logs/diagnostic/build.log 2>/dev/null; then
            ROOTFS_TOO_SMALL=true
          fi

          {
            echo "===================== BUILD DIAGNOSTICS / 构建诊断 ====================="
            echo "Test version / 测试版本: $(tr -d '\r\n' < VERSION)"
            echo "Device / 机型: ${{ steps.req.outputs.device }}"
            echo "Source / 源码: ${{ steps.req.outputs.source }} @ ${{ steps.req.outputs.branch }}"
            echo "Version / 版本: ${{ steps.req.outputs.version }}   Variant / 变体: ${{ steps.req.outputs.variant }}"
            echo "Request branch / 请求分支: ${{ steps.req.outputs.source_env || 'main' }}"
            echo "Request commit / 请求提交: ${{ steps.req.outputs.request_commit || 'unknown' }}"
            echo "Workflow branch / Workflow 分支: ${GITHUB_REF_NAME:-unknown}"
            echo "Workflow commit / Workflow 提交: ${GITHUB_SHA}"
            echo "Page version / 网页版本: ${{ steps.req.outputs.page_version }}"
            echo "Packages / 插件: ${{ steps.req.outputs.plugins }}"
            echo "Tag / 标识: ${{ steps.req.outputs.tag }}   Run / 构建: ${{ github.run_id }}"
            echo "This build / 本次构建: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "-------- STAGE RESULTS / 阶段结果 --------"
            echo "Configuration overrides"
            echo "  result : $CONFIG_RESULT"
            echo "  code   : $CONFIG_CODE"
            echo "Parallel compile"
            echo "  result : $PARALLEL_RESULT"
            echo "  exit   : ${PARALLEL_EXIT:-n/a}"
            echo "  logs   : $([ -d failure-logs/parallel ] && echo 'parallel/' || echo 'n/a')"
            echo "Diagnostic retry"
            echo "  command: make -j1 V=s BUILD_LOG=1"
            echo "  limit  : 180 minutes"
            echo "  result : $DIAGNOSTIC_RESULT"
            echo "  exit   : ${DIAGNOSTIC_EXIT:-n/a}"
            echo "  logs   : $([ -d failure-logs/diagnostic ] && echo 'diagnostic/' || echo 'n/a')"
            echo "Final result"
            echo "  $FINAL_RESULT"
            if [ "$ROOTFS_TOO_SMALL" = "true" ]; then
              echo ""
              echo "-------- ROOTFS CAPACITY / RootFS 容量 --------"
              echo "RootFS image is too small."
              echo "Project / 项目: Root filesystem partition size (in MiB)"
              if [ -n "$ROOTFS_PARTSIZE" ]; then
                echo "Current value / 当前值: $ROOTFS_PARTSIZE MiB"
              else
                echo "Current value / 当前值: unknown"
              fi
              echo "Path / 路径: Target Images → TARGET_ROOTFS_PARTSIZE"
              echo "Please increase TARGET_ROOTFS_PARTSIZE and rebuild."
            fi
            echo ""
            echo "-------- COLLECTED LOGS / 已收集日志 --------"
            for stage in parallel diagnostic; do
              if [ -d "failure-logs/$stage" ]; then
                echo "[$stage/]"
                for name in build.log errors.txt last-targets.txt tail.txt package-logs.tar.gz evidence.txt; do
                  [ -f "failure-logs/$stage/$name" ] && echo "- $stage/$name"
                done
              fi
            done
            echo ""
            echo "-------- SEARCH KEYWORDS / 定位关键字 --------"
            for stage in parallel diagnostic; do
              [ -s "failure-logs/$stage/errors.txt" ] || continue
              echo "[$stage/errors.txt]"
              tail -n 40 "failure-logs/$stage/errors.txt"
            done
            echo ""
            echo "-------- LAST FAILING TARGETS / 最后出错的目标 --------"
            for stage in parallel diagnostic; do
              [ -s "failure-logs/$stage/last-targets.txt" ] || continue
              echo "[$stage/last-targets.txt]"
              tail -n 20 "failure-logs/$stage/last-targets.txt"
            done
            echo ""
            echo "Full logs are in parallel/ and diagnostic/; evidence from the two stages is kept separate. / 完整日志见 parallel/ 与 diagnostic/；两阶段证据互不覆盖。"
          } > failure-logs/00-SUMMARY.txt
          cat failure-logs/00-SUMMARY.txt >> "$GITHUB_STEP_SUMMARY" || true

          {
            echo ''
            echo '## 📥 How to get full logs / 完整日志取件'
            echo ''
            echo '| Step / 步骤 | Action / 操作 |'
            echo '| --- | --- |'
            echo '| 1 | Open this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} / 打开本次构建页面 |'
            echo '| 2 | Scroll to the **Artifacts** section at the very bottom / 拉到页面最底部 **Artifacts** 区 |'
            echo '| 3 | Download and unzip `${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS` / 下载并解压 `${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS` |'
            echo '| 4 | Read `00-SUMMARY.txt` first; use `parallel/` for the original parallel failure and `diagnostic/` for the single-thread retry / 先看 `00-SUMMARY.txt`；并行现场看 `parallel/`，单线程诊断看 `diagnostic/` |'
            echo '| 5 | Per stage, read `errors.txt` → `last-targets.txt` → `tail.txt` → `build.log` → `package-logs.tar.gz` (if present) / 每阶段依次查看这些文件（如有） |'
            echo ''
            echo '> ⏳ Build artifacts are kept for 60 days; submit a new build after expiry. / 构建 Artifact 统一保留 60 天，过期需重新提交构建。'
          } >> "$GITHUB_STEP_SUMMARY" || true
          ls -lh failure-logs
          echo "📤 artifact:${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS — parallel/ contains the original parallel workspace; diagnostic/ contains the single-thread diagnosis. / parallel/ 保存原始并行现场，diagnostic/ 保存单线程诊断现场。"

      - name: Collect menuconfig M packages / 收集 menuconfig 的 M 软件包
        if: success()
        run: node tools/collect-optional-packages.mjs --config openwrt/.config --bin openwrt/bin --out optional-packages

      - name: Check disk usage / 检查空间
        if: (!cancelled())
        run: df -hT

      - name: Classify artifacts and write download guide / 分类产物并生成下载说明
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact-staging"
          FIRMWARE="$ROOT/FIRMWARE-OTHER"
          STANDALONE="$ROOT/STANDALONE"
          LOGS="$ROOT/BUILD-LOGS"
          PLAN="$GITHUB_WORKSPACE/artifact-publish-plan.json"
          mkdir -p "$LOGS"

          cp download.log build-metadata.txt firmware-settings.txt "$LOGS/" 2>/dev/null || true
          if [ -d failure-logs ]; then
            cp -a failure-logs/. "$LOGS/"
          else
            cp build.log "$LOGS/" 2>/dev/null || true
          fi
          printf '%s\n' \
            'BUILD LOGS' \
            'Read 00-SUMMARY.txt first if present; parallel/ contains the original parallel failure and diagnostic/ contains the single-thread diagnosis.' \
            'A successful build without diagnosis keeps only the regular build.log / download.log.' \
            'Build artifacts are retained for 60 days.' \
            '' \
            '中文翻译 / Chinese translation:' \
            '若存在 00-SUMMARY.txt，请先阅读；parallel/ 是原始并行失败现场，diagnostic/ 是单线程诊断现场。' \
            '成功且未进入诊断时仅保留常规 build.log / download.log。' \
            '构建 Artifact 统一保留 60 天。' > "$LOGS/00-请先读我-README.txt"

          node tools/artifact-publish.mjs \
            --source openwrt/bin/targets \
            --staging "$ROOT" \
            --artifact-ref "${{ steps.req.outputs.artifact_ref }}" \
            --policy .github/automation-policy.json \
            --plan "$PLAN"

          HAS_STANDALONE="$(node -p 'String(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).hasStandalone)' "$PLAN")"
          STANDALONE_SUFFIXES="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).standaloneSuffixes.join(", ")' "$PLAN")"
          STANDALONE_COUNT="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).standalone.length' "$PLAN")"
          if [ "$HAS_STANDALONE" = "true" ]; then
            (cd "$STANDALONE" && sha256sum -- *) > "$FIRMWARE/${{ steps.req.outputs.artifact_ref }}-sha256sums-standalone.txt"
          fi
          if [ -s firmware-settings.txt ]; then
            cp firmware-settings.txt "$FIRMWARE/${{ steps.req.outputs.artifact_ref }}-00-BUILD-SETTINGS.txt"
          fi
          printf '%s\n' \
            'OTHER FIRMWARE AND BUILD FILES' \
            'Firmware files selected by the standalone suffix policy are published separately; all remaining files stay here.' \
            'Always verify the exact model and partition layout before flashing.' \
            '' \
            '中文翻译 / Chinese translation:' \
            '配置为独立发布的固件文件不会放在本目录；其余文件保留在这里。' \
            '首次刷机与升级包取决于具体机型和闪存布局，请先核对上游说明。' > "$FIRMWARE/00-请先读我-README.txt"

          {
            echo ''
            echo '## 📦 Firmware download guide / 固件下载与安装选择'
            echo ''
            echo '> [!IMPORTANT]'
            echo "> Standalone suffixes / 独立发布后缀: \`$STANDALONE_SUFFIXES\`. The $STANDALONE_COUNT matching files become separate Artifacts; add a suffix by changing the automation policy."
            echo "> Files matching the configured suffix policy are uploaded one by one without changing this Workflow. / 命中配置后缀策略的文件会逐个上传，无需修改此 Workflow。"
            echo ''
            echo '| Artifact | Contents / 内容 |'
            echo '| --- | --- |'
            echo '| 📦 `${{ steps.req.outputs.artifact_ref }}-<standalone file>` | Firmware matching a standalone suffix; one file becomes one Artifact. / 命中独立发布后缀的固件；一个文件对应一个 Artifact。 |'
            echo '| 📁 `${{ steps.req.outputs.artifact_ref }}-FIRMWARE-OTHER` | Remaining firmware files, manifest, buildinfo, and common checksums. / 其余固件文件、manifest、buildinfo 与通用校验和。 |'
            echo '| ⚙️ `${{ steps.req.outputs.artifact_ref }}-CONFIG` | Submitted configuration, effective build configuration, and build metadata. / 用户提交配置、实际开编配置和构建元数据。 |'
            echo '| 🧾 `${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS` | Complete download/compile logs; retained for 60 days. / 完整下载/编译日志；保留 60 天。 |'
            echo '| 🧩 `${{ steps.req.outputs.artifact_ref }}-OPTIONAL-PACKAGES` | Packages selected as M in menuconfig: built but not embedded in the firmware. / menuconfig 选为 M：已编译但未写入固件的软件包。 |'
            echo ''
            echo '> [!WARNING]'
            echo '> `sysupgrade` is not a universal updater. Do not flash when the model, current firmware, or partition layout is uncertain. / `sysupgrade` 不是通用更新包。不确定机型、当前固件或布局时不要刷。'
            echo ''
            echo '- Firmware, configuration, build metadata, and complete logs are retained for **60 days**. / 固件、配置、构建信息与完整日志统一保留 **60 天**。'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build standalone artifact manifest / 生成独立 Artifact 清单
        id: artifact_manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - "$GITHUB_WORKSPACE/artifact-publish-plan.json" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(`matrix=${JSON.stringify(plan.matrix)}`);
          console.log(`has_standalone=${plan.hasStandalone ? 'true' : 'false'}`);
          NODE

      - name: Upload standalone bridge / 上传独立固件桥接包
        id: standalone_bridge
        if: success() && steps.artifact_manifest.outputs.has_standalone == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-STANDALONE-BRIDGE
          path: artifact-staging/STANDALONE/
          if-no-files-found: error
          retention-days: 1

      - name: Upload other firmware / 上传其他固件文件
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-FIRMWARE-OTHER
          path: artifact-staging/FIRMWARE-OTHER/
          if-no-files-found: error
          compression-level: 0
          retention-days: 60

      - name: Upload complete logs / 上传完整日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-BUILD-LOGS
          path: artifact-staging/BUILD-LOGS/
          if-no-files-found: warn
          retention-days: 60

      - name: Upload optional M packages / 上传可选 M 软件包
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.req.outputs.artifact_ref }}-OPTIONAL-PACKAGES
          path: optional-packages/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 60

  publish-standalone:
    name: Publish standalone firmware / 发布独立固件
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.build.outputs.standalone_matrix || '[{"name":"__none__","enabled":false}]') }}
    steps:
      - name: Download standalone bridge / 下载独立固件桥接包
        if: matrix.file.enabled == true
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_ref }}-STANDALONE-BRIDGE
          path: standalone-bridge

      - name: Upload one standalone artifact / 逐个上传独立固件
        if: matrix.file.enabled == true
        uses: actions/upload-artifact@v7
        with:
          path: standalone-bridge/${{ matrix.file.name }}
          archive: false
          if-no-files-found: error
          retention-days: 60

  cleanup-standalone-bridge:
    name: Cleanup standalone bridge / 清理独立固件桥接包
    needs: [build, publish-standalone]
    if: always() && needs.build.outputs.bridge_artifact_id != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Delete this run's bridge artifact / 删除本次桥接 Artifact
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          BRIDGE_ARTIFACT_ID: ${{ needs.build.outputs.bridge_artifact_id }}
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number(process.env.BRIDGE_ARTIFACT_ID),
            });

  notify:
    name: Final result / 最终结果
    needs: [admission, build, publish-standalone, cleanup-standalone-bridge]
    if: always() && needs.build.outputs.build_ref != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Comment final result / 回评最终结果
        uses: actions/github-script@v8
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish-standalone.result }}
          ARTIFACT_REF: ${{ needs.build.outputs.artifact_ref }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUESTER: ${{ inputs.requester }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success' && process.env.PUBLISH_RESULT === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ref = process.env.ARTIFACT_REF;
            const body = ok
              ? `@${process.env.REQUESTER}\n\n✅ Build and standalone firmware publication completed.\n\nDownload: ${url}\n\n- Firmware matching the configured standalone suffix policy is uploaded as one Artifact per file: \`${ref}-<standalone file>\`.\n- \`${ref}-CONFIG\`, \`${ref}-BUILD-LOGS\`, \`${ref}-OPTIONAL-PACKAGES\`, and \`${ref}-FIRMWARE-OTHER\` contain categorized supporting files; an Artifact may be absent when it has no content.\n\nFor the first flash, use \`factory\` in most cases. Use \`sysupgrade\` only when the current firmware and partition layout are compatible.\n\n中文说明：构建和固件发布全部完成。首次刷机通常选 \`factory\`；\`sysupgrade\` 只用于当前固件与闪存布局兼容的升级。`
              : `@${process.env.REQUESTER}\n\n❌ Build or standalone firmware publication failed.\n\nBuild: ${process.env.BUILD_RESULT}; standalone publication: ${process.env.PUBLISH_RESULT}\n\nOpen this Actions Run and inspect \`${ref}-CONFIG\` and \`${ref}-BUILD-LOGS\`: ${url}\n\n中文说明：构建或独立固件发布失败，请打开本次 Actions 查看配置和完整日志。`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed',
              state_reason: ok ? 'completed' : 'not_planned',
            });
