name: Prepare Build Information Interactive Close

on:
  push:
    branches: [fix-D]
    paths:
      - ".github/workflows/build-info-interactive-close-prepare.yml"
      - "tools/.build-info-interactive-close-patch.py"

permissions:
  contents: write

concurrency:
  group: build-info-interactive-close-fix-D
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-D
          fetch-depth: 6

      - name: Verify bootstrap base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e4c8e1b6f6a264d099c99a0434b1733b48455f8f HEAD
          test "$(git branch --show-current)" = "fix-D"

      - name: Apply approved interactive close behavior
        run: |
          set -euo pipefail
          python3 tools/.build-info-interactive-close-patch.py
          git rm .github/workflows/build-info-interactive-close-prepare.yml tools/.build-info-interactive-close-patch.py

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/build-info-interactive-close-prepare\.yml|tools/\.build-info-interactive-close-patch\.py|VERSION|site/wrt/app\.js|site/wrt/data/site-version\.json|tools/test-catalog-ui-contract\.mjs)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected prepared files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit prepared change
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: close build information on interactive clicks"
          git push origin HEAD:fix-D
