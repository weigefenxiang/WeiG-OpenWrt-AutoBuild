name: Validate public terminology once

on:
  push:
    branches:
      - fix-F
    paths:
      - '.public-terminology-once.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply terminology guard
        run: python3 .public-terminology-once.py
      - name: Prepare project release identity
        run: node tools/dev-assistant.mjs prepare
      - name: Verify project contracts
        run: node tools/dev-assistant.mjs verify
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/check-public-terminology.mjs tools/check-all.mjs VERSION site/wrt/data/site-version.json
          git commit -m 'ci: enforce public terminology policy'
          git push origin HEAD:fix-F
