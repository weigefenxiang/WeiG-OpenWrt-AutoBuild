name: Cancel Custom Build / 取消定制构建
run-name: Cancel build / 取消构建 · #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write

jobs:
  cancel:
    name: Cancel own build / 取消自己的构建
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Verify requester and cancel / 核验提交者并取消
        uses: actions/github-script@v8
        with:
          script: |
            const command = context.payload.comment.body.trim().toLowerCase();
            if (!['/cancel', '/cancel-build'].includes(command)) return;
            const issue = context.payload.issue;
            if (!issue.title.startsWith('[build]')) return;
            const requester = issue.user.login;
            const commenter = context.payload.comment.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (commenter.toLowerCase() !== requester.toLowerCase()) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `@${commenter}\n\n⛔ 只能由该构建的提交者 @${requester} 取消。`,
              });
              return;
            }

            // Close first so a dispatcher/worker that is racing with this command fails its live Issue guard.
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned',
            });

            const prefixes = new Map([
              ['build-dispatcher.yml', `Dispatch ${requester}#${issue.number} ·`.toLowerCase()],
              ['custom-build.yml', `Build ${requester}#${issue.number} ·`.toLowerCase()],
            ]);
            const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const findActive = async () => {
              const runs = [];
              for (const [workflowId, prefix] of prefixes) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: workflowId, per_page: 100,
                });
                runs.push(...data.workflow_runs.filter((run) =>
                  activeStatuses.has(run.status) &&
                  String(run.display_title || '').toLowerCase().startsWith(prefix)));
              }
              return [...new Map(runs.map((run) => [String(run.id), run])).values()];
            };

            const cancelled = new Map();
            const cancelRuns = async (runs) => {
              for (const run of runs) {
                if (cancelled.has(String(run.id))) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  cancelled.set(String(run.id), run.html_url);
                } catch (error) {
                  if ([404, 409, 422].includes(error.status)) {
                    core.notice(`Run ${run.id} became non-cancellable before the request completed.`);
                    continue;
                  }
                  throw error;
                }
              }
            };

            await cancelRuns(await findActive());
            await new Promise((resolve) => setTimeout(resolve, 3000));
            await cancelRuns(await findActive());

            if (!cancelled.size) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `@${requester}\n\nℹ️ 没有找到可取消的排队中或运行中的构建；Issue 已关闭，新的 Dispatcher/Worker 也会被身份门禁阻止。`,
              });
              return;
            }

            await new Promise((resolve) => setTimeout(resolve, 12000));
            for (const runId of cancelled.keys()) {
              const { data: latest } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(runId) });
              if (latest.status !== 'completed') {
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                    owner, repo, run_id: Number(runId),
                  });
                } catch (error) {
                  if (![404, 409, 422].includes(error.status)) throw error;
                  core.notice(`Run ${runId} completed before force-cancel was applied.`);
                }
              }
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `@${requester}\n\n🛑 已请求取消构建：${[...cancelled.values()].join('、')}\n\n任务将停止；若普通取消未及时完成，系统已自动改用强制取消。`,
            });
