name: E control template preparation

on:
  push:
    branches: [fix-E]
    paths:
      - ".e-control-template.py"
      - ".github/workflows/e-control-template.yml"

permissions:
  contents: write

concurrency:
  group: e-control-template-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Normalize one-shot helper output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.e-control-template.py')
          text = path.read_text(encoding='utf-8')
          old = "css = css.rstrip() + control_css + '\\n'"
          new = "css = css.rstrip() + control_css.rstrip() + '\\n'"
          if text.count(old) != 1:
              raise SystemExit(f'helper EOF anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply shared control template
        run: python3 .e-control-template.py
      - name: Remove one-shot control files before fingerprinting
        run: git rm .e-control-template.py .github/workflows/e-control-template.yml
      - name: Prepare project-native version and contracts
        run: node tools/dev-assistant.mjs prepare
      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify
      - name: Commit prepared E control template
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "style: standardize elevated form controls"
          git push origin HEAD:fix-E
