name: Prepare Defconfig Layout Refinement

on:
  push:
    branches: [fix-D]
    paths:
      - ".github/workflows/defconfig-layout-prepare.yml"
      - "tools/.defconfig-layout-patch.py"

permissions:
  contents: write

concurrency:
  group: defconfig-layout-fix-D
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-D
          fetch-depth: 8

      - name: Verify bootstrap base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 37a4e94143c95b82c8371c94d2e803d0f05105db HEAD
          test "$(git branch --show-current)" = "fix-D"

      - name: Apply approved Defconfig layout
        run: |
          set -euo pipefail
          python3 tools/.defconfig-layout-patch.py
          git rm .github/workflows/defconfig-layout-prepare.yml tools/.defconfig-layout-patch.py

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/defconfig-layout-prepare\.yml|tools/\.defconfig-layout-patch\.py|VERSION|site/wrt/index\.html|site/wrt/app\.css|site/wrt/app\.js|site/wrt/data/site-version\.json|tools/test-catalog-ui-contract\.mjs)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected prepared files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit prepared change
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: refine Defconfig and Catalog controls layout"
          git push origin HEAD:fix-D
