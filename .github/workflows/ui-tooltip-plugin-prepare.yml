name: Prepare Shared Tooltip and Plugin Selection

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ui-tooltip-plugin-prepare.yml
      - tools/.ui-tooltip-plugin-patch.py

permissions:
  contents: write

concurrency:
  group: prepare-shared-tooltip-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Verify bootstrap base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "aac2d2095befe7612ae3f1d99e9009af0b820f38"

      - name: Apply approved tooltip and plugin interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.ui-tooltip-plugin-patch.py
          git rm .github/workflows/ui-tooltip-plugin-prepare.yml tools/.ui-tooltip-plugin-patch.py

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse "${GITHUB_SHA}^")"
          actual="$(git diff --name-only "$base" | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            site/wrt/app.css \
            site/wrt/app.js \
            site/wrt/data/site-version.json \
            site/wrt/index.html \
            tools/test-catalog-ui-contract.mjs | sort)"
          test "$actual" = "$expected"

      - name: Commit prepared change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION site/wrt/app.css site/wrt/app.js site/wrt/data/site-version.json site/wrt/index.html tools/test-catalog-ui-contract.mjs
          git add -u .github/workflows/ui-tooltip-plugin-prepare.yml tools/.ui-tooltip-plugin-patch.py
          git commit -m "feat: unify tooltips and plugin card selection"
          git push origin HEAD:dev

      - name: Clean failed bootstrap files
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "${GITHUB_SHA}" ]; then
            echo "dev moved; skip cleanup to avoid overwriting concurrent work"
            exit 0
          fi
          git reset --hard "${GITHUB_SHA}"
          git rm -f .github/workflows/ui-tooltip-plugin-prepare.yml tools/.ui-tooltip-plugin-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: clean failed tooltip preparation"
          git push origin HEAD:dev
