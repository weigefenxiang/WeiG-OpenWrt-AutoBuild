name: Prepare Shared Tooltip and Plugin Selection

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ui-tooltip-plugin-prepare.yml
      - tools/.ui-tooltip-plugin-patch.py

permissions:
  contents: write

concurrency:
  group: prepare-shared-tooltip-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Verify bootstrap base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "c513d18ea3efd833b28bae60c58e62ab6828ad38"

      - name: Apply approved tooltip and plugin interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/.ui-tooltip-plugin-patch.py')
          text = path.read_text(encoding='utf-8')
          marker = "\ntest = Path('tools/test-catalog-ui-contract.mjs')"
          if marker not in text:
              raise SystemExit('temporary patch test marker missing')
          path.write_text(text.split(marker, 1)[0] + '\n', encoding='utf-8', newline='\n')
          PY
          python3 tools/.ui-tooltip-plugin-patch.py
          python3 - <<'PY'
          from pathlib import Path
          test = Path('tools/test-catalog-ui-contract.mjs')
          marker = """expect(!app.includes('syncThemeFromMenu') && app.includes('syncFirmwareThemeFromMenu'),
          """
          insert = r"""const sharedTooltipContract = app.match(/\/\* ============ 统一悬浮说明[\s\S]*?function makePill/)?.[0] || '';
          const pluginRenderContract = app.match(/function renderPlugin\(p\) \{([\s\S]*?)\n\}\n\n\/\* V10:清掉/)?.[1] || '';
          expect(html.includes('class="ui-tooltip" id="uiTooltip"') &&
            html.includes('id="uiTooltipTitle"') && html.includes('id="uiTooltipEmphasis"') &&
            html.includes('id="uiTooltipBody"') &&
            !html.includes('id="menuTooltip"') && !html.includes('id="popover"') &&
            css.includes('.ui-tooltip{position:fixed;z-index:999;width:max-content;max-width:min(400px,calc(100vw - 24px))') &&
            css.includes('.ui-tooltip-emphasis{') && css.includes('color:var(--danger)') &&
            !css.includes('.menu-tooltip{') && !css.includes('.popover {') &&
            sharedTooltipContract.includes("const UI_TOOLTIP_SELECTOR = '[data-ui-tooltip-title],[data-ui-tooltip-emphasis],[data-ui-tooltip-body]'") &&
            sharedTooltipContract.includes("const wrap = target?.closest?.('.wrap') || $('app')") &&
            sharedTooltipContract.includes("document.addEventListener('pointermove'") &&
            sharedTooltipContract.includes('positionUiTooltip(target, event)') &&
            app.includes('showUiTooltip(element, { body: text, event });'),
            'shared pointer-following tooltip template or content-bound positioning regressed');
          expect(app.includes("dataset.uiTooltipTitle = 'D · Defconfig'") &&
            app.includes('⚠ 当前版本加载时已完成基准配置解析。通常直接在现有结果上增减即可，无需开启 D。') &&
            app.includes('可能把你手工删减的默认项重新补回。') &&
            app.includes("dataset.uiTooltipEmphasis = defconfigEmphasis") &&
            app.includes("dataset.uiTooltipBody = defconfigHelp") &&
            app.includes("removeAttribute('title')"),
            'Defconfig compact warning or shared tooltip binding regressed');
          expect(pluginRenderContract.includes('const applyChecked = (checked) => {') &&
            pluginRenderContract.includes('item.dataset.uiTooltipTitle = pName(p)') &&
            pluginRenderContract.includes('item.dataset.uiTooltipBody = tooltipBody') &&
            pluginRenderContract.includes("item.addEventListener('dblclick', (event) => {") &&
            pluginRenderContract.includes('if (cb.disabled) return;') &&
            pluginRenderContract.includes('if (curatedPluginChecked(p, st, catalogOption) && cb.checked) return;') &&
            pluginRenderContract.includes('applyChecked(true);') &&
            !pluginRenderContract.includes('nameBtn.title = detail'),
            'plugin card double-click selection or shared tooltip binding regressed');

          """
          text = test.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('test-catalog-ui-contract.mjs: insertion marker mismatch')
          test.write_text(text.replace(marker, insert + marker, 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/ui-tooltip-plugin-prepare.yml tools/.ui-tooltip-plugin-patch.py

      - name: Prepare project version and generated bytes
        run: node tools/dev-assistant.mjs prepare

      - name: Verify prepared project
        run: node tools/dev-assistant.mjs verify

      - name: Guard final change scope
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse "${GITHUB_SHA}^")"
          actual="$(git diff --name-only "$base" | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            site/wrt/app.css \
            site/wrt/app.js \
            site/wrt/data/site-version.json \
            site/wrt/index.html \
            tools/test-catalog-ui-contract.mjs | sort)"
          test "$actual" = "$expected"

      - name: Commit prepared change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION site/wrt/app.css site/wrt/app.js site/wrt/data/site-version.json site/wrt/index.html tools/test-catalog-ui-contract.mjs
          git add -u .github/workflows/ui-tooltip-plugin-prepare.yml tools/.ui-tooltip-plugin-patch.py
          git commit -m "feat: unify tooltips and plugin card selection"
          git push origin HEAD:dev

      - name: Clean failed bootstrap files
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "${GITHUB_SHA}" ]; then
            echo "dev moved; skip cleanup to avoid overwriting concurrent work"
            exit 0
          fi
          git reset --hard "${GITHUB_SHA}"
          git rm -f .github/workflows/ui-tooltip-plugin-prepare.yml tools/.ui-tooltip-plugin-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: clean failed tooltip preparation"
          git push origin HEAD:dev
