name: fix-F1 final release identity

on:
  push:
    branches: [fix-F1]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-f1-finalize.yml
          node tools/dev-assistant.mjs prepare
          node tools/check-all.mjs
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/fix-f1-finalize\.yml|VERSION|site/wrt/data/site-version\.json)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected finalization path: $path"; exit 1; }
          done

      - name: Commit final release identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name weigefenxiang
          git config user.email 119787190+weigefenxiang@users.noreply.github.com
          git add -A
          git commit -m "chore: finalize fix-F1 release identity" \
            -m "Regenerate the official project version and fingerprint against the clean modularized fix-F1 tree after removing all temporary execution helpers."
          git push origin HEAD:fix-F1
